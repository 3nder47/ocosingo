<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosko</title><meta name="robots" content="noindex">
<script>
/* Kiosko se mudó a la dirección principal (cambio definitivo). Esta carpeta solo redirige, conservando la página, la
   consulta y el fragmento (fichas de producto con #nombre). */
(function(){
  var dest = '../' + 'analisis.html' + location.search + location.hash;
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistration('./').then(function(r){ if (r && r.scope.indexOf('/nueva/') > -1) r.unregister(); }); } catch (e) {}
  location.replace(dest);
})();
</script></head>
<body style="font-family:system-ui;background:#111214;color:#F5F5F7;display:grid;place-items:center;min-height:100vh;margin:0">
<p>Kiosko cambió de dirección. <a style="color:#9BBCFF" href="../">Abrir Kiosko</a></p></body></html>
