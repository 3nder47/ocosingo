<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E15" media="(prefers-color-scheme: dark)">
<title>Ocosingo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ocosingo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- TOKENS ---------- */
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --card-2:#F7F8FB;
  --ink:#0F1222; --muted:#6B7080; --line:rgba(15,18,34,.08);
  --selva:#1D9E75; --selva-soft:#E3F5EE; --selva-ink:#0F5C44;
  --mango:#F59E0B; --mango-soft:#FFF3D6;
  --danger:#E5484D; --danger-soft:#FDECEC;
  --hero-a:#10261F; --hero-b:#1D9E75;
  --shadow:0 1px 2px rgba(15,18,34,.04),0 8px 24px -12px rgba(15,18,34,.12);
  --nav-blur:rgba(255,255,255,.72);
  --ease:cubic-bezier(.32,.72,0,1);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C0E15; --card:#171A24; --card-2:#1E222E;
    --ink:#F5F6FA; --muted:#8B90A0; --line:rgba(255,255,255,.08);
    --selva-soft:rgba(29,158,117,.18); --selva-ink:#8FE0C4;
    --mango-soft:rgba(245,158,11,.16); --danger-soft:rgba(229,72,77,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    --nav-blur:rgba(23,26,36,.72);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--selva);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:28px}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.brand-mark{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--hero-b),var(--hero-a));display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;letter-spacing:-.04em;box-shadow:0 12px 32px -10px rgba(29,158,117,.6)}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.brand p{font-size:14px;color:var(--muted);margin-top:-6px}
.pin-dots{display:flex;gap:16px;height:16px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:all .18s var(--ease)}
.pin-dots span.on{background:var(--ink);border-color:var(--ink);transform:scale(1.15)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.key{width:76px;height:76px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:28px;font-weight:600;display:grid;place-items:center;transition:transform .12s var(--ease),background .12s}
.key:active{transform:scale(.92);background:var(--card-2)}
.key.ghost{background:transparent;box-shadow:none;font-size:15px;font-weight:600;color:var(--muted)}
.login-err{min-height:20px;font-size:14px;color:var(--danger);font-weight:600}

/* ---------- APP SHELL ---------- */
#app{padding-bottom:120px;max-width:640px;margin:0 auto}
.header{padding:22px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.header .eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.header h2{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:2px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--selva-ink);border:1px solid var(--line);transition:transform .12s var(--ease)}
.avatar:active{transform:scale(.92)}
.content{padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
.view{animation:rise .35s var(--ease)}
.hero{transition:transform .2s var(--ease)}
.hero:active{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:18px 6px 8px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,var(--hero-b) 0%,transparent 55%),linear-gradient(160deg,#173A30 0%,var(--hero-a) 100%);
  box-shadow:0 20px 40px -20px rgba(16,38,31,.55)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .lbl{font-size:13px;font-weight:600;opacity:.75}
.hero .val{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:6px}
.hero .sub{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px)}

/* ---------- GROUPED LIST ---------- */
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line)}
.row.plain+.row.plain::before{left:16px}
.row.tap{transition:background .12s}
.row.tap:active{background:var(--card-2)}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--selva-ink);background:var(--selva-soft)}
.ico.mango{background:var(--mango-soft);color:#8A5A00}
.ico.danger{background:var(--danger-soft);color:var(--danger)}
.ico.grey{background:var(--card-2);color:var(--muted)}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.row .v{font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.row .v.pos{color:var(--selva)}
.row .v.neg{color:var(--danger)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.stat b.pos{color:var(--selva)}

/* ---------- CHART ---------- */
.chart-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 12px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.chart-head b{font-size:15px;font-weight:700}
.chart-head span{font-size:12px;font-weight:600;color:var(--muted)}
.chart{height:190px;position:relative;margin-top:8px;touch-action:pan-y}
.chart svg{width:100%;height:100%;overflow:visible}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}

/* ---------- SEARCH / SEGMENTED ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:6px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;border:0;background:none;outline:0;font-size:16px;font-weight:500}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px;margin:14px 0 10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .18s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.mango{background:var(--mango)} .dot.selva{background:var(--selva)}

/* ---------- FLOATING NAV ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:420px;
  background:var(--nav-blur);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);border-radius:999px;padding:8px;display:grid;grid-template-columns:1fr 1fr 64px 1fr;align-items:center;gap:4px;
  box-shadow:0 20px 40px -16px rgba(15,18,34,.3);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:999px;font-size:11px;font-weight:700;color:var(--muted);transition:all .18s var(--ease)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--selva-ink)}
.nav button:active{transform:scale(.9)}
.fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--hero-b),#12664D);color:#fff!important;display:grid!important;place-items:center;box-shadow:0 10px 24px -8px rgba(29,158,117,.7);margin:-8px auto;padding:0!important}
.fab svg{width:26px!important;height:26px!important;stroke-width:2.5!important}

/* ---------- SHEET ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,18,34,.4);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.handle{width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.prod{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow)}
.prod b{font-size:15px;font-weight:700}
.prod .p{font-size:18px;font-weight:800;color:var(--selva);letter-spacing:-.02em}
.field{margin-top:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:4px}
.opts{display:flex;gap:8px}
.opt{flex:1;padding:12px 8px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;text-align:center;border:2px solid transparent;transition:all .15s var(--ease)}
.opt:active{transform:scale(.96)}
.opt.on{border-color:var(--selva);background:var(--selva-soft);color:var(--selva-ink)}
.money{display:flex;align-items:center;background:var(--card);border-radius:14px;padding:0 16px;box-shadow:var(--shadow)}
.money span{font-weight:700;color:var(--muted)}
.money input{flex:1;border:0;background:none;outline:0;padding:14px 8px;font-size:17px;font-weight:600}
.btn{width:100%;padding:17px;border-radius:16px;font-size:16px;font-weight:800;transition:all .18s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--muted);padding:12px}
.user{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;border:2px solid transparent}
.user.on{border-color:var(--selva)}
.user .avatar{box-shadow:none;background:var(--selva-soft)}
.user b{display:block;font-size:15px}
.user small{color:var(--muted);font-size:12px;font-weight:500}


/* ---------- CATÁLOGO v2 ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--muted);border:2px solid transparent;transition:all .2s var(--ease)}
.cat:active{transform:scale(.94)}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat .n{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.cat.on .n{background:rgba(255,255,255,.18);color:var(--bg)}
.view-toggle{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:all .15s var(--ease)}
.view-toggle:active{transform:scale(.9)}
.view-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:120px;transition:transform .15s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .cat-tag{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile b{font-size:14px;font-weight:700;line-height:1.25;flex:1}
.tile .p{font-size:18px;font-weight:800;color:var(--selva);letter-spacing:-.02em}
.stock{display:flex;gap:3px;align-items:center}
.stock i{width:6px;height:6px;border-radius:50%;background:var(--selva);opacity:.9}
.stock i.off{background:var(--line)}
.stock small{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px}
.stagger>*{animation:rise .4s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.11s}.stagger>*:nth-child(5){animation-delay:.14s}.stagger>*:nth-child(6){animation-delay:.17s}.stagger>*:nth-child(n+7){animation-delay:.2s}

/* ---------- VENTA: review + hold ---------- */
.review{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.review .row{min-height:48px;padding:11px 16px}
.review .row+.row::before{left:16px}
.review .t b{font-size:14px;font-weight:600;color:var(--muted)}
.review .v{font-size:15px}
.review .total{background:var(--selva-soft)}
.review .total .t b{color:var(--selva-ink)}
.review .total .v{color:var(--selva-ink);font-size:18px;font-weight:800}
.hold{position:relative;overflow:hidden;width:100%;padding:18px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;inset:0;width:0;background:var(--selva);transition:width .9s linear}
.hold.go .fill{width:100%}
.hold span{position:relative;z-index:1}
.hold:disabled{opacity:.4}
.calc{display:flex;justify-content:space-between;padding:10px 14px 0;font-size:13px;font-weight:600;color:var(--muted)}
.calc b{color:var(--ink)}

/* ---------- SUCCESS ---------- */
.success{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade .25s}
.check{width:96px;height:96px;border-radius:50%;background:var(--selva);display:grid;place-items:center;animation:pop .5s var(--ease)}
.check svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s var(--ease) forwards}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h3{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.success p{color:var(--muted);font-weight:600}
.confetti{position:absolute;width:10px;height:10px;border-radius:3px;animation:fall 1.4s var(--ease) forwards;opacity:0}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* ---------- VENTAS v2 ---------- */
.day{display:flex;justify-content:space-between;align-items:baseline;padding:18px 6px 8px}
.day b{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day span{font-size:13px;font-weight:700;color:var(--ink)}
.status{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.status.mango{background:var(--mango-soft);color:#8A5A00}.status.selva{background:var(--selva-soft);color:var(--selva-ink)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 16px;position:relative}
.vrow+.vrow::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.vrow .name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow .amt{font-size:16px;font-weight:800;text-align:right;letter-spacing:-.02em}
.vrow .gain{font-size:12px;font-weight:700;color:var(--selva);text-align:right}

/* quick sale */
.quick-hint{font-size:13px;color:var(--muted);font-weight:600;padding:4px 4px 10px}

/* ---------- STATES ---------- */
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;font-weight:600}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:50;box-shadow:var(--shadow);animation:drop .3s var(--ease);max-width:calc(100% - 32px)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.toast.ok{background:var(--selva)} .toast.err{background:var(--danger);color:#fff}

/* ========== v3: playful & motion ========== */
.header h2{transition:opacity .2s}
.avatar.u-irene{background:var(--selva-soft);color:var(--selva-ink)}
.avatar.u-mama{background:var(--mango-soft);color:#8A5A00}
.avatar.u-alex{background:var(--ink);color:var(--bg)}
.user .avatar.u-irene,.user .avatar.u-mama,.user .avatar.u-alex{box-shadow:none}

/* hero con anillo */
.hero{display:flex;align-items:center;gap:14px}
.hero-main{flex:1;min-width:0}
.ring{position:relative;width:88px;height:88px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .ring-bg{stroke:rgba(255,255,255,.14)}
.ring .ring-fg{stroke:#fff;stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1.1s var(--ease) .2s}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.ring-txt b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.ring-txt small{font-size:8.5px;font-weight:700;opacity:.7;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.hero.refresh .val{animation:blink .5s}
.ring.record .ring-fg{stroke:var(--mango)}
.ring.record .ring-txt b{color:var(--mango)}
.ring.record{animation:recordpulse 2.4s ease-in-out infinite}
@keyframes recordpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{50%{opacity:.5}}

/* sparkline en fila */
.spark{width:56px;height:22px;flex-shrink:0;margin-right:2px}
.spark path{fill:none;stroke:var(--selva);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw2 1s var(--ease) .2s forwards}
.spark circle{fill:var(--selva)}
@keyframes draw2{to{stroke-dashoffset:0}}

/* barras del historial */
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow .7s var(--ease) both;fill:var(--selva);opacity:.35;rx:4}
.bar.cur{opacity:1}
.bar.hit{opacity:.75}
@keyframes grow{from{transform:scaleY(0)}}

/* puntos de stock en cascada */
.stock i{animation:dotin .35s var(--ease) both}
.stock i:nth-child(1){animation-delay:.05s}.stock i:nth-child(2){animation-delay:.1s}.stock i:nth-child(3){animation-delay:.15s}.stock i:nth-child(4){animation-delay:.2s}.stock i:nth-child(5){animation-delay:.25s}
@keyframes dotin{from{transform:scale(0);opacity:0}}
.stock-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.stock-line.low{color:#8A5A00}
.stock-line.low .stock i{background:var(--mango)}

/* pull-to-refresh */
.ptr{position:fixed;left:50%;top:calc(-52px + env(safe-area-inset-top));transform:translate(-50%,0);width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--hero-b),var(--hero-a));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.04em;box-shadow:0 10px 24px -8px rgba(29,158,117,.6);z-index:25;transition:transform .25s var(--ease);will-change:transform}
.ptr.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:translate(-50%,var(--ptr-y,70px)) rotate(360deg)}}

/* hold: anillo de progreso */
.hold{display:flex;align-items:center;justify-content:center;gap:12px}
.hold-ring{width:26px;height:26px;position:relative;z-index:1;transform:rotate(-90deg);flex-shrink:0}
.hold-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.hold-ring .a{stroke:rgba(255,255,255,.22)}
.hold-ring .b{stroke:#fff;stroke-dasharray:62.8;stroke-dashoffset:62.8;transition:stroke-dashoffset .9s linear}
.hold.go .hold-ring .b{stroke-dashoffset:0}
.hold.go{transform:scale(.985)}

/* miniaturas de producto */
.thumb{width:46px;height:46px;border-radius:12px;flex-shrink:0;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--ph,var(--selva));letter-spacing:-.03em}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.thumb img.ok{opacity:1}
.thumb.lg{width:64px;height:64px;border-radius:16px;font-size:22px}
/* placeholder con ícono de categoría */
.thumb .ph{width:46%;height:46%;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thumb{background:var(--ph,var(--selva));background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(0,0,0,.08))}

/* cuadrícula con foto protagonista */
.tile{padding:0;overflow:hidden;gap:0;min-height:0;position:relative;border-radius:18px}
.tile .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;margin:0;font-size:32px}
.tile .thumb .ph{width:34%;height:34%}
.tile .info{padding:10px 12px 11px;display:flex;flex-direction:column;gap:4px}
.tile .info b{font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tile .info .p{font-size:16px}
.tile .low{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--mango);color:#1a1200;text-transform:uppercase;letter-spacing:.04em}

/* encabezado tipo "reproductor": la foto desenfocada envuelve la portada */
.gal-wrap{position:relative;margin:-10px -18px 16px;padding:10px 30px 26px;overflow:hidden;isolation:isolate;border-radius:26px 26px 0 0}
.gal-bg{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.9);transform:scale(1.2);z-index:-3}
.gal-tint{position:absolute;inset:0;z-index:-2;background:radial-gradient(110% 70% at 50% 15%,var(--tint,transparent) 0%,transparent 75%);opacity:.75;transition:opacity .4s}
.gal-fade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,rgba(0,0,0,.08) 45%,rgba(0,0,0,0) 70%,var(--bg) 100%)}
.gal-wrap .handle{background:rgba(255,255,255,.55);margin-bottom:12px}
.gal-wrap h3{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45);margin-bottom:16px}
.gal-wrap .gal{margin:0;border-radius:20px;box-shadow:0 30px 50px -22px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.25)}
.gal-wrap .gal-track .thumb{aspect-ratio:5/4}
.gal-wrap+.prod.compact{margin-top:0}
/* galería en hoja de venta */
.gal{position:relative;margin:-4px 0 12px;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal-track::-webkit-scrollbar{display:none}
.gal-track .thumb{flex:0 0 100%;width:100%;height:auto;aspect-ratio:4/3;border-radius:0;font-size:40px;scroll-snap-align:start}
.gal-track .thumb .ph{width:28%;height:28%}
.gal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s}
.gal-dots i.on{background:#fff;width:16px;border-radius:4px}
.gal .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(4px)}
.prod.compact{box-shadow:none;background:transparent;padding:0 4px}

/* franjas del catálogo (por agotarse / más stock) */
.strip-h{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip-h::-webkit-scrollbar{display:none}
.mini{flex:0 0 108px;scroll-snap-align:start;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:left;position:relative;transition:transform .15s var(--ease)}
.mini:active{transform:scale(.95)}
.mini .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;font-size:22px}
.mini .mi{padding:7px 9px 9px}
.mini .mi b{display:block;font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mi small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.mini .tag{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:999px;background:var(--mango);color:#1a1200;text-transform:uppercase;letter-spacing:.04em}
.mini .tag.two{background:var(--ink);color:var(--bg)}
.mini .tag.n{background:var(--selva);color:#fff;text-transform:none}
.cat-strips .section-title{padding-top:12px}
/* más vendidos del mes */
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left;position:relative}
.topc .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;font-size:26px}
.topc .rank{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center}
.topc .rank.gold{background:var(--mango);color:#1a1200}
.topc .ti{padding:8px 10px 10px}
.topc .ti b{display:block;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topc .ti small{display:block;font-size:11px;font-weight:700;color:var(--selva);margin-top:2px}

.topc{transition:transform .15s var(--ease)}
.topc:active{transform:scale(.96)}
.topc.out{opacity:.55}
.topc .ti em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.topc.out .ti em{color:var(--danger)}
.section-title .hint{float:right;text-transform:none;letter-spacing:0;font-weight:600;font-size:11.5px;opacity:.8}
/* éxito con foto */
.success .thumb.hero-img{width:120px;height:120px;border-radius:28px;font-size:44px;animation:pop .5s var(--ease)}
.success .badge-ok{width:44px;height:44px;border-radius:50%;background:var(--selva);display:grid;place-items:center;margin:-30px 0 0 80px;border:4px solid var(--bg);animation:pop .5s .15s var(--ease) both}
.success .badge-ok svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .35s var(--ease) forwards}

/* ventas con miniatura */
.vrow{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:4px 12px;align-items:center}
.vrow .thumb{grid-row:1/3;width:44px;height:44px}
.vrow .name{grid-column:2}.vrow .amt{grid-column:3}.vrow .meta{grid-column:2}.vrow .gain{grid-column:3}

/* estados vacíos con ilustración */
.empty svg{width:64px;height:64px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.6;margin:0 auto 12px;display:block}

/* login: latido sutil de la marca */
.brand-mark{animation:beat 3.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.key.hit{animation:keyhit .25s var(--ease)}
@keyframes keyhit{40%{transform:scale(.88)}}
</style>
</head>

<script>
/* ---------- API (Apps Script como backend JSON) ---------- */
/* La URL y el token viven en config.js (no en este archivo) para que
   actualizar index.html nunca obligue a volver a pegar el token. */
const API_URL=(window.OC_CONFIG||{}).API_URL||'';
const API_TOKEN=(window.OC_CONFIG||{}).API_TOKEN||'';
if(!API_URL||!API_TOKEN)console.error('Falta config.js con OC_CONFIG.API_URL y API_TOKEN');

async function api(accion,params={},body=null){
  if(!API_URL||!API_TOKEN){const e=new Error('Falta config.js en el repo (URL y token)');e.api=true;throw e;}
  const url=new URL(API_URL);
  const opts={redirect:'follow'};
  if(body){
    opts.method='POST';
    opts.headers={'Content-Type':'text/plain;charset=utf-8'}; // text/plain = sin preflight CORS
    opts.body=JSON.stringify({token:API_TOKEN,accion,...body});
  }else{
    url.search=new URLSearchParams({token:API_TOKEN,accion,...params}).toString();
  }
  const r=await fetch(url,opts);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok){const e=new Error(j.error||'Error del servidor');e.api=true;throw e;}
  return j.data;
}
const apiPost=(accion,body)=>api(accion,{},body);

/* Caché stale-while-revalidate:
   1) si hay copia local (y no está marcada sucia) la pinta al instante,
   2) pide datos frescos y vuelve a pintar,
   3) si no hay red, se queda con la copia local y avisa. */
const cacheKey=(a,p)=>'oc:'+a+':'+JSON.stringify(p||{});
function leerCache(k){try{const c=localStorage.getItem(k);return c?JSON.parse(c):null;}catch(e){return null;}}
function apiCached(accion,params,onData,onFail){
  const key=cacheKey(accion,params);
  const c=state.dirty?null:leerCache(key);
  if(c)onData(c.d,{stale:true});
  api(accion,params).then(d=>{
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d}));}catch(e){}
    state.dirty=false;
    onData(d,{stale:false});
  }).catch(err=>{
    if(err.api){toast(err.message,'err');if(!c)onFail&&onFail(err);return;}
    const old=c||leerCache(key);
    if(old){if(!c)onData(old.d,{stale:true});toast('Sin conexión · datos de '+relTime(old.t));return;}
    onFail&&onFail(err);
  });
}
function relTime(t){const m=Math.round((Date.now()-t)/60000);return m<1?'hace un momento':m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} días`;}

/* ---------- ICONOS / TEXTOS ---------- */
const ICONS = {
  cash:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="M3 7.5V17l9 4 9-4V7.5"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  moto:'<svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h6l3-7h3M9 10h4"/></svg>',
  sum:'<svg viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
};
const ILLU = {
  box:'<svg viewBox="0 0 64 64"><path d="M10 24 32 14l22 10-22 10z"/><path d="M10 24v20l22 10 22-10V24"/><path d="M32 34v20"/><path d="M21 19l22 10"/></svg>',
  leaf:'<svg viewBox="0 0 64 64"><path d="M14 50C14 26 30 14 52 12c0 24-12 38-36 40z"/><path d="M14 50c8-12 18-20 30-26"/></svg>',
  search:'<svg viewBox="0 0 64 64"><circle cx="28" cy="28" r="16"/><path d="m40 40 12 12"/><path d="M22 28h12"/></svg>',
  wifi:'<svg viewBox="0 0 64 64"><path d="M8 26c14-12 34-12 48 0"/><path d="M16 36c9-8 23-8 32 0"/><path d="M24 46c4-4 12-4 16 0"/><circle cx="32" cy="54" r="1.5"/></svg>'
};
const HELP = {
  hoy:'Ventas de hoy pendientes de transferir.',
  gIrene:'Ganancia neta de Irene en ventas no transferidas.',
  gAlex:'Ganancia de Alex en ventas no transferidas.',
  moto:'Gastos de motomandado en ventas no transferidas.',
  totalMes:'Total vendido este mes, incluidas las transferidas. La línea muestra los últimos 7 días.',
  artMes:'Artículos vendidos este mes, transferidos o no.',
  pend:'Número de ventas pendientes de transferir.'
};
const CAT_ICONS=[
  [/aud[ií]fono|auricular|earbud|tws/,'<svg viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="13" width="4" height="7" rx="2"/></svg>'],
  [/altavoz|bocina|speaker|parlante/,'<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3.5"/><circle cx="12" cy="7.5" r="1"/></svg>'],
  [/watch|reloj/,'<svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6V3h6v3M9 18v3h6v-3"/><path d="M12 10v3l2 1"/></svg>'],
  [/herramienta|desarmador|destornillador|corta|kit/,'<svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg>'],
  [/incubadora|huevo|pollo/,'<svg viewBox="0 0 24 24"><path d="M12 3c4 4 6 8 6 12a6 6 0 0 1-12 0c0-4 2-8 6-12z"/></svg>'],
  [/mesa|silla|mueble/,'<svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M19 9v10M8 9v6M16 9v6"/></svg>'],
  [/tv|pantalla|tele/,'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>'],
  [/bater[ií]a|power|cargador|cable/,'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>'],
  [/espejo|maquillaje|belleza/,'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M12 15v6M8 21h8"/></svg>'],
  [/wifi|repetidor|router/,'<svg viewBox="0 0 24 24"><path d="M3 9c5-5 13-5 18 0M6.5 12.5c3-3 8-3 11 0M10 16c1-1 3-1 4 0"/><circle cx="12" cy="19" r="1"/></svg>'],
];
const ICON_BOX='<svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="M3 7.5V17l9 4 9-4V7.5"/><path d="M12 12v9"/></svg>';
function catIcon(cat){const c=String(cat||'').toLowerCase();for(const [re,svg] of CAT_ICONS)if(re.test(c))return svg;return ICON_BOX;}
const PH_COLORS=['#1D9E75','#F59E0B','#3B82F6','#A855F7','#E5484D','#0EA5E9','#10B981','#F97316'];
function phColor(cat){let h=0;for(const c of String(cat||''))h=(h*31+c.charCodeAt(0))>>>0;return PH_COLORS[h%PH_COLORS.length];}
/* Miniatura: si hay URL la carga en segundo plano; si falla o no hay, queda la inicial con color de categoría. */
function thumb(p,cls='',src){
  const url=src!==undefined?src:p.imagen;
  const img=url?`<img src="${esc(url)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.remove()">`:'';
  return`<div class="thumb ${cls}" style="--ph:${phColor(p.categoria)}">${catIcon(p.categoria).replace('<svg','<svg class="ph"')}${img}</div>`;
}
function vacio(illu,titulo,texto){return`<div class="empty">${ILLU[illu]||''}<b>${titulo}</b>${texto||''}</div>`;}

const buzz=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- NÚMEROS QUE RUEDAN ---------- */
/* Anima desde el último valor pintado (data-val) hasta el nuevo. */
function tick(el,val,{prefix='$',fmt=money,dur=800}={}){
  if(!el)return;
  const from=Number(el.dataset.val)||0,to=Number(val)||0;el.dataset.val=to;
  if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=prefix+fmt(to);return;}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=prefix+fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
const entero=x=>String(Math.round(x));

/* ---------- LOGIN ---------- */
function buildKeypad(){
  const k=document.getElementById('keypad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(d=>{
    const b=document.createElement('button');
    b.className='key'+(d===''||d==='⌫'?' ghost':'');b.textContent=d;
    if(d!=='')b.onclick=()=>{b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');tecla(d);};
    k.appendChild(b);
  });
}
function tecla(d){
  if(state.busy)return;buzz();
  if(d==='⌫')state.pin=state.pin.slice(0,-1);else if(state.pin.length<4)state.pin+=d;
  document.getElementById('login-err').textContent='';
  pintarDots();
  if(state.pin.length===4)validarPin();
}
function pintarDots(){document.querySelectorAll('#dots span').forEach((s,i)=>s.classList.toggle('on',i<state.pin.length));}
function validarPin(){
  state.busy=true;
  apiPost('verificarPin',{pin:state.pin}).then(res=>{
    state.busy=false;
    if(res.valido){entrar(res.vendedor);}
    else{fallo('PIN incorrecto');}
  }).catch(err=>{state.busy=false;fallo(err.api?err.message:'Sin conexión ('+(err&&err.message||err)+')');});
}
function fallo(msg){
  const d=document.getElementById('dots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);
  document.getElementById('login-err').textContent=msg;state.pin='';pintarDots();
}
function entrar(u){
  state.usuario=u;state.pin='';pintarDots();

  document.getElementById('app').classList.remove('hidden');

/* ---------- PULL TO REFRESH ---------- */
function sheetAbierta(){return[...document.querySelectorAll('.overlay')].some(o=>!o.classList.contains('hidden'))||!document.getElementById('login').classList.contains('hidden');}
function setupPullToRefresh(){
  const el=document.getElementById('ptr');let y0=null,d=0,armed=false;
  document.addEventListener('touchstart',e=>{if(window.scrollY>2||sheetAbierta()){y0=null;return;}y0=e.touches[0].clientY;d=0;armed=false;},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(y0===null)return;d=e.touches[0].clientY-y0;
    if(d<=0){el.style.transform='';return;}
    const y=Math.min(d*.6,90);
    el.style.transform=`translate(-50%,${y}px) rotate(${d*1.6}deg)`;
    if(d>110&&!armed){armed=true;buzz(12);}
  },{passive:true});
  const fin=()=>{
    if(y0===null)return;
    if(d>110){el.style.setProperty('--ptr-y','70px');el.style.transform='translate(-50%,70px)';el.classList.add('spin');refrescar(()=>{el.classList.remove('spin');el.style.transform='';});}
    else el.style.transform='';
    y0=null;d=0;
  };
  document.addEventListener('touchend',fin);document.addEventListener('touchcancel',fin);
}

let ringHelp='';
/* Anillo: ventas de este mes comparadas con el mejor mes anterior (récord). Sin metas fijas. */
function renderRing(d,meses){
  const $=id=>document.getElementById(id);
  const prev=meses.slice(0,-1);                       // el último elemento es el mes actual
  const best=prev.reduce((a,m)=>m.total>a.total?m:a,{total:0,label:''});
  const actual=d.ventasTotalesMes||0;
  let pct=0,lbl='de tu<br>mejor mes';
  if(best.total>0){
    pct=actual/best.total;
    if(pct>=1){lbl='¡nuevo<br>récord!';$('h-ringbox').classList.add('record');}
    else{lbl=`del récord<br>${esc(best.label.split(' ')[0].toLowerCase())}`;$('h-ringbox').classList.remove('record');}
    ringHelp=pct>=1?`Este mes ya superó tu mejor mes (${best.label}, $${money(best.total)}).`:`Llevas $${money(actual)} este mes; tu mejor mes fue ${best.label} con $${money(best.total)}.`;
  }else{ringHelp='Cuando haya más de un mes de ventas, aquí verás cómo va este mes contra tu mejor mes.';}
  $('h-ringlbl').innerHTML=lbl;
  $('h-ring').style.strokeDashoffset=213.6*(1-Math.min(1,pct));
  tick($('h-pct'),Math.min(999,pct*100),{prefix:'',fmt:x=>Math.round(x)+'%'});
}
function fila(ico,label,id,cls,help,tone='',sub='',extra=''){
  return `<div class="row tap" onclick="toast(HELP.${help})">
    <div class="ico ${tone}">${ICONS[ico]}</div>
    <div class="t"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</div>${extra}
    <div class="v ${cls} num" id="${id}">—</div></div>`;
}
function renderSpark(v){
  const s=document.getElementById('spark');if(!s)return;
  const firma=v.join(',');if(s.dataset.firma===firma)return;s.dataset.firma=firma;
  const max=Math.max(...v,1),W=72,H=26,P=3;
  const pts=v.map((x,i)=>[P+i*((W-2*P)/6),H-P-(x/max)*(H-2*P)]);
  const path=pts.map((p,i)=>{if(!i)return`M${p[0]},${p[1]}`;const q=pts[i-1],cx=(q[0]+p[0])/2;return`C${cx},${q[1]} ${cx},${p[1]} ${p[0]},${p[1]}`;}).join(' ');
  const l=pts[pts.length-1];
  s.innerHTML=`<path d="${path}"/><circle cx="${l[0]}" cy="${l[1]}" r="2.5"/>`;
}

/* ---------- CHART: barras ---------- */
function renderChart(data){
  const c=document.getElementById('chart');c.innerHTML='';
  const W=c.offsetWidth||320,H=190,P={t:22,r:6,b:26,l:6};
  const cw=W-P.l-P.r,ch=H-P.t-P.b,max=Math.max(...data.map(d=>d.total),100);
  const n=data.length,slot=cw/n,bw=Math.min(28,slot*.62);
  const bars=data.map((d,i)=>({x:P.l+i*slot+(slot-bw)/2,y:P.t+ch-(d.total/max)*ch,h:(d.total/max)*ch,d}));
  const step=n>6?2:1;
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;
  bars.forEach((b,i)=>{
    svg+=`<rect class="bar ${i===n-1?'cur':''}" data-i="${i}" x="${b.x}" y="${b.y}" width="${bw}" height="${Math.max(b.h,2)}" style="animation-delay:${i*45}ms"/>`;
    if((n-1-i)%step===0)svg+=`<text x="${b.x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">${b.d.label.split(' ')[0]}</text>`;
  });
  const last=bars[n-1];
  svg+=`<text x="${last.x+bw/2}" y="${last.y-7}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--selva)">$${money(last.d.total).replace(/\.00$/,'')}</text></svg><div class="tip" id="tip"></div>`;
  c.innerHTML=svg;
  const tip=document.getElementById('tip');let hit=null;
  const show=ev=>{
    const r=c.getBoundingClientRect(),x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const b=bars.reduce((a,q)=>Math.abs(q.x+bw/2-x)<Math.abs(a.x+bw/2-x)?q:a);
    if(hit)hit.classList.remove('hit');hit=c.querySelector(`.bar[data-i="${bars.indexOf(b)}"]`);hit.classList.add('hit');
    tip.textContent=`${b.d.label} · $${money(b.d.total)} · ${b.d.cantidad} art.`;
    tip.style.left=Math.max(60,Math.min(W-60,b.x+bw/2))+'px';tip.style.top=(b.y-10)+'px';tip.classList.add('on');
  };
  const hide=()=>{tip.classList.remove('on');if(hit){hit.classList.remove('hit');hit=null;}};
  c.addEventListener('touchstart',show,{passive:true});c.addEventListener('touchmove',show,{passive:true});c.addEventListener('touchend',hide);
  c.addEventListener('mousemove',show);c.addEventListener('mouseleave',hide);
}

function renderStrips(q){
  const w=document.getElementById('cat-strips');if(!w)return;

  const firma=JSON.stringify([bajos.map(p=>p.descripcion+p.stock),altos.map(p=>p.descripcion+p.stock)]);

function renderCatalogo(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  renderStrips(q);
  state.filtrado=state.catalogo.filter(p=>(state.cat==='Todas'||p.categoria===state.cat)&&(p.descripcion.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)));

  if(!state.filtrado.length){l.innerHTML=q?vacio('search','Nada con ese nombre','Prueba con otra palabra.'):vacio('box','Sin stock','Todo está vendido.');return;}
  if(state.grid){
    l.innerHTML=`<div class="grid stagger">${state.filtrado.map((p,i)=>`
      <button class="tile" onclick="elegir(${i})" style="text-align:left">
        ${thumb(p)}${Number(p.stock)===1?'<span class="low">Última</span>':''}
        <div class="info"><b>${esc(p.descripcion)}</b><span class="p num">$${money(p.precio)}</span>${stockDots(p.stock)}</div>
      </button>`).join('')}</div>`;
    return;
  }
  const cats={};state.filtrado.forEach((p,i)=>{(cats[p.categoria]=cats[p.categoria]||[]).push(i);});
  l.innerHTML=Object.keys(cats).sort().map(cat=>`
    ${state.cat==='Todas'?`<div class="section-title">${esc(cat)}</div>`:'<div style="height:6px"></div>'}
    <div class="group stagger">${cats[cat].map(i=>{const p=state.filtrado[i];return`
      <div class="row plain tap" onclick="elegir(${i})">
        ${thumb(p)}<div class="t"><b>${esc(p.descripcion)}</b>${stockDots(p.stock)}</div>
        <div class="v pos num">$${money(p.precio)}</div>
      </div>`}).join('')}</div>`).join('');
}
function elegir(i,lista){buzz(12);const p=(lista||state.filtrado)[i];state.producto=p;state.vendedor=state.usuario;state.metodo=null;state.paso=1;cerrarQuick();abrirVenta();}

/* ---------- VENTA RÁPIDA (+) ---------- */
function abrirQuick(){
  buzz();document.getElementById('qsearch').value='';
  document.getElementById('sheet-quick').classList.remove('hidden');
  const go=()=>{renderQuick();setTimeout(()=>document.getElementById('qsearch').focus(),350);};
  if(state.catalogo.length)go();else{document.getElementById('quick-list').innerHTML='<div class="sk" style="height:200px"></div>';apiCached('catalogo',{},d=>{if(!d.error){state.catalogo=d;go();}},()=>document.getElementById('quick-list').innerHTML=vacio('wifi','Sin conexión','No se pudo cargar el catálogo.'));}
}
let quickLista=[];
function renderQuick(){
  const q=document.getElementById('qsearch').value.trim().toLowerCase();
  const l=document.getElementById('quick-list');
  const fila=(p,i)=>`<div class="row plain tap" onclick="elegir(${i},quickLista)">
      ${thumb(p)}<div class="t"><b>${esc(p.descripcion)}</b><small>${esc(p.categoria)} · ${p.stock} disp.</small></div>
      <div class="v pos num">$${money(p.precio)}</div></div>`;
  if(q){
    quickLista=state.catalogo.filter(p=>p.descripcion.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)).sort((a,b)=>b.stock-a.stock).slice(0,30);
    if(!quickLista.length){l.innerHTML=vacio('search','Nada con ese nombre');return;}
    l.innerHTML=`<div class="quick-hint">Resultados</div><div class="group stagger">${quickLista.map(fila).join('')}</div>`;return;
  }
  const rec=state.recientes.map(d=>state.catalogo.find(p=>p.descripcion===d)).filter(Boolean);
  const masStock=[...state.catalogo].filter(p=>!rec.includes(p)).sort((a,b)=>b.stock-a.stock).slice(0,8);
  quickLista=[...rec,...masStock];
  if(!quickLista.length){l.innerHTML=vacio('box','Sin stock','Todo está vendido.');return;}
  l.innerHTML=(rec.length?`<div class="quick-hint">Vendidos recientemente</div><div class="group stagger">${rec.map((p,i)=>fila(p,i)).join('')}</div>`:'')+
    (masStock.length?`<div class="quick-hint" style="padding-top:14px">Con más stock</div><div class="group stagger">${masStock.map((p,i)=>fila(p,i+rec.length)).join('')}</div>`:'');
}
function cerrarQuick(){document.getElementById('sheet-quick').classList.add('hidden');}

/* ---------- VENTA ---------- */
function gananciaEst(){
  const p=state.producto,extra=Number(state.cobro)||0,g=Number(state.gastos)||0;
  return state.vendedor==='Irene'?p.precio+extra-(Number(p.costoFinal)||0)-g:p.precio+extra-g;
}
function abrirVenta(){
  if(!state.producto){abrirQuick();return;}
  state.paso=1;pintarVenta();
  document.getElementById('sheet-venta').classList.remove('hidden');
}
function stockLinea(p){
  const n=Number(p.stock)||0,low=n<=1;
  return`<div class="stock-line ${low?'low':''}">${stockDots(n,true)}<span>${n===1?'Última pieza':n+' en stock'}</span></div>`;
}
function pintarVenta(){
  const p=state.producto,body=document.getElementById('venta-body'),foot=document.getElementById('venta-foot');
  if(state.paso===1){
    document.getElementById('venta-titulo').textContent='Registrar venta';
    const fotos=[p.imagen,...(p.extras||[])].filter(Boolean);
    const gal=`<div class="gal"><div class="gal-track" id="gal" onscroll="galDots(this)">${(fotos.length?fotos:['']).map(u=>thumb(p,'',u)).join('')}</div>
        ${fotos.length>1?`<div class="gal-dots" id="gal-dots">${fotos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><span class="badge">${fotos.length} fotos</span>`:''}</div>`;
    const outer=document.getElementById('venta-titulo');
    outer.style.display=fotos.length?'none':'';outer.previousElementSibling.style.display=fotos.length?'none':'';
    body.innerHTML=`
      ${fotos.length?`<div class="gal-wrap" id="gal-wrap"><div class="gal-bg" id="gal-bg" style="background-image:url('${esc(fotos[0])}')"></div><div class="gal-tint"></div><div class="gal-fade"></div><div class="handle"></div><h3>Registrar venta</h3>${gal}</div>`:gal}
      <div class="prod compact"><div style="min-width:0;flex:1"><b>${esc(p.descripcion)}</b><small style="display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px">Costo $${money(p.costoFinal)}</small>${stockLinea(p)}</div><span class="p num">$${money(p.precio)}</span></div>
      <div class="field"><label>Vendedor</label><div class="opts">${['Irene','Mamá','Alex'].map(v=>`<button class="opt ${state.vendedor===v?'on':''}" onclick="setVend('${v}')">${v}</button>`).join('')}</div></div>
      <div class="field"><label>Método de pago</label><div class="opts">
        <button class="opt ${state.metodo==='Efectivo a Irene'?'on':''}" onclick="setMetodo('Efectivo a Irene')">Efectivo a Irene</button>
        <button class="opt ${state.metodo==='Transferencia directa a Alex'?'on':''}" onclick="setMetodo('Transferencia directa a Alex')">Transferencia</button>
      </div></div>
      <div class="field"><label>Cobro extra</label><div class="money"><span>$</span><input id="cobro" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${state.cobro||''}" oninput="guardarInputs();pintarCalc()"></div></div>
      <div class="field"><label>Motomandado / gastos</label><div class="money"><span>$</span><input id="gastos" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${state.gastos||''}" oninput="guardarInputs();pintarCalc()"></div></div>
      <div class="calc" id="calc"></div>`;
    pintarCalc();if(fotos.length)tintDesde(fotos[0],document.getElementById('gal-wrap'));
    foot.innerHTML=`<button class="btn primary" id="btn-next" onclick="revisar()" ${state.vendedor&&state.metodo?'':'disabled'}>Revisar venta</button><button class="btn ghost" onclick="cerrarVenta()">Cancelar</button>`;
  }else{
    const outer=document.getElementById('venta-titulo');outer.style.display='';outer.previousElementSibling.style.display='';outer.textContent='¿Confirmar venta?';
    const extra=Number(state.cobro)||0,g=Number(state.gastos)||0;
    const r=(a,b,cls='')=>`<div class="row ${cls}"><div class="t"><b>${a}</b></div><div class="v num">${b}</div></div>`;
    body.innerHTML=`<div class="review">
      ${r('Producto',esc(p.descripcion))}
      ${r('Precio','$'+money(p.precio))}
      ${extra?r('Cobro extra','+$'+money(extra)):''}
      ${g?r('Motomandado','−$'+money(g)):''}
      ${r('Costo','$'+money(p.costoFinal))}
      ${r('Vendedor',state.vendedor)}
      ${r('Pago',state.metodo==='Efectivo a Irene'?'Efectivo a Irene':'Transferencia a Alex')}
      ${r('Ganancia '+(state.vendedor==='Irene'?'Irene':state.vendedor),'$'+money(gananciaEst()),'total')}
    </div>
    <p style="font-size:13px;color:var(--muted);font-weight:600;text-align:center;margin-top:14px">Esto descuenta 1 del inventario${Number(p.stock)===1?' (era la última pieza)':''} y no se puede deshacer desde la app.</p>`;
    foot.innerHTML=`<button class="hold" id="hold"><div class="fill"></div><svg class="hold-ring" viewBox="0 0 24 24"><circle class="a" cx="12" cy="12" r="10"/><circle class="b" cx="12" cy="12" r="10"/></svg><span>Mantén presionado para confirmar</span></button><button class="btn ghost" onclick="state.paso=1;pintarVenta()">← Corregir</button>`;
    setupHold();
  }
}
function galDots(t){const i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('#gal-dots i').forEach((d,k)=>d.classList.toggle('on',k===i));const bg=document.getElementById('gal-bg'),img=t.children[i]&&t.children[i].querySelector('img');if(bg&&img&&bg.dataset.src!==img.src){bg.dataset.src=img.src;bg.style.backgroundImage=`url('${img.src}')`;tintDesde(img.src,document.getElementById('gal-wrap'));}}
/* Color dominante de la foto (si el servidor permite leerla desde canvas); si no, no pasa nada. */
const tintCache={};
function tintDesde(url,el){
  if(!el)return;
  if(tintCache[url]){el.style.setProperty('--tint',tintCache[url]);return;}
  try{
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{try{
      const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(im,0,0,24,24);
      const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,n=0;
      for(let i=0;i<d.length;i+=4){const R=d[i],G=d[i+1],B=d[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B);const sat=mx?(mx-mn)/mx:0,lum=mx/255;const w=0.05+sat*sat*2*(lum>0.12?1:0.2);r+=R*w;g+=G*w;b+=B*w;n+=w;}
      if(!n)return;const col=`rgb(${r/n|0},${g/n|0},${b/n|0})`;tintCache[url]=col;if(document.body.contains(el))el.style.setProperty('--tint',col);
    }catch(e){}};
    im.src=url;
  }catch(e){}
}
function pintarCalc(){const c=document.getElementById('calc');if(!c||!state.vendedor)return;c.innerHTML=`<span>Ganancia estimada</span><b class="num" id="calc-v"></b>`;tick(document.getElementById('calc-v'),gananciaEst(),{dur:350});}
function guardarInputs(){state.cobro=document.getElementById('cobro')?.value||'';state.gastos=document.getElementById('gastos')?.value||'';}
function setVend(v){buzz();guardarInputs();state.vendedor=v;pintarVenta();}
function setMetodo(m){buzz();guardarInputs();state.metodo=m;pintarVenta();}
function revisar(){if(!state.vendedor||!state.metodo)return;buzz(12);guardarInputs();state.paso=2;pintarVenta();document.querySelector('#sheet-venta .sheet').scrollTo({top:0});}
function cerrarVenta(){const o=document.getElementById('venta-titulo');o.style.display='';o.previousElementSibling.style.display='';document.getElementById('sheet-venta').classList.add('hidden');state.cobro='';state.gastos='';state.paso=1;}
function setupHold(){
  const b=document.getElementById('hold');let t,tics=[];
  const down=e=>{e.preventDefault();if(b.disabled)return;buzz(15);b.classList.add('go');
    tics=[300,600].map(ms=>setTimeout(()=>buzz(6),ms));
    t=setTimeout(()=>{b.disabled=true;buzz(45);confirmarVenta();},900);};
  const up=()=>{clearTimeout(t);tics.forEach(clearTimeout);b.classList.remove('go');};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
}
function confirmarVenta(){
  const b=document.getElementById('hold');b.querySelector('span').textContent='Registrando…';
  const venta={descripcion:state.producto.descripcion,vendedor:state.vendedor,metodoPago:state.metodo,cobroExtra:state.cobro||'',gastosExt:state.gastos||''};
  apiPost('registrarVenta',{venta}).then(r=>{
    cerrarVenta();
    if(r.success){
      const vendido=state.producto;
      state.dirty=true;state.catFirma='';   // fuerza datos frescos en la siguiente carga
      // descuenta 1 localmente para que el catálogo se vea al día aunque tarde la red
      const it=state.catalogo.find(x=>x.descripcion===state.producto.descripcion&&x.categoria===state.producto.categoria);
      if(it){it.stock--;if(it.stock<=0)state.catalogo=state.catalogo.filter(x=>x!==it);}
      celebrar(r.detalle.id,vendido);state.producto=null;state.vendedor=null;state.metodo=null;
    }else{toast(r.error||'No se pudo registrar','err');}
  }).catch(err=>{b.disabled=false;b.classList.remove('go');b.querySelector('span').textContent='Mantén presionado para confirmar';toast(err.api?err.message:'Sin conexión, la venta no se guardó','err');});
}
function celebrar(id,p){
  const s=document.getElementById('success');
  const colors=['#1D9E75','#F59E0B','#E5484D','#3B82F6','#A855F7'];
  const visual=p?`${thumb(p,'hero-img')}<div class="badge-ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`
    :`<div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`;
  s.innerHTML=Array.from({length:26},(_,i)=>`<div class="confetti" style="left:50%;top:45%;background:${colors[i%5]};--dx:${(Math.random()-.5)*360}px;--dy:${(Math.random()-.5)*360}px;animation-delay:${Math.random()*.2}s"></div>`).join('')+
    `${visual}<h3>Venta registrada</h3><p>${p?esc(p.descripcion)+' · ':''}${esc(id)}</p>`;
  s.classList.remove('hidden');buzz([30,40,60]);
  setTimeout(()=>{s.classList.add('hidden');cambiarVista('dashboard');},1700);
}

/* ---------- MIS VENTAS ---------- */
function cargarVentas(){
  const l=document.getElementById('ventas-list');
  if(!state.ventas.length){
    document.getElementById('mini').innerHTML='<div class="sk" style="height:70px"></div>'.repeat(3);
    l.innerHTML='<div class="sk" style="height:200px"></div>';
  }
  apiCached('misVentas',{vendedor:state.usuario},(d,m)=>{
    if(d.resumen&&!d.resumen.error)renderMini(d.resumen);
    if(Array.isArray(d.ventas)){const firma=JSON.stringify(d.ventas);if(firma!==state.ventFirma){state.ventFirma=firma;state.ventas=d.ventas;renderVentas();}}
    if(!m.stale)listo();
  },()=>{l.innerHTML=vacio('wifi','No se pudieron cargar','Desliza hacia abajo para reintentar.');listo();});
}
function renderMini(d){
  const m=document.getElementById('mini');
  if(!m.querySelector('#m-pend'))m.innerHTML=`
    <div class="stat"><small>Pendientes</small><b class="num" id="m-pend">0</b></div>
    <div class="stat"><small>Mi ganancia</small><b class="num pos" id="m-gan">$0.00</b></div>
    <div class="stat"><small>Este mes</small><b class="num" id="m-mes">0</b></div>`;
  tick(document.getElementById('m-pend'),d.pendientes,{prefix:'',fmt:entero});
  tick(document.getElementById('m-gan'),d.ganancia);
  tick(document.getElementById('m-mes'),d.articulosMes,{prefix:'',fmt:entero});
}
function diaLabel(ts){
  const d=new Date(ts),h=new Date();h.setHours(0,0,0,0);
  const diff=Math.round((h-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(diff===0)return'Hoy';if(diff===1)return'Ayer';
  const D=['dom','lun','mar','mié','jue','vie','sáb'],M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return`${D[d.getDay()]} ${d.getDate()} ${M[d.getMonth()]}${d.getFullYear()!==h.getFullYear()?' '+d.getFullYear():''}`;
}
function renderVentas(){
  const l=document.getElementById('ventas-list');
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
  let v=state.ventas;
  if(state.filtro==='pendiente')v=v.filter(x=>x.estatusTransferencia!=='Transferido');
  if(state.filtro==='transferido')v=v.filter(x=>x.estatusTransferencia==='Transferido');
  if(state.filtro==='mes')v=v.filter(x=>x.fechaTimestamp>=m0.getTime());
  if(!v.length){l.innerHTML=vacio('leaf','Nada por aquí','No hay ventas con este filtro.');return;}
  const grupos={};v.forEach(x=>{const k=x.fechaTimestamp?new Date(x.fechaTimestamp).toDateString():'sin';(grupos[k]=grupos[k]||[]).push(x);});
  l.innerHTML=Object.keys(grupos).map(k=>{const g=grupos[k],tot=g.reduce((a,x)=>a+x.precio+x.cobroExtra,0);return`
    <div class="day"><b>${k==='sin'?'Sin fecha':diaLabel(g[0].fechaTimestamp)}</b><span class="num">${g.length} · $${money(tot)}</span></div>
    <div class="group stagger">${g.map(x=>{const ok=x.estatusTransferencia==='Transferido';const hh=x.fechaTimestamp?new Date(x.fechaTimestamp).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'';return`
      <div class="vrow">
        ${thumb(x)}<div class="name">${esc(x.descripcion)}</div>
        <div class="amt num">$${money(x.precio+x.cobroExtra)}</div>
        <div class="meta"><span class="status ${ok?'selva':'mango'}">${ok?'Transferido':'Pendiente'}</span><span>${hh}</span><span>${x.id}</span>${x.gastoExt?`<span>moto $${money(x.gastoExt)}</span>`:''}</div>
        <div class="gain num">+$${money(x.ganancia)}</div>
      </div>`}).join('')}</div>`}).join('');
}

/* ---------- USUARIO ---------- */
function abrirUsuarios(){
  const u=[['Irene','Ventas en Ocosingo'],['Mamá','Ventas ocasionales'],['Alex','Administrador']];
  document.getElementById('user-list').innerHTML=u.map(([n,d])=>`
    <button class="user ${state.usuario===n?'on':''}" onclick="cambiarUsuario('${n}')" style="width:100%;text-align:left">
      <div class="avatar ${claseUsuario(n)}">${n[0]}</div><div><b>${n}</b><small>${d}</small></div></button>`).join('');
  document.getElementById('sheet-usuario').classList.remove('hidden');
}
function cambiarUsuario(u){buzz();setUsuario(u);state.ventas=[];state.ventFirma='';cerrarUsuarios();cambiarVista('dashboard');}
function cerrarUsuarios(){document.getElementById('sheet-usuario').classList.add('hidden');}

/* ---------- UTILS ---------- */
function money(n){return(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function formatDate(d){const D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${D[d.getDay()]} ${d.getDate()} ${M[d.getMonth()]}`;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastT;
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),2800);}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
