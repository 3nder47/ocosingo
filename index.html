<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E15" media="(prefers-color-scheme: dark)">
<title>Kiosko</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kiosko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="brand">
    <div class="brand-mark">Ki</div>
    <h1>Kiosko</h1>
    <p>Ingresa tu PIN</p>
  </div>
  <div class="pin-dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <div class="keypad" id="keypad"></div>
  <div class="login-err" id="login-err"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="header">
    <div>
      <div class="eyebrow" id="header-date"></div>
      <h2 id="greeting">Hola</h2>
    </div>
    <button class="avatar" id="avatar" onclick="abrirUsuarios()">I</button>
  </div>

  <div class="content">
    <div id="view-dashboard" class="view"></div>
    <div id="view-catalogo" class="view hidden">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar producto" autocomplete="off">
        <button class="view-toggle" id="toggle" onclick="toggleVista()" aria-label="Cambiar vista"></button>
      </div>
      <div class="cats" id="duenos" style="margin-bottom:2px"></div>
      <div class="cats" id="cats"></div>
      <div class="cat-strips" id="cat-strips"></div>
      <div id="catalogo-list"></div>
    </div>
    <div id="view-ventas" class="view hidden">
      <div class="strip" id="mini"></div>
      <div id="logros"></div>
      <div class="seg" id="filtros">
        <button class="on" data-f="todo">Todo</button>
        <button data-f="pendiente">Sin liquidar</button>
        <button data-f="transferido">Liquidadas</button>
        <button data-f="mes">Este mes</button>
      </div>
      <div id="ventas-list"></div>
    </div>
  </div>

  <nav class="nav">
    <button data-view="dashboard" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button data-view="catalogo"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="M3 7.5V17l9 4 9-4V7.5"/><path d="M12 12v9"/></svg>Catálogo</button>
    <button class="fab" data-view="nueva" aria-label="Nueva venta"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-view="ventas"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Ventas</button>
  </nav>
</div>

<!-- SHEETS -->
<div id="sheet-venta" class="overlay hidden" onclick="if(event.target===this)cerrarVenta()">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="venta-titulo">Registrar venta</h3>
    <div id="venta-body"></div>
    <div style="margin-top:22px" id="venta-foot"></div>
  </div>
</div>

<div id="sheet-usuario" class="overlay hidden" onclick="if(event.target===this)cerrarUsuarios()">
  <div class="sheet">
    <div class="handle"></div>
    <h3>¿Quién eres?</h3>
    <div id="user-list"></div>
    <button class="btn ghost" onclick="cerrarUsuarios()">Cancelar</button>
  </div>
</div>

<div id="sheet-alta" class="overlay hidden" onclick="if(event.target===this)cerrarAlta()">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Agregar producto <span class="tag-irene">tuyo</span></h3>
    <div class="form-field"><label>Descripción</label><input id="np-desc" placeholder="Auriculares X100 Negro" autocomplete="off"></div>
    <div class="form-field"><label>Categoría</label><input id="np-cat" list="cats-list" placeholder="Audifonos" autocomplete="off"><datalist id="cats-list"></datalist></div>
    <div style="display:flex;gap:12px"><div class="form-field" style="flex:1"><label>Costo (lo que pagaste)</label><div class="money"><span>$</span><input id="np-costo" type="number" inputmode="decimal" placeholder="0.00"></div></div>
    <div class="form-field" style="flex:1"><label>Precio de venta</label><div class="money"><span>$</span><input id="np-precio" type="number" inputmode="decimal" placeholder="0.00"></div></div></div>
    <div class="form-field"><label>Cantidad de piezas</label><div class="cant"><button onclick="npCant(-1)">−</button><b id="np-n">1</b><button onclick="npCant(1)">+</button></div></div>
    <div class="form-field"><label>Foto (opcional)</label>
      <input id="np-foto" type="file" accept="image/*" style="display:none" onchange="npFoto(this)">
      <button class="foto-pick" id="np-foto-btn" onclick="document.getElementById('np-foto').click()"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="np-foto-txt">Tomar o elegir foto</span></button>
    </div>
    <button class="btn primary" id="np-btn" onclick="guardarProducto()">Agregar a mi inventario</button>
    <button class="btn ghost" onclick="cerrarAlta()">Cancelar</button>
  </div>
</div>
<div id="sheet-exp" class="overlay hidden" onclick="if(event.target===this)cerrarExp()">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="exp-titulo">Explicación</h3>
    <div id="exp-body"></div>
    <button class="btn ghost" onclick="cerrarExp()">Entendido</button>
  </div>
</div>
<div id="sheet-detalle" class="overlay hidden" onclick="if(event.target===this)cerrarDetalle()">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="detalle-titulo">Detalle</h3>
    <div id="detalle-body"></div>
  </div>
</div>
<div id="sheet-quick" class="overlay hidden" onclick="if(event.target===this)cerrarQuick()">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Nueva venta</h3>
    <div class="search" style="margin-bottom:10px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="qsearch" type="search" placeholder="¿Qué se vendió?" autocomplete="off">
    </div>
    <div id="quick-list"></div>
  </div>
</div>
<div id="ptr" class="ptr">Ki</div>
<button id="fab-add" class="fab-add" style="display:none" onclick="abrirAlta()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar producto</button>
<div id="success" class="success hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
