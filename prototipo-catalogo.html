<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototipo · tienda móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F5F7; --ink:#0D1117; --gris:#666E7A; --tenue:#9AA2AD;
  --linea:#ECEEF1; --verde:#0F9D63; --verde-bg:#E6F6EF; --verde-ink:#0A6B44;
  --rojo:#E0342B; --naranja:#F97316; --tinta:#0A0E13;
  --out:cubic-bezier(0.23,1,0.32,1);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E8EAEE;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}

/* ---------- el teléfono: contexto real de la pieza ---------- */
.escenario{min-height:100vh;display:grid;place-items:center;padding:78px 16px 28px}
.fono{width:390px;height:min(844px,calc(100vh - 118px));background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 11px #14181D, 0 0 0 13px #2A3037, 0 34px 70px rgba(10,14,19,.4);}
.fono::after{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:26px;background:#14181D;border-radius:14px;z-index:60;pointer-events:none}
#stage{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg);color:var(--ink)}
#stage::-webkit-scrollbar{display:none}
@media (max-width:760px){
  .escenario{padding:0;min-height:100dvh}
  .fono{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .fono::after{display:none}
}
.cargando{padding:120px 24px;text-align:center;color:var(--gris);font-size:14px}
.aviso{margin:12px;padding:11px 14px;background:#FEF3C7;color:#92400E;border-radius:12px;font-size:12.5px;font-weight:600;line-height:1.4}

/* ---------- piezas compartidas ---------- */
.ph{background:var(--bg2);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 300ms ease-out}
.ph img.ok{opacity:1}
.ph.contain img{object-fit:contain}
@keyframes sube{to{opacity:1;transform:none}}
.ent{opacity:0;transform:translateY(12px);animation:sube 380ms var(--out) forwards}
@media (prefers-reduced-motion:reduce){.ent{animation-duration:1ms;transform:none}}
.top-pad{padding-top:48px}
.tag{position:absolute;border-radius:999px;font-weight:700;font-size:10.5px;padding:4px 9px;letter-spacing:.01em;white-space:nowrap;z-index:2}
.tag.rebaja{background:var(--rojo);color:#fff}
.tag.nuevo{background:var(--verde);color:#fff}
.tag.ultima{background:rgba(10,14,19,.78);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.press{transition:transform 150ms var(--out)}
.press:active{transform:scale(.97)}

/* =========================================================
   1 · TIENDA — modelo: portada de ecommerce por bloques
   ========================================================= */
.t-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:46px 16px 10px}
.t-head .fila{display:flex;align-items:center;gap:10px}
.t-logo{width:34px;height:34px;border-radius:11px;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.t-logo-tx b{display:block;font-size:15px;letter-spacing:-.02em;line-height:1.1}
.t-logo-tx small{color:var(--gris);font-size:11px}
.t-busca{flex:1;display:flex;align-items:center;gap:7px;background:var(--bg2);border-radius:999px;padding:9px 13px;color:var(--tenue);font-size:13.5px}

/* héroe: banner construido con la segunda foto del producto */
.t-hero{margin:12px 0 0;position:relative}
.t-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;padding:0 16px;touch-action:pan-x}
.t-slides::-webkit-scrollbar{display:none}
.t-slide{flex:none;width:calc(100% - 32px);scroll-snap-align:center;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:16/11;background:var(--tinta);text-align:left;display:block}
.t-slide .ph{position:absolute;inset:0}
.t-slide .ph img{opacity:0;transform:scale(1.04);transition:opacity 400ms ease-out,transform 700ms var(--out)}
.t-slide .ph img.ok{opacity:.95;transform:none}
.t-slide .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,19,.05) 30%,rgba(10,14,19,.55) 66%,rgba(10,14,19,.86) 100%)}
.t-slide .tx{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.t-slide .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.82;margin-bottom:5px}
.t-slide h3{margin:0;font-size:20px;letter-spacing:-.025em;line-height:1.2;font-weight:800;text-shadow:0 1px 14px rgba(0,0,0,.3)}
.t-slide .pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.t-slide .pr{font-size:22px;font-weight:800;letter-spacing:-.03em}
.t-slide .pr s{font-size:13px;font-weight:500;opacity:.6;margin-left:7px}
.t-slide .cta{background:#fff;color:var(--ink);border-radius:999px;padding:9px 17px;font-size:13px;font-weight:700;flex:none}
.t-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.t-dots i{width:5px;height:5px;border-radius:999px;background:var(--linea);transition:width 250ms var(--out),background 250ms ease-out}
.t-dots i.on{width:18px;background:var(--ink)}

.t-cats{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:22px 16px 4px}
.t-cats::-webkit-scrollbar{display:none}
.t-cat{flex:none;width:66px;text-align:center}
.t-cat .ph{width:66px;height:66px;border-radius:50%;border:1px solid var(--linea)}
.t-cat span{display:block;font-size:11px;font-weight:600;margin-top:7px;line-height:1.25;color:var(--gris)}

.t-oferta{margin:22px 16px 0;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#1B1008,#3B1D0B);color:#fff;display:flex;align-items:stretch;text-align:left;width:calc(100% - 32px)}
.t-oferta .tx{padding:16px 4px 16px 18px;flex:1;min-width:0}
.t-oferta .kicker{display:inline-block;background:var(--naranja);color:#fff;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.t-oferta h3{margin:9px 0 3px;font-size:16px;letter-spacing:-.02em;line-height:1.25;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-oferta .pr{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.t-oferta .pr s{font-size:13px;font-weight:500;opacity:.55;margin-left:8px}
.t-oferta .ahorro{font-size:12px;font-weight:700;color:#FDBA74;margin-top:3px}
.t-oferta .ph{width:132px;flex:none;align-self:stretch}

.t-bloque{margin-top:26px}
.t-bh{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin-bottom:12px}
.t-bh h2{font-size:18px;margin:0;letter-spacing:-.025em;font-weight:800}
.t-bh span{font-size:12.5px;color:var(--tenue);font-weight:600}
.t-rail{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding:0 16px 4px;touch-action:pan-x}
.t-rail::-webkit-scrollbar{display:none}
.t-mini{flex:none;width:139px;text-align:left}
.t-mini .ph{aspect-ratio:1;border-radius:16px}
.t-mini .nm{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.t-mini .pr{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.t-mini .pr s{font-size:11.5px;font-weight:500;color:var(--tenue);margin-left:5px}
.t-mini .pr .off{color:var(--rojo)}

.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.t-card{text-align:left}
.t-card .ph{aspect-ratio:1;border-radius:16px}
.t-card .nm{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.t-card .pr{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.t-card .pr s{font-size:11.5px;font-weight:500;color:var(--tenue);margin-left:5px}
.t-card .pr .off{color:var(--rojo)}

.t-trust{display:flex;gap:8px;padding:26px 16px 0}
.t-trust div{flex:1;background:var(--bg2);border-radius:16px;padding:13px 11px;text-align:center}
.t-trust svg{width:19px;height:19px;stroke:var(--verde);fill:none;stroke-width:1.9;margin:0 auto 6px}
.t-trust b{display:block;font-size:11.5px;line-height:1.25;font-weight:700}
.t-trust small{display:block;font-size:10px;color:var(--tenue);margin-top:2px;line-height:1.25}
.t-fin{height:96px}
.t-dock{position:absolute;left:14px;right:14px;bottom:14px;z-index:40;display:flex;align-items:center;gap:8px;background:rgba(13,17,23,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:999px;padding:7px 8px}
.t-dock button{flex:1;color:rgba(255,255,255,.55);font-size:11px;font-weight:600;padding:7px 4px;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 160ms ease-out}
.t-dock button.on{color:#fff;background:rgba(255,255,255,.13)}
.t-dock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.t-dock .wa{flex:none;background:var(--verde);color:#fff;border-radius:999px;padding:11px 16px;font-size:12.5px;font-weight:700;flex-direction:row}

/* =========================================================
   2 · HISTORIAS — modelo: una pantalla por producto, se sube deslizando
   ========================================================= */
.h-wrap{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;background:#000}
.h-wrap::-webkit-scrollbar{display:none}
.h-item{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;background:#0A0E13}
.h-item .ph{position:absolute;inset:0}
.h-item .ph img{opacity:0;transform:scale(1.06);transition:opacity 500ms ease-out,transform 900ms var(--out)}
.h-item .ph img.ok{opacity:1;transform:none}
.h-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,19,.62) 0%,rgba(10,14,19,0) 26%,rgba(10,14,19,0) 42%,rgba(10,14,19,.9) 88%)}
.h-chips{position:absolute;top:52px;left:0;right:0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 14px;z-index:5;touch-action:pan-x}
.h-chips::-webkit-scrollbar{display:none}
.h-chip{flex:none;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
.h-chip.on{background:#fff;color:var(--ink)}
.h-tx{position:absolute;left:20px;right:20px;bottom:30px;color:#fff;z-index:4}
.h-eye{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;opacity:.78}
.h-name{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:9px 0 0;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.h-price{display:flex;align-items:baseline;gap:9px;margin-top:11px}
.h-price b{font-size:31px;font-weight:800;letter-spacing:-.04em}
.h-price s{opacity:.55;font-size:15px}
.h-price .off{background:var(--rojo);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}
.h-acc{display:flex;gap:9px;margin-top:16px}
.h-acc .cta{flex:1;background:#fff;color:var(--ink);border-radius:999px;padding:14px;font-weight:800;font-size:15px;text-align:center}
.h-acc .mas{flex:none;width:50px;border-radius:999px;background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;font-size:19px}
.h-count{position:absolute;top:54px;right:16px;z-index:6;background:rgba(10,14,19,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.h-swipe{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(30px + 118px);color:rgba(255,255,255,.55);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:4;animation:flota 1.9s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translate(-50%,0);opacity:.55}50%{transform:translate(-50%,-6px);opacity:.95}}
.h-mini{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 16px;z-index:5;background:linear-gradient(180deg,transparent,rgba(10,14,19,.55));touch-action:pan-x}
.h-mini::-webkit-scrollbar{display:none}
.h-mini .ph{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.12)}
.h-mini .ph.on{border-color:#fff}

/* =========================================================
   3 · REVISTA — modelo: portada por categoría y rejilla debajo
   ========================================================= */
.r-top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:48px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.r-top b{font-size:19px;letter-spacing:-.03em;font-weight:800}
.r-top .bu{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.r-intro{padding:16px 20px 4px}
.r-intro h1{font-size:33px;line-height:1.04;letter-spacing:-.04em;margin:0 0 9px;font-weight:800}
.r-intro h1 em{font-style:italic;font-weight:500;color:var(--gris)}
.r-intro p{margin:0;color:var(--gris);font-size:14px;line-height:1.5}
.r-portada{position:relative;margin:24px 0 0;height:420px;overflow:hidden}
.r-portada .ph{position:absolute;inset:0}
.r-portada .ph img{opacity:0;transform:scale(1.05);transition:opacity 450ms ease-out,transform 900ms var(--out)}
.r-portada .ph img.ok{opacity:1;transform:none}
.r-portada .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,19,.3) 0%,rgba(10,14,19,0) 34%,rgba(10,14,19,.82) 100%)}
.r-portada .tx{position:absolute;left:20px;right:20px;bottom:22px;color:#fff}
.r-portada .num{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.7}
.r-portada h2{margin:7px 0 0;font-size:34px;line-height:1.02;letter-spacing:-.042em;font-weight:800;text-shadow:0 2px 22px rgba(0,0,0,.3)}
.r-portada .sub{margin-top:9px;font-size:13px;opacity:.82;display:flex;align-items:center;gap:9px}
.r-portada .sub i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.r-lista{padding:22px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}
.r-item{text-align:left}
.r-item .ph{aspect-ratio:3/4;border-radius:4px}
.r-item .nm{font-size:13.5px;font-weight:600;margin-top:11px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-item .pr{font-size:14.5px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
.r-item .pr s{font-size:11.5px;font-weight:500;color:var(--tenue);margin-left:6px}
.r-item .pr .off{color:var(--rojo)}
.r-mas{display:block;margin:20px 20px 0;text-align:center;border:1px solid var(--ink);border-radius:999px;padding:13px;font-weight:700;font-size:14px}
.r-fin{height:56px}

/* ======================= PICKER (verbatim, PICKER.md) ======================= */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<div class="escenario"><div class="fono"><div id="stage"><div class="cargando">Cargando tu catálogo…</div></div></div></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Tienda</button>
  <button class="proto-picker-item">Historias</button>
  <button class="proto-picker-item">Revista</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script src="config.js"></script>
<script>

 {descripcion:"Smart TV Stick MX10-F3",categoria:"TV y electrónica",precio:700,antes:0,piezas:2,agregado:HOY-240*DIA},

 {descripcion:"Bocina Bluetooth TG117 Naranja",categoria:"Bocinas y altavoces",precio:380,antes:0,piezas:1,agregado:HOY-30*DIA}
].map(function(p){p.imagen="";p.extras=[];p.wa="5210000000000";return p;});

function pedir(a){return fetch(API+"?accion="+a,{redirect:"follow"}).then(function(r){return r.text();})
  .then(function(t){var j=JSON.parse(t);if(!j.ok)throw new Error(j.error||"e");return j.data;});}
function preparar(d){
  return (d||[]).map(function(p){
    p.antes=Number(p.antes)||0;p.precio=Number(p.precio)||0;
    p.baja=p.antes>p.precio?Math.round((1-p.precio/p.antes)*100):0;
    p.nuevo=p.agregado&&(HOY-Number(p.agregado))<30*DIA;
    p.ultima=p.piezas===1||p.ultima===true;
    p.fotos=[p.imagen].concat(p.extras||[]).filter(Boolean);
    return p;
  });
}
(API?pedir("catalogoTienda").catch(function(){return pedir("catalogoPublico");}):Promise.reject())
  .then(function(d){if(!d||!d.length)throw 0;TODO=preparar(d);listo();})
  .catch(function(){MUESTRA=true;TODO=preparar(EJEMPLO);listo();});
function listo(){setActive((parseInt(new URLSearchParams(location.search).get("v"),10)||1)-1);}

/* ---------- selección de contenido ---------- */
function cuentas(){var c={};TODO.forEach(function(p){c[p.categoria]=(c[p.categoria]||0)+1;});return c;}
function cats(){var c=cuentas();return Object.keys(c).sort(function(a,b){return c[b]-c[a];});}
function conBanner(){return TODO.filter(function(p){return p.fotos.length>1;});}   // los que tienen 2+ fotos
function banner(p){return p.fotos[1]||p.fotos[0]||"";}                             // la segunda es la de ambiente
function rebajas(){return TODO.filter(function(p){return p.baja;}).sort(function(a,b){return b.baja-a.baja;});}
function nuevos(){return TODO.filter(function(p){return p.nuevo;});}
function destacados(){
  var r=rebajas(),b=conBanner().filter(function(p){return r.indexOf(p)<0;});
  var caros=TODO.slice().sort(function(a,b2){return b2.precio-a.precio;});
  var out=r.slice(0,2).concat(b.slice(0,2),caros.slice(0,2));
  var vis={},u=[];out.forEach(function(p){if(!vis[p.descripcion]){vis[p.descripcion]=1;u.push(p);}});
  return u.slice(0,4);
}
function idx(p){return TODO.indexOf(p);}
function img(u,cls,eager){
  if(!u)return '<div class="ph '+(cls||"")+'"></div>';
  return '<div class="ph '+(cls||"")+'"><img src="'+esc(u)+'" alt="" loading="'+(eager?"eager":"lazy")+'" decoding="async" onload="this.classList.add(\'ok\')" onerror="this.remove()"></div>';
}
function etiqueta(p){
  if(p.baja)return '<span class="tag rebaja" style="top:9px;left:9px">−'+p.baja+'%</span>';
  if(p.nuevo)return '<span class="tag nuevo" style="top:9px;left:9px">Nuevo</span>';
  if(p.ultima)return '<span class="tag ultima" style="top:9px;left:9px">Última pieza</span>';
  return "";
}
function precio(p,cl){return '<div class="'+(cl||"pr")+'"><span'+(p.baja?' class="off"':'')+'>'+mx(p.precio)+'</span>'+(p.baja?'<s>'+mx(p.antes)+'</s>':"")+'</div>';}
function dly(i){return 'style="animation-delay:'+Math.min(i*50,400)+'ms"';}
function aviso(){return MUESTRA?'<div class="aviso">Sin conexión al API: 12 productos de ejemplo, sin fotos. Súbelo al repo junto a <b>config.js</b> para ver tu catálogo real.</div>':"";}

    '<div class="t-rail">'+nv.map(function(p){

  cs.slice(0,2).forEach(function(c,k){

    h+='<section class="t-bloque ent" style="animation-delay:'+(210+k*40)+'ms"><div class="t-bh"><h2>'+esc(c)+'</h2><span>'+cuentas()[c]+'</span></div>'+

  h+='<div class="t-trust ent" style="animation-delay:330ms">'+
    tr("M5 13l4 4L19 7","Mismo día","entrega en Ocosingo")+

    tr("M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8","Ya está aquí","no es por encargo")+'</div><div class="t-fin"></div>'+
    '<nav class="t-dock">'+
      '<button class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>'+

      '<button class="wa"><svg viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>Pedir</button></nav>';

function tr(d,t,s){return '<div><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg><b>'+t+'</b><small>'+s+'</small></div>';}

function vRevista(){

  var h='<header class="r-top"><b>Kiosko</b><button class="bu press"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button></header>'+aviso()+

  if(r.length)h+=portada({nombre:"Rebajas",sub:r.length+(r.length===1?" producto":" productos"),sub2:"hasta −"+r[0].baja+"%",p:r[0],num:"01"},r.slice(0,4),n++);
  cs.forEach(function(c){
    var l=TODO.filter(function(x){return x.categoria===c;});

    h+=portada({nombre:c,sub:l.length+(l.length===1?" producto":" productos"),sub2:"desde "+mx(Math.min.apply(null,l.map(function(p){return p.precio;}))),p:cover,num:String(++n).padStart(2,"0")},l.slice(0,4),n);

function portada(o,l,i){
  return '<section class="ent" '+dly(i)+'><div class="r-portada">'+img(banner(o.p),"",i<1)+'<span class="velo"></span>'+
    '<div class="tx"><div class="num">'+o.num+'</div><h2>'+esc(o.nombre)+'</h2>'+
    '<div class="sub">'+esc(o.sub)+'<i></i>'+esc(o.sub2)+'</div></div></div>'+
    '<div class="r-lista">'+l.map(function(p){
      return '<button class="r-item press" data-i="'+idx(p)+'">'+img(p.imagen).replace('<div class="ph ">','<div class="ph ">'+etiqueta(p))+
        '<div class="nm">'+esc(p.descripcion)+'</div>'+precio(p)+'</button>';}).join("")+'</div>'+
    '<button class="r-mas press" data-cat="'+esc(o.nombre)+'">Ver los '+o.sub+'</button></section>';

/* ---------- interacción compartida ---------- */
var stage=document.getElementById("stage");
stage.addEventListener("click",function(e){
  var c=e.target.closest("[data-cat]");
  if(c){grupoH=c.dataset.cat;if(current===1)mount(1);return;}
  var b=e.target.closest("[data-i]");if(!b)return;
  var p=TODO[Number(b.dataset.i)];if(!p)return;
  window.open("https://wa.me/"+(p.wa||"")+"?text="+encodeURIComponent("Hola, me interesa "+p.descripcion+" de "+mx(p.precio)+"."),"_blank");
});
/* puntos del héroe y miniaturas de historias */
function cablear(){
  var sl=document.getElementById("t-slides"),dots=document.getElementById("t-dots");
  if(sl&&dots)sl.addEventListener("scroll",function(){
    var i=Math.round(sl.scrollLeft/sl.clientWidth);
    Array.prototype.forEach.call(dots.children,function(d,j){d.classList.toggle("on",j===i);});
  },{passive:true});
}

/* ======================= wiring del picker (verbatim) ======================= */
var variants=[vTienda,vHistorias,vRevista];
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); stage.scrollTop = 0; cablear(); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
window.__set=setActive;
})();
</script>
