<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D0B">
<title>Análisis — Kiosko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080D0B; --card:#111A16; --card2:#18231E; --linea:rgba(255,255,255,.07);
  --tinta:#E9F2ED; --gris:#8CA096; --tenue:#5E7168;
  --verde:#1E7A52; --lima:#C6FF4A; --lima2:#A8E82E;
  --mango:#FFA033; --coral:#FF6B5A;
  --r:24px; --r2:16px; --pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tinta);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:.9375rem;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
input,button,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.oculto{display:none!important}
.glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.glow.a{width:70vw;height:70vw;max-width:760px;max-height:760px;left:-22vw;top:-26vw;background:radial-gradient(circle,rgba(30,122,82,.55),transparent 68%)}
.glow.b{width:55vw;height:55vw;max-width:620px;max-height:620px;right:-18vw;bottom:-18vw;background:radial-gradient(circle,rgba(255,160,51,.22),transparent 68%)}

/* PIN */
.pin{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:1.5rem;background:var(--bg)}
.pin-card{width:min(370px,100%);text-align:center}
.mark{width:56px;height:56px;border-radius:18px;background:var(--verde);color:var(--lima);display:grid;place-items:center;font-weight:800;font-size:1.25rem;margin:0 auto 1rem}
.pin-card h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.pin-card p{margin:.25rem 0 1.25rem;color:var(--gris);font-size:.875rem}
.pin-card input{width:100%;font-size:2rem;font-weight:800;letter-spacing:.45em;text-align:center;padding:.75rem;border:1px solid var(--linea);border-radius:var(--pill);background:var(--card)}
.pin-card input:focus{outline:none;border-color:var(--lima);box-shadow:0 0 0 4px rgba(198,255,74,.14)}
.pin-err{color:var(--coral);font-size:.8125rem;min-height:1.25rem;margin-top:.75rem;font-weight:700}

/* barra */
.top{position:sticky;top:0;z-index:20;padding:.75rem 1rem 0;max-width:1240px;margin:0 auto}
.top-in{background:rgba(17,26,22,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--linea);border-radius:var(--pill);display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem}
.top .mark{width:36px;height:36px;border-radius:11px;font-size:.875rem;margin:0}
.top h1{margin:0;font-size:.9375rem;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:.6875rem;color:var(--gris);font-weight:600}
.seg{display:flex;gap:.25rem;background:var(--card2);border-radius:var(--pill);padding:.2rem}
.seg button{border:none;background:none;color:var(--gris);border-radius:var(--pill);padding:.35rem .75rem;font-size:.75rem;font-weight:700}
.seg button.on{background:var(--lima);color:#0B1410}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:1rem 1rem 10rem;display:grid;gap:.875rem;grid-template-columns:repeat(12,1fr)}
.c{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:1.25rem;grid-column:1/-1}
.k{font-size:.75rem;font-weight:700;color:var(--gris);margin-bottom:.5rem}
.big{font-size:clamp(2.5rem,9vw,3.75rem);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--lima)}
.lee{font-size:.8125rem;color:var(--gris);line-height:1.55;margin:.875rem 0 0}
.lee b{color:var(--tinta)}
.que{margin-top:.75rem;border:1px solid var(--linea);background:none;color:var(--gris);border-radius:var(--pill);padding:.3rem .75rem;font-size:.6875rem;font-weight:700}
.que:hover{border-color:var(--lima);color:var(--lima)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:1rem}
.tres div{background:var(--card2);border-radius:var(--r2);padding:.75rem .875rem}
.tres b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.tres small{font-size:.6875rem;color:var(--gris);font-weight:700}
.alerta{border-left:3px solid var(--mango);background:rgba(255,160,51,.08);padding:.75rem .875rem;border-radius:0 var(--r2) var(--r2) 0;color:var(--tinta);font-size:.8125rem;line-height:1.55;margin-top:1rem}
.alerta b{color:var(--mango)}

/* barras */
.lista{display:grid;gap:.75rem;margin-top:.875rem}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.row b{font-size:.875rem;font-weight:700}
.row small{display:block;color:var(--gris);font-size:.6875rem;font-weight:600}
.row .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .v small{color:var(--tenue)}
.bar{height:7px;border-radius:var(--pill);background:var(--card2);overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;width:0;border-radius:var(--pill);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.dob{display:grid;grid-template-columns:1fr auto;gap:.25rem .625rem;align-items:center;margin-top:.35rem}
.dob span{font-size:.6875rem;color:var(--gris);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.leyenda{display:flex;gap:1rem;font-size:.6875rem;font-weight:700;color:var(--gris);margin-bottom:.25rem}
.leyenda i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:.35rem}

/* remate */
.rem{background:var(--card2);border:1px solid transparent;border-radius:var(--r2);padding:.875rem;display:grid;gap:.625rem;transition:border-color .15s,background .15s}
.rem.on{border-color:var(--lima);background:rgba(198,255,74,.05)}
.rem-h{display:flex;gap:.75rem;align-items:flex-start}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--tenue);background:none;flex:none;display:grid;place-items:center;color:transparent;padding:0;margin-top:.1rem}
.rem.on .chk{background:var(--lima);border-color:var(--lima);color:#0B1410}
.foto{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--linea)}
.foto.sin{display:grid;place-items:center;color:var(--tenue)}
.ctrl{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap;background:var(--card2);border-radius:var(--r2);padding:.75rem .875rem;margin-top:.875rem}
.ctrl>span:first-child{font-size:.8125rem;font-weight:700}
.ctrl small{flex-basis:100%;font-size:.6875rem;color:var(--gris);font-weight:600;line-height:1.5}
.cuenta-h{font-size:.6875rem;font-weight:700;color:var(--tenue);margin-top:.875rem}
.rem-t{flex:1;min-width:0}
.rem-t b{font-size:.9375rem;font-weight:700;display:block}
.rem-t small{color:var(--gris);font-size:.6875rem;font-weight:600}
.dias{background:rgba(255,160,51,.14);color:var(--mango);border-radius:var(--pill);padding:.15rem .55rem;font-size:.6875rem;font-weight:800;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center}
.opt{border:1px solid var(--linea);background:none;border-radius:var(--pill);padding:.3rem .7rem;font-size:.6875rem;font-weight:700;color:var(--gris)}
.opt.on{background:var(--verde);border-color:var(--verde);color:#fff}
.opt:hover{border-color:var(--lima)}
.precio-in{display:inline-flex;align-items:center;gap:.2rem;border:1px solid var(--lima);border-radius:var(--pill);padding:.25rem .6rem;font-weight:800;color:var(--lima)}
.precio-in input{width:3.75rem;background:none;border:none;text-align:right;font-weight:800;color:var(--lima);padding:0;font-variant-numeric:tabular-nums}
.precio-in input:focus{outline:none}
.rem-f{font-size:.6875rem;color:var(--gris);font-weight:600}
.rem-f b{color:var(--lima2)}
.rem-f b.mal{color:var(--coral)}

.orden{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.75rem;color:var(--gris);font-weight:700;margin:.875rem 0 .25rem}
.vermas{width:100%;border:1px dashed var(--linea);background:none;color:var(--gris);border-radius:var(--r2);padding:.875rem;font-size:.8125rem;font-weight:700}
.vermas:hover{border-color:var(--lima);color:var(--lima)}
/* barra inferior */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 1rem calc(1rem + env(safe-area-inset-bottom))}
.bot-in{max-width:760px;margin:0 auto;background:rgba(17,26,22,.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--linea);border-radius:var(--r);padding:.875rem 1rem;display:flex;align-items:center;gap:1rem;box-shadow:0 18px 50px -12px #000}
.bot-t{flex:1;min-width:0}
.bot-t small{display:block;font-size:.6875rem;color:var(--gris);font-weight:700}
.bot-t b{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:var(--lima);font-variant-numeric:tabular-nums}
.cta{border:none;border-radius:var(--pill);background:var(--lima);color:#0B1410;font-weight:800;padding:.75rem 1.25rem;font-size:.875rem;white-space:nowrap}
.cta:disabled{background:var(--card2);color:var(--tenue)}
.cta.ghost{background:none;border:1px solid var(--linea);color:var(--tinta)}

.cargando{grid-column:1/-1;text-align:center;color:var(--gris);padding:4rem 1rem;font-weight:700}
.hoja{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:end center;padding:1rem}
.hoja-in{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:1.25rem;width:min(560px,100%);max-height:82vh;overflow:auto}
.hoja-in h3{margin:0 0 .5rem;font-size:1.125rem;font-weight:800}
.hoja-in p{color:var(--gris);font-size:.875rem;line-height:1.6;margin:0 0 .75rem}
.hoja-in p b{color:var(--tinta)}
textarea{width:100%;min-height:180px;background:var(--bg);border:1px solid var(--linea);border-radius:var(--r2);color:var(--tinta);padding:.75rem;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;white-space:pre;resize:vertical}
@media (min-width:900px){
  .c.w6{grid-column:span 6}
  .c.w7{grid-column:span 7}
  .c.w5{grid-column:span 5}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>

<div class="pin" id="pin"><div class="pin-card">
  <div class="mark">Ki</div><h1>Análisis</h1><p>Tu PIN de Kiosko</p>
  <input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
  <div class="pin-err" id="pin-err"></div>
</div></div>

<div id="app" class="oculto">
  <div class="top"><div class="top-in">
    <div class="mark">Ki</div>
    <h1>Tu negocio<small>Dónde está tu dinero y qué tan rápido se mueve</small></h1>
    <div class="seg"><button id="s-todo" class="on">Todo</button><button id="s-12m">12 meses</button></div>
  </div></div>
  <div class="wrap" id="wrap"><div class="cargando">Leyendo tu hoja…</div></div>
  <div class="bot oculto" id="bot"><div class="bot-in">
    <div class="bot-t"><small id="bot-sub">Elige qué rematar</small><b class="num" id="bot-val">$0</b></div>
    <button class="cta ghost" id="btn-limpiar">Limpiar</button>
    <button class="cta" id="btn-plan" disabled>Ver plan</button>
  </div></div>
</div>

<div class="hoja oculto" id="hoja"><div class="hoja-in" id="hoja-in"></div></div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";
  function api(a,p,b,ms){ms=ms||30000;
    if(!API_URL||!API_TOKEN)return Promise.reject(new Error("Falta config.js"));
    var u=new URL(API_URL),c=new AbortController(),t=setTimeout(function(){c.abort();},ms),o={redirect:"follow",signal:c.signal};
    if(b){o.method="POST";o.headers={"Content-Type":"text/plain;charset=utf-8"};o.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:a},b));}
    else u.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:a},p||{})).toString();
    return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error("El servidor respondió "+r.status);return r.text();})
      .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("El servidor no devolvió datos válidos");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
      .catch(function(e){clearTimeout(t);if(e&&e.name==="AbortError")throw new Error("El servidor tardó demasiado");throw e;});}

  var $=function(i){return document.getElementById(i);};
  function num(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
  function mx(n){var v=Math.round(Number(n)||0);return "$"+v.toLocaleString("es-MX");}
  function a10(n){return Math.ceil(n/10)*10;}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
  function dias(d){if(!d)return"—";if(d<45)return d+" días";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años";}
  var PAL=["#C6FF4A","#4ADE80","#38BDF8","#FFA033","#C084FC","#FF6B5A","#2DD4BF","#FBBF24","#F472B6","#94A3B8"];

  var D=null,rango="todo",sel={},FOTOS={},MOTO=35,orden="dinero",verTodo=false;

  /* ---------- PIN ---------- */
  var pi=$("pin-in");
  pi.addEventListener("input",function(){
    if(pi.value.length<4)return;
    var v=pi.value;pi.disabled=true;$("pin-err").textContent="";
    api("verificarPin",null,{pin:v}).then(function(d){
      if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
      if(d.vendedor!=="Alex")throw new Error("Esta pantalla es solo para Alex");
      $("pin").classList.add("oculto");$("app").classList.remove("oculto");cargar();
    }).catch(function(e){$("pin-err").textContent=e.message;pi.value="";pi.disabled=false;pi.focus();});
  });

  function cargar(){
    $("wrap").innerHTML='<div class="cargando">Leyendo tu hoja…</div>';
    $("bot").classList.add("oculto");
    Promise.all([
      api("analisis",{rango:rango},null,45000),
      api("catalogo",null,null,30000).catch(function(){return[];})
    ]).then(function(r){
      D=r[0];sel={};FOTOS={};
      (r[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)FOTOS[norm(x.descripcion)]=x.imagen;});
      pintar();
    }).catch(function(e){$("wrap").innerHTML='<div class="cargando">'+esc(e.message)+"</div>";});
  }
  $("s-todo").addEventListener("click",function(){if(rango==="todo")return;rango="todo";marcarSeg();cargar();});
  $("s-12m").addEventListener("click",function(){if(rango==="12m")return;rango="12m";marcarSeg();cargar();});
  function marcarSeg(){$("s-todo").classList.toggle("on",rango==="todo");$("s-12m").classList.toggle("on",rango==="12m");}

  /* ---------- meses del periodo, para traducir capital a "meses de ganancia" ---------- */
  function mesesPeriodo(){
    if(rango==="12m")return 12;
    var d=D&&D.resumen&&D.resumen.desde;
    if(!d)return 12;
    var m=Math.round((Date.now()-Number(d))/(30.4*864e5));
    return Math.max(1,m);
  }

  /* ---------- pintar ---------- */
  function pintar(){
    var R=D.resumen||{},cap=D.capital||[],rot=D.rotacion||[],mar=D.margen||[],V=viejos();
    var meses=mesesPeriodo(),porMes=meses?R.utilidad/meses:0;
    var mesesDetenido=porMes>0?D.capitalTotal/porMes:0;
    var capViejo=V.reduce(function(s,x){return s+x.capital;},0),pzViejo=V.reduce(function(s,x){return s+x.piezas;},0);
    var T=D.capitalTotal||1;
    var h="";

    /* HERO */
    h+='<section class="c w7"><div class="k">Dinero detenido en mercancía sin vender</div>'+
      '<div class="big num">'+mx(D.capitalTotal)+"</div>"+
      '<div class="tres">'+
        '<div><b class="num">'+D.piezasTotal+'</b><small>piezas paradas</small></div>'+
        '<div><b class="num">'+mx(porMes)+'</b><small>ganas al mes</small></div>'+
        '<div><b class="num" style="color:var(--mango)">'+(mesesDetenido?mesesDetenido.toFixed(1):"—")+'</b><small>meses de ganancia<br>congelados</small></div>'+
      "</div>"+
      '<p class="lee">Ese dinero ya salió de tu bolsa y todavía no regresa. Mientras siga en cajas no puede comprar nada nuevo. '+
      (mesesDetenido>3?'Tienes parado el equivalente a <b>'+mesesDetenido.toFixed(1)+" meses</b> de todo lo que ganas. Es mucho.":"Está en un rango manejable.")+"</p>"+
      '<button class="que" data-exp="capital">¿Por qué importa? ›</button></section>';

    /* COMPOSICIÓN */
    h+='<section class="c w5"><div class="k">En qué está parado</div><div class="lista">'+
      cap.map(function(x,i){return '<div><div class="row"><div><b>'+esc(x.categoria)+"</b><small>"+x.piezas+" pza"+(x.piezas===1?"":"s")+" · parado "+dias(x.diasStock)+'</small></div><div class="v">'+mx(x.capital)+"<small> "+Math.round(x.capital/T*100)+"%</small></div></div>"+
        '<div class="bar"><i data-w="'+(x.capital/T*100).toFixed(1)+'%" style="background:'+PAL[i%PAL.length]+'"></i></div></div>';}).join("")+
      "</div></section>";

    /* PLAN DE REMATE */
    h+='<section class="c"><div class="k">Plan de remate</div>'+
      '<p class="lee" style="margin-top:0">Esto es lo que lleva más de 6 meses parado: <b>'+mx(capViejo)+"</b> en <b>"+pzViejo+" piezas</b>. "+
      "Elige cuáles rematar y a qué precio. Abajo se va sumando el dinero que de verdad recuperas.</p>"+
      '<div class="ctrl"><span>Envío que absorbes por pieza</span><span class="precio-in">$<input id="moto" type="number" step="5" min="0" value="'+MOTO+'"></span>'+
      '<small>El motomandado sale de tu bolsa en casi todas tus entregas. Ya está descontado abajo.</small></div>'+
      '<div class="cuenta-h">'+V.length+" producto"+(V.length===1?"":"s")+" · "+pzViejo+" piezas"+(V.length>=25?" · el servidor manda los 25 más viejos":"")+"</div>"+
      (V.length>4?'<div class="alerta">Tus <b>4 productos más pesados</b> ('+esc(V.slice(0,4).map(function(x){return x.descripcion;}).join(", "))+
        ") concentran <b>"+mx(V.slice(0,4).reduce(function(s,x){return s+x.capital;},0))+"</b> de los "+mx(capViejo)+
        " parados. Mover esos cuatro vale más que mover los otros "+(V.length-4)+" juntos.</div>":"")+
      '<button class="que" data-exp="remate">¿Vender al costo es perder? ›</button>'+
      '<button class="que" data-exp="pildoras">¿De dónde salen los 3 precios? ›</button>'+
      '<button class="que" data-exp="envio">¿Por qué descuento el envío? ›</button>'+
      '<div class="orden"><span>Ordenar por</span><button class="opt'+(orden==="dinero"?" on":"")+'" data-ord="dinero">Dinero congelado</button>'+
      '<button class="opt'+(orden==="dias"?" on":"")+'" data-ord="dias">Tiempo parado</button></div>'+
      '<div class="lista" id="remates">'+
        (V.length?V.slice(0,verTodo?999:12).map(remHTML).join(""):'<p class="lee">Nada lleva más de 6 meses parado. Vas bien.</p>')+
        (V.length>12&&!verTodo?'<button class="vermas" id="vermas">Ver los '+(V.length-12)+" productos restantes · entre todos suman "+mx(V.slice(12).reduce(function(s,x){return s+x.capital;},0))+"</button>":"")+
      "</div></section>";

    /* ROTACIÓN */
    var maxD=Math.max.apply(null,rot.map(function(x){return Math.max(x.diasVenta,x.diasStock);}).concat([1]));
    var atoradas=rot.filter(function(x){return x.piezas>0&&x.ventas>=3&&x.diasStock>x.diasVenta*2;});
    h+='<section class="c w7"><div class="k">Qué tan rápido sale cada cosa</div>'+
      '<div class="leyenda"><span><i style="background:var(--lima)"></i>Tarda en venderse</span><span><i style="background:var(--mango)"></i>Lleva parado hoy</span></div>'+
      '<div class="lista">'+rot.map(function(x){
        var mal=x.piezas&&x.ventas>=3&&x.diasStock>x.diasVenta*2;
        return '<div><div class="row"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" venta"+(x.ventas===1?"":"s")+(x.piezas?" · "+x.piezas+" en stock":"")+"</small></div></div>"+
          '<div class="dob"><div class="bar"><i data-w="'+(x.diasVenta/maxD*100).toFixed(1)+'%" style="background:var(--lima)"></i></div><span>'+dias(x.diasVenta)+"</span>"+
          '<div class="bar"><i data-w="'+(x.diasStock/maxD*100).toFixed(1)+'%" style="background:'+(mal?"var(--coral)":"var(--mango)")+'"></i></div><span>'+dias(x.diasStock)+"</span></div></div>";
      }).join("")+"</div>"+
      (atoradas.length?'<div class="alerta">En <b>'+atoradas.map(function(x){return esc(x.categoria);}).join("</b>, <b>")+"</b> lo que te queda lleva parado más del doble de lo que normalmente tarda en venderse. La categoría no es lenta: son <b>esas piezas</b> las que no salen.</div>":'<p class="lee">Nada se está atorando: tu stock está dentro de sus tiempos normales.</p>')+
      '<button class="que" data-exp="rotacion">¿Cómo se lee? ›</button></section>';

    /* MARGEN */
    h+='<section class="c w5"><div class="k">De dónde sale tu ganancia</div><div class="lista">'+
      mar.map(function(x,i){return '<div><div class="row"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" venta"+(x.ventas===1?"":"s")+" · "+mx(x.porVenta)+' c/u</small></div><div class="v" style="color:var(--lima2)">'+mx(x.utilidad)+"<small> "+Math.round(x.margen)+"%</small></div></div>"+
        '<div class="bar"><i data-w="'+Math.min(100,x.margen).toFixed(1)+'%" style="background:'+PAL[i%PAL.length]+'"></i></div></div>';}).join("")+
      '</div><p class="lee">Margen alto con pocas ventas puede dejarte menos dinero que margen bajo con muchas. Mira siempre las dos columnas juntas.</p>'+
      '<button class="que" data-exp="margen">¿Qué es el margen? ›</button></section>';

    $("wrap").innerHTML=h;
    requestAnimationFrame(function(){document.querySelectorAll(".bar i").forEach(function(e){e.style.width=e.dataset.w;});});
    if(V.length)$("bot").classList.remove("oculto");
    total();
  }

  function viejos(){
    var V=(D.viejos||[]).filter(function(x){return x.dias>180;}).slice();
    V.sort(orden==="dinero"?function(a,b){return b.capital-a.capital;}:function(a,b){return b.dias-a.dias;});
    return V;
  }
  function costoUnit(x){return x.piezas?x.capital/x.piezas:0;}
  function remHTML(x,i){
    var cu=costoUnit(x),img=FOTOS[norm(x.descripcion)];
    return '<div class="rem" data-i="'+i+'">'+
      '<div class="rem-h"><button class="chk" data-act="tog"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></button>'+
      (img?'<img class="foto" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'<span class="foto sin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.4"/><path d="m21 15-5-5L5 19"/></svg></span>')+
      '<div class="rem-t"><b>'+esc(x.descripcion)+"</b><small>"+esc(x.categoria)+" · "+x.piezas+" pza"+(x.piezas===1?"":"s")+" · te costó "+mx(cu)+" c/u · hoy lo tienes en "+mx(x.precio)+'</small></div>'+
      '<span class="dias">'+dias(x.dias)+"</span></div>"+
      '<div class="opts">'+
        '<button class="opt" data-act="p" data-v="'+a10(cu+MOTO)+'" title="Tu costo más el envío: ni ganas ni pierdes">Sin perder '+mx(a10(cu+MOTO))+"</button>"+
        '<button class="opt" data-act="p" data-v="'+a10(cu+MOTO+50)+'" title="Te deja 50 pesos limpios por pieza">Ganas $50 '+mx(a10(cu+MOTO+50))+"</button>"+
        '<button class="opt" data-act="p" data-v="'+a10(x.precio/2)+'" title="La mitad del precio que tiene hoy: es el descuento que más jala">Mitad de precio '+mx(a10(x.precio/2))+"</button>"+
        '<span class="precio-in">$<input data-act="in" type="number" step="10" min="0" value="'+a10(cu*1.2)+'"></span>'+
      "</div>"+
      '<div class="rem-f" data-f="1"></div></div>';
  }

  document.addEventListener("click",function(e){
    var exp=e.target.closest("[data-exp]");if(exp){abrirExp(exp.getAttribute("data-exp"));return;}
    var od=e.target.closest("[data-ord]");if(od){orden=od.getAttribute("data-ord");sel={};verTodo=false;pintar();return;}
    if(e.target.closest("#vermas")){verTodo=true;pintar();return;}
    var card=e.target.closest(".rem");if(!card)return;
    var i=card.getAttribute("data-i"),V=viejos(),x=V[i];
    var b=e.target.closest("[data-act]");if(!b)return;
    var act=b.getAttribute("data-act");
    if(act==="tog"){ if(sel[i])delete sel[i]; else sel[i]=num(card.querySelector("[data-act=in]").value)||a10(costoUnit(x)*1.2); }
    if(act==="p"){ var v=num(b.getAttribute("data-v"));card.querySelector("[data-act=in]").value=v;sel[i]=v; }
    render(card,i,x);total();
  });
  document.addEventListener("input",function(e){
    if(e.target.id==="moto"){MOTO=num(e.target.value);
      var W=viejos();
      document.querySelectorAll(".rem").forEach(function(c){render(c,c.getAttribute("data-i"),W[c.getAttribute("data-i")]);});
      total();return;}
    var b=e.target.closest("[data-act=in]");if(!b)return;
    var card=b.closest(".rem"),i=card.getAttribute("data-i");
    var V=viejos();
    sel[i]=num(b.value);render(card,i,V[i]);total();
  });

  function render(card,i,x){
    var on=sel[i]!=null&&sel[i]>0;card.classList.toggle("on",on);
    var p=num(card.querySelector("[data-act=in]").value),cu=costoUnit(x);
    card.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("on",num(o.getAttribute("data-v"))===p);});
    var neto=(p-MOTO)*x.piezas,dif=neto-x.capital,porPza=p-MOTO-cu;
    card.querySelector("[data-f]").innerHTML=on
      ? "<b>Si vendes una sola:</b> entra "+mx(p)+", envío −"+mx(MOTO)+", te costó "+mx(cu)+" → "+
        (porPza>=0?"<b>+"+mx(porPza)+"</b>":'<b class="mal">'+mx(porPza)+"</b>")+" por pieza.<br>"+
        "<b>Si salen las "+x.piezas+":</b> recuperas <b>"+mx(neto)+"</b> de los "+mx(x.capital)+" que pagaste · "+
        (dif>=0?"<b>+"+mx(dif)+"</b> de ganancia":'te faltan <b class="mal">'+mx(-dif)+"</b>")
      : "Toca la palomita para incluirlo en el plan";
  }

  function total(){
    var V=viejos();
    var libera=0,cost=0,pz=0,n=0;
    Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;libera+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;n++;});
    $("bot-val").textContent=mx(libera);
    $("bot-sub").textContent=n?(pz+" pieza"+(pz===1?"":"s")+" · pagaste "+mx(cost)+" · recuperas ya con el envío descontado"):"Elige qué rematar";
    $("btn-plan").disabled=!n;
  }
  $("btn-limpiar").addEventListener("click",function(){sel={};document.querySelectorAll(".rem").forEach(function(c){c.classList.remove("on");c.querySelector("[data-f]").textContent="Toca la palomita para incluirlo en el plan";});total();});

  $("btn-plan").addEventListener("click",function(){
    var V=viejos(),lin=[],libera=0,cost=0,pz=0;
    Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
      libera+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;
      lin.push("• "+x.descripcion+" — "+x.piezas+" pza · REMATE "+mx(sel[i])+" (antes "+mx(x.precio)+")");});
    var txt="REMATE KIOSKO\n"+pz+" piezas · recuperas "+mx(libera)+" ya con el envío descontado\n\n"+lin.join("\n");
    abrirHoja("<h3>Tu plan de remate</h3>"+
      "<p>Vas a mover <b>"+pz+" piezas</b> que llevaban meses paradas y a recuperar <b>"+mx(libera)+"</b> limpios, ya descontado el motomandado de "+mx(MOTO)+" por pieza. Te costaron "+mx(cost)+".</p>"+
      (libera<cost?"<p>Recuperas menos de lo que pagaste. <b>Eso está bien</b> si esas piezas llevan un año sin moverse: un billete dormido no vale más por esperar.</p>":"")+
      "<p>Publícalas juntas en Marketplace como un lote de ofertas: los remates atraen compradores que luego ven el resto de tu catálogo. Cuando se vendan, registra la venta con el precio de remate para que tus números sigan siendo ciertos.</p>"+
      '<textarea readonly id="plan-txt">'+esc(txt)+"</textarea>"+
      '<div style="display:flex;gap:.5rem;margin-top:.75rem"><button class="cta" id="cp">Copiar lista</button><button class="cta ghost" data-cerrar="1">Cerrar</button></div>');
    $("cp").addEventListener("click",function(){var t=$("plan-txt");t.removeAttribute("readonly");t.select();try{document.execCommand("copy");}catch(e){}t.setAttribute("readonly","readonly");this.textContent="Copiado";});
  });

  var EXP={
    pildoras:["Los tres precios que te propongo","<b>Sin perder</b> = lo que te costó el producto más el envío. Es tu piso real: por debajo de ahí estás pagando por regalar mercancía. Para casi todo lo que lleva un año parado, este precio ya es suficiente, porque lo que ganas es recuperar el dinero, no la utilidad.<br><br><b>Ganas $50</b> = ese piso más cincuenta pesos limpios por pieza. Úsalo cuando el producto todavía tiene demanda y solo necesita un empujón.<br><br><b>Mitad de precio</b> = la mitad de lo que pides hoy. Este no sale de tus costos, sale de la cabeza del comprador: \"50% de descuento\" se entiende sin pensar y es el que más gente atrae. Úsalo cuando lo que te urge es que salga ya."],
    capital:["Capital detenido","Es el dinero que ya pagaste y sigue en cajas. No lo perdiste, pero tampoco lo tienes: no puede comprar nada nuevo hasta que se venda.<br><br>La medida que usan los negocios es cuántos <b>meses de ganancia</b> tienes congelados. Uno o dos es normal. Cinco o más significa que compraste más rápido de lo que vendes, o compraste cosas que no salen."],
    remate:["¿Vender al costo es perder?","No. Perder es que el dinero siga parado un año más.<br><br>Una pieza que compraste en $150 y no sale a $300 no vale $300: vale lo que alguien pague hoy. Si la rematas en $170 recuperas tu dinero, compras algo que sí rota y esos $170 dan la vuelta tres veces al año.<br><br>El error clásico del que empieza es aferrarse al precio que <b>quería</b> ganar. El que lleva años mira el calendario, no el precio."],
    envio:["El envío te está costando más de lo que crees","Revisé tus 461 ventas. <b>225 se entregaron a domicilio</b> —la mitad— y en ellas pagaste <b>$10,485</b> de motomandado.<br><br>Cobraste el extra al cliente en <b>30 de esas 225 entregas</b>: el 13%. En total recuperaste $330 de los $10,485. <b>Absorbiste $10,155.</b><br><br>Además el moto no siempre cuesta $35: hay 16 entregas de $100 y 10 de $80. Tu promedio real por entrega es de <b>$47</b>, no $35.<br><br>Por eso aquí el envío se descuenta completo. Si empiezas a cobrarlo siempre, este número mejora solo y sin invertir un peso."],
    rotacion:["Rotación","Cuántos días pasan, en promedio, desde que compras una pieza hasta que se vende.<br><br>Lo importante no es el número solo: es compararlo contra <b>cuánto lleva parado lo que tienes hoy</b>. Si una categoría se vende en 90 días pero tu stock lleva 340, esas piezas concretas son las que no salen. Esas son las que rematas."],
    margen:["Margen","De cada $100 que entran, cuántos te quedas después de pagar el producto, el envío y el motomandado.<br><br>El margen no es la ganancia. Puedes tener margen alto y ganar poco si vendes pocas piezas. Por eso al lado va siempre cuánto ganas <b>por venta</b> y cuántas ventas fueron."]
  };
  function abrirExp(k){var e=EXP[k];if(!e)return;abrirHoja("<h3>"+e[0]+"</h3><p>"+e[1]+'</p><button class="cta" data-cerrar="1">Entendido</button>');}
  function abrirHoja(html){$("hoja-in").innerHTML=html;$("hoja").classList.remove("oculto");}
  $("hoja").addEventListener("click",function(e){if(e.target===$("hoja")||e.target.closest("[data-cerrar]"))$("hoja").classList.add("oculto");});
})();
</script>
</body>
</html>
