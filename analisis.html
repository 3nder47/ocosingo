<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF0F6">
<title>Análisis Estratégico — Kiosko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kiosko.css?v=1">
</head>
<body>

<div class="pin" id="pin"><div class="pin-c">
  <div class="logo-icon">Ki</div>
  <h1>Análisis Estratégico</h1>
  <p>Ingresa tu PIN de Kiosko</p>
  <input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
  <div class="pin-e" id="pin-e"></div>
</div></div>

<div id="app" class="oculto"><div class="app">
  <aside class="lado">
    <div class="marca"><div class="logo-icon">Ki</div><div><b>Kiosko</b><small>Ocosingo</small></div></div>
    <div class="nav-t">DECISIONES CLAVE</div>
    <button class="nav on" data-ir="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Resumen</button>
    <button class="nav" data-ir="rotacion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>1. Qué comprar</button>
    <button class="nav" data-ir="remate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.6 8.4 12 17l-4-4"/><path d="M4 4h16v16H4z"/></svg>2. Plan de remate <span class="pin-n" id="nav-n"></span></button>
    <button class="nav" data-ir="margen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>3. A cuánto vender</button>
    <div class="nav-t">HISTÓRICO</div>
    <button class="nav" data-ir="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>Ventas por mes</button>
    <button class="nav" data-ir="parado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/></svg>Dinero detenido</button>
    <div class="nav-t">OTRAS PANTALLAS</div>
    <button class="nav" onclick="location.href='alta.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>Alta de pedido</button>
  </aside>

  <div>
    <div class="movil" id="movil"></div>
    <main class="main">
      <div class="cab">
        <div><h1>Tablero de decisiones</h1><p>Dónde está tu dinero, qué comprar y cuánto recuperar hoy mismo</p></div>
        <div class="rango"><button id="r-todo" class="on">Todo el tiempo</button><button id="r-12m">Últimos 12 meses</button></div>
      </div>
      <div class="bento" id="rej"><div class="cargando"><div class="spin"></div>Cargando datos de tu negocio…</div></div>
    </main>
  </div>
</div></div>

<div class="bottom-bar" id="bot"><div class="bottom-bar-inner">
  <div class="bottom-bar-text"><small id="bot-s">Selecciona mercancía a rematar</small><b class="mono" id="bot-v">$0</b></div>
  <button class="btn-action gh" id="b-limpiar">Limpiar</button>
  <button class="btn-action pri" id="b-plan" disabled>Generar plan</button>
</div></div>
<div class="modal-overlay" id="mo"><div class="modal-box" id="mo-in"></div></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";
function api(a,p,b,ms){ms=ms||30000;
  if(!API_URL||!API_TOKEN)return Promise.reject(new Error("Falta la configuración de config.js"));
  var u=new URL(API_URL),c=new AbortController(),t=setTimeout(function(){c.abort();},ms),o={redirect:"follow",signal:c.signal};
  if(b){o.method="POST";o.headers={"Content-Type":"text/plain;charset=utf-8"};o.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:a},b));}
  else u.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:a},p||{})).toString();
  return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error("Respuesta del servidor: "+r.status);return r.text();})
   .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("Respuesta de datos no válida");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
   .catch(function(e){clearTimeout(t);if(e&&e.name==="AbortError")throw new Error("El servidor tardó demasiado");throw e;});}

var $=function(i){return document.getElementById(i);};
function num(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function mx(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX");}
function a10(n){return Math.ceil(n/10)*10;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function dias(d){if(!d)return"—";if(d<45)return d+" días";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años";}
var PAL=["#10B981","#84CC16","#3B82F6","#F97316","#8B5CF6","#14B8A6","#EF4444","#F59E0B","#EC4899","#64748B"];
var D=null,MESES=[],rango="todo",sel={},FOTOS={},MOTO=35,orden="dinero",verTodo=false,seccion="resumen";

function cuenta(el,hasta,fmt){
  if(!el)return;var t0=performance.now(),dur=1000;
  (function paso(t){var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);el.textContent=fmt(hasta*k);if(k<1)requestAnimationFrame(paso);})(t0);
}

var pi=$("pin-in");
pi.addEventListener("input",function(){
  if(pi.value.length<4)return;
  var v=pi.value;pi.disabled=true;$("pin-e").textContent="";
  api("verificarPin",null,{pin:v}).then(function(d){
    if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
    if(d.vendedor!=="Alex")throw new Error("Pantalla restringida a Alex");
    $("pin").classList.add("oculto");$("app").classList.remove("oculto");cargar();
  }).catch(function(e){$("pin-e").textContent=e.message;pi.value="";pi.disabled=false;pi.focus();});
});

function cargar(){
  $("rej").innerHTML='<div class="cargando"><div class="spin"></div>Sincronizando tu hoja…</div>';
  $("bot").classList.remove("on");
  Promise.all([
    api("analisis",{rango:rango},null,45000),
    api("catalogo",null,null,30000).catch(function(){return[];}),
    api("inicio",{usuario:"Alex"},null,35000).catch(function(){return{};})
  ]).then(function(r){
    D=r[0];sel={};FOTOS={};
    (r[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)FOTOS[norm(x.descripcion)]=x.imagen;});
    MESES=(r[2]&&r[2].ventasMes)||[];
    pintar();
  }).catch(function(e){$("rej").innerHTML='<div class="cargando">'+esc(e.message)+"</div>";});
}
$("r-todo").addEventListener("click",function(){if(rango==="todo")return;rango="todo";marcaR();cargar();});
$("r-12m").addEventListener("click",function(){if(rango==="12m")return;rango="12m";marcaR();cargar();});
function marcaR(){$("r-todo").classList.toggle("on",rango==="todo");$("r-12m").classList.toggle("on",rango==="12m");}
function meses(){if(rango==="12m")return 12;var d=D&&D.resumen&&D.resumen.desde;if(!d)return 12;
  return Math.max(1,Math.round((Date.now()-Number(d))/(30.4*864e5)));}
function viejos(){var V=(D.viejos||[]).filter(function(x){return x.dias>180;}).slice();
  V.sort(orden==="dinero"?function(a,b){return b.capital-a.capital;}:function(a,b){return b.dias-a.dias;});return V;}
function costoU(x){return x.piezas?x.capital/x.piezas:0;}

/* Gráfica: escala proporcional, raya de promedio y el mes en curso marcado aparte */
function area(){
  if(!MESES.length)return "";
  var W=680,H=200,P={t:26,b:10,l:4,r:4};
  var vals=MESES.map(function(m){return Number(m.total)||0;}),n=vals.length;
  var completos=n>1?vals.slice(0,n-1):vals;
  var prom=completos.reduce(function(a,b){return a+b;},0)/Math.max(1,completos.length);
  var max=Math.max.apply(null,vals.concat([1]));
  var px=function(i){return P.l+i*((W-P.l-P.r)/Math.max(1,n-1));};
  var py=function(v){return P.t+(H-P.t-P.b)*(1-v/max);};
  var pts=vals.map(function(v,i){return [px(i),py(v)];});
  var d=pts.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+","+q[1].toFixed(1);
    var p0=pts[i-1],cx=(p0[0]+q[0])/2;
    return "C"+cx.toFixed(1)+","+p0[1].toFixed(1)+" "+cx.toFixed(1)+","+q[1].toFixed(1)+" "+q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  var ar=d+" L"+pts[n-1][0].toFixed(1)+","+H+" L"+pts[0][0].toFixed(1)+","+H+" Z";
  var yp=py(prom);
  return '<div class="chart-container" id="chart"><svg viewBox="0 0 '+W+" "+H+'">'+
    '<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#84CC16"/></linearGradient>'+
    '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".3"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+P.l+'" y1="'+yp.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+yp.toFixed(1)+'" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>'+
    '<text x="'+(W-P.r)+'" y="'+(yp-7).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="#94A3B8">promedio '+mx(prom)+'</text>'+
    '<path class="area" d="'+ar+'"/><path class="linea" vector-effect="non-scaling-stroke" d="'+d+'"/>'+
    pts.map(function(q,i){return '<circle class="pt'+(i===n-1?" curso":"")+'" data-i="'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5"/>';}).join("")+
    '</svg><div class="tip" id="tip"></div>'+
    '<div class="ejes"><span>'+esc(MESES[0].label)+"</span><span>"+esc(MESES[n-1].label)+" · en curso</span></div></div>";
}
/* Texto honesto: compara meses completos y deja el actual aparte */
function textoVentas(){
  var n=MESES.length,curso=MESES[n-1],comp=n>1?MESES[n-2]:null,ant=n>2?MESES[n-3]:null;
  var dif=(comp&&ant)?(Number(comp.total)-Number(ant.total)):0;
  return '<p class="sub">Historial de los últimos '+n+' meses. La raya punteada es tu promedio mensual: arriba fue buen mes, abajo fue flojo.'+
    (comp?" Tu último mes completo, <b>"+esc(comp.label)+"</b>, cerró en <b>"+mx(comp.total)+"</b>"+
      (ant?" ("+(dif>=0?"<b style='color:var(--verde-deep)'>+"+mx(dif)+"</b>":"<b style='color:var(--rojo)'>−"+mx(-dif)+"</b>")+" contra "+esc(ant.label)+")":"")+".":"")+
    " <b>"+esc(curso.label)+"</b> va a la mitad, por eso no se compara todavía.</p>";
}
function dona(segs,total){
  var C=2*Math.PI*78,off=0;
  var arcos=segs.filter(function(s){return s.v>0;}).map(function(s){
    var len=Math.max(0,s.v/total*C-3);
    var h='<circle cx="95" cy="95" r="78" stroke="'+s.c+'" stroke-linecap="round" stroke-dasharray="'+len.toFixed(1)+" "+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';
    off+=s.v/total*C;return h;}).join("");
  return '<div class="dona-wrapper"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" stroke="rgba(210,220,233,.4)"/>'+arcos+
    '</svg><div class="ctr"><b class="mono">'+mx(total)+"</b><span>en cajas</span></div></div>";
}

var SECS=[["resumen","Resumen"],["rotacion","1. Qué comprar"],["remate","2. Sacar dinero"],["margen","3. Precios"],["ventas","Ventas"],["parado","Parado"]];

function pintar(){
  var R=D.resumen||{},cap=D.capital||[],rot=D.rotacion||[],mar=D.margen||[],V=viejos();
  var porMes=R.utilidad/meses(),cong=porMes>0?D.capitalTotal/porMes:0;
  var capV=V.reduce(function(s,x){return s+x.capital;},0),pzV=V.reduce(function(s,x){return s+x.piezas;},0);
  var T=D.capitalTotal||1,h="";
  $("movil").innerHTML=SECS.map(function(s,i){return '<button data-ir="'+s[0]+'"'+(i===0?' class="on"':"")+">"+s[1]+"</button>";}).join("");
  $("nav-n").textContent=V.length?V.length:"";

  h+='<section class="hero-bento ani" id="s-resumen"><div><div class="lb">Capital congelado en mercancía</div>'+
    '<div class="big mono" id="hero-v">$0</div>'+
    '<div class="lb">'+D.piezasTotal+' piezas pagadas que siguen en cajas</div></div>'+
    '<div class="pillas"><span class="hp lima">'+(cong?cong.toFixed(1):"—")+" meses de ganancia</span>"+
    '<span class="hp">Ganas '+mx(porMes)+" al mes</span></div></section>";

  var ks=[
    ["En riesgo (+6 meses)",mx(capV),pzV+" pzas · "+V.length+" productos","var(--naranja)","#FFF7ED",'<path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/>'],
    ["Margen general",Math.round(R.margen)+"%","de cada $100 que entran","var(--verde-deep)","#ECFDF5",'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',R.margen],
    ["Ganancia del periodo",mx(R.utilidad),R.ventas+" ventas · "+mx(R.porVenta)+" c/u","var(--azul)","#EFF6FF",'<path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>']
  ];
  h+=ks.map(function(k,i){return '<div class="kpi-card ani" style="animation-delay:'+(.08*(i+1))+'s">'+
    '<div class="ico" style="background:'+k[4]+';color:'+k[3]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+k[5]+"</svg></div>"+
    '<div><div class="lb">'+k[0]+'</div><b class="mono">'+k[1]+"</b><small>"+k[2]+"</small></div>"+
    (k[6]!=null?'<div class="rb" style="margin-top:.75rem"><div class="tr"><i class="fi" style="width:'+Math.min(100,k[6]).toFixed(0)+'%;background:linear-gradient(90deg,#10B981,#84CC16)"></i></div></div>':"")+
    "</div>";}).join("");

  var maxD=Math.max.apply(null,rot.map(function(x){return Math.max(x.diasVenta,x.diasStock);}).concat([1]));
  var ator=rot.filter(function(x){return x.piezas>0&&x.ventas>=3&&x.diasStock>x.diasVenta*2;});
  h+='<section class="b-card w7 ani" id="s-rotacion">'+
    '<span class="decision-tag d1">Decisión 1: Qué comprar</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg> Rotación de inventario</h2>'+
    '<p class="sub">Verde: <b>días que tarda en venderse</b>. Naranja: <b>días que lleva parado hoy</b>. Invierte en verde, frena en naranja.</p>'+
    '<div style="margin-top:1.25rem">'+rot.map(function(x){
      var mal=x.piezas&&x.ventas>=3&&x.diasStock>x.diasVenta*2;
      return '<div class="rot-item"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" ventas · "+(x.piezas?x.piezas+" en stock":"sin stock")+"</small></div></div>"+
        '<div class="rb"><span class="et">Venta</span><div class="tr"><i class="fi" style="width:'+Math.max(4,x.diasVenta/maxD*100).toFixed(1)+'%;background:linear-gradient(90deg,#10B981,#84CC16)"></i></div><span class="vl mono">'+dias(x.diasVenta)+"</span></div>"+
        '<div class="rb"><span class="et">Parado</span><div class="tr"><i class="fi" style="width:'+Math.max(4,x.diasStock/maxD*100).toFixed(1)+'%;background:'+(mal?"linear-gradient(90deg,#EF4444,#F97316)":"linear-gradient(90deg,#F97316,#F59E0B)")+'"></i></div><span class="vl mono">'+dias(x.diasStock)+"</span></div></div>";
    }).join("")+"</div>"+
    (ator.length?'<div class="aviso warn"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div>Atención en <b>'+ator.map(function(x){return esc(x.categoria);}).join("</b>, <b>")+"</b>: lo que te queda lleva parado más del doble de lo que tarda en venderse.</div></div>":'<div class="aviso ok"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5L20 7"/></svg></span><div>Rotación saludable: nada excede sus tiempos normales.</div></div>')+
    '<button class="btn-help" data-exp="rotacion">¿Cómo interpretar esto?</button></section>';

  h+='<section class="b-card w5 ani" id="s-parado">'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/></svg> Distribución del capital</h2>'+
    '<p class="sub">Cada rebanada es una categoría. Mientras más grande, más dinero tuyo espera ahí.</p>'+
    '<div style="margin-top:1rem">'+dona(cap.map(function(x,i){return{v:x.capital,c:PAL[i%PAL.length]};}),T)+"</div>"+
    '<div class="legenda">'+cap.slice(0,7).map(function(x,i){
      return '<button><i style="background:'+PAL[i%PAL.length]+'"></i><span class="t">'+esc(x.categoria)+'</span><span class="v mono">'+mx(x.capital)+" · "+Math.round(x.capital/T*100)+"%</span></button>";}).join("")+"</div>"+
    '<button class="btn-help" data-exp="capital">¿Por qué es vital?</button></section>';

  h+='<section class="b-card ani" id="s-remate">'+
    '<span class="decision-tag d2">Decisión 2: Recuperar efectivo</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.6 8.4 12 17l-4-4"/><path d="M4 4h16v16H4z"/></svg> Plan de remate</h2>'+
    '<p class="sub">Tienes <b>'+mx(capV)+'</b> parados hace más de 6 meses en <b>'+pzV+' piezas</b>. Elige cuáles mover y a qué precio.</p>'+
    (V.length>4?'<div class="aviso warn"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span><div><b>Empieza por aquí:</b> '+esc(V.slice(0,4).map(function(x){return x.descripcion;}).join(", "))+" concentran <b>"+mx(V.slice(0,4).reduce(function(s,x){return s+x.capital;},0))+"</b>. Mover esos cuatro vale más que mover los otros "+(V.length-4)+" juntos.</div></div>":"")+
    '<div class="ctrl-bar"><span>Envío que absorbes por pieza:</span><span class="inp-pill">$<input id="moto" type="number" step="5" min="0" value="'+MOTO+'"></span>'+
    '<span style="margin-left:auto">Ordenar:</span><div class="ord-pill"><button data-ord="dinero"'+(orden==="dinero"?' class="on"':"")+'>Dinero</button><button data-ord="dias"'+(orden==="dias"?' class="on"':"")+'>Antigüedad</button></div>'+
    '<small>El motomandado sale de tu bolsa en casi todas tus entregas. Ya viene restado en cada cuenta.</small></div>'+
    '<div class="product-grid">'+(V.length?V.slice(0,verTodo?999:12).map(pcHTML).join(""):'<div class="aviso ok" style="grid-column:1/-1"><span class="ic"></span><div>Nada lleva más de 6 meses parado. Vas bien.</div></div>')+"</div>"+
    (V.length>12&&!verTodo?'<button class="vermas-btn" id="vermas">Ver los '+(V.length-12)+" productos restantes · suman "+mx(V.slice(12).reduce(function(s,x){return s+x.capital;},0))+"</button>":"")+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.25rem"><button class="btn-help" data-exp="remate">¿Vender al costo es perder?</button>'+
    '<button class="btn-help" data-exp="pildoras">¿De dónde salen los 3 precios?</button>'+
    '<button class="btn-help" data-exp="envio">¿Por qué descuento el envío?</button></div></section>';

  h+='<section class="b-card ani" id="s-margen">'+
    '<span class="decision-tag d3">Decisión 3: A cuánto vender</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Rendimiento por categoría</h2>'+
    '<p class="sub">La barra compara el margen entre categorías: la más larga es la que mejor te paga. Ojo: la que más margen deja no siempre es la que más dinero te da.</p>'+
    '<div style="margin-top:1.25rem">'+(function(){var mm=Math.max.apply(null,mar.map(function(y){return y.margen;}).concat([1]));
      return mar.map(function(x,i){
        return '<div class="rot-item"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" ventas · "+mx(x.porVenta)+' c/u</small></div><div style="text-align:right"><b style="color:var(--verde-deep)" class="mono">'+mx(x.utilidad)+'</b><small>'+Math.round(x.margen)+"% margen</small></div></div>"+
          '<div class="rb"><div class="tr"><i class="fi" style="width:'+Math.max(6,x.margen/mm*100).toFixed(1)+'%;background:'+PAL[i%PAL.length]+'"></i></div></div></div>';}).join("");})()+"</div>"+
    '<button class="btn-help" data-exp="margen">¿Qué es el margen?</button></section>';

  if(MESES.length){
    h+='<section class="b-card ani" id="s-ventas">'+
      '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg> Comportamiento de ventas</h2>'+
      textoVentas()+area()+"</section>";
  }

  $("rej").innerHTML=h;
  cuenta($("hero-v"),D.capitalTotal,mx);
  cablearChart();espiar();total();
}

function pcHTML(x,i){
  var cu=costoU(x),img=FOTOS[norm(x.descripcion)];
  return '<article class="prod-card" data-i="'+i+'">'+
    '<div class="top">'+
      (img?'<img class="im" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'<span class="im sin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.4"/><path d="m21 15-5-5L5 19"/></svg></span>')+
      '<div class="tx"><b>'+esc(x.descripcion)+"</b><small>"+esc(x.categoria)+" · "+x.piezas+" pza · te costó "+mx(cu)+" c/u</small></div>"+
      '<button class="chk-box" data-act="tog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg></button>'+
    "</div>"+
    '<div class="tags"><span class="tg cong">'+mx(x.capital)+' congelados</span><span class="tg dias">'+dias(x.dias)+"</span></div>"+
    (function(){var op=[["Sin perder",a10(cu+MOTO)],["Ganas $50",a10(cu+MOTO+50)],["Mitad",a10(x.precio/2)]],vis={},u=[];
      op.forEach(function(o){if(vis[o[1]])return;vis[o[1]]=1;u.push(o);});
      return '<div class="precios-opt" style="grid-template-columns:repeat('+u.length+',1fr)">'+u.map(function(o){
        return '<button class="po-btn" data-act="p" data-v="'+o[1]+'"><span>'+o[0]+'</span><b class="mono">'+mx(o[1])+"</b></button>";}).join("")+"</div>";})()+
    '<div class="libre-input">o pon tu precio: <span class="inp-pill">$<input data-act="in" type="number" step="10" min="0" value="'+a10(cu+MOTO)+'"></span></div>'+
    '<div class="cuenta-box" data-f="1">Toca la palomita para incluirlo en el plan.</div></article>';
}

function render(card,i,x){
  if(!x)return;
  var on=sel[i]!=null&&sel[i]>0;card.classList.toggle("on",on);
  var p=num(card.querySelector("[data-act=in]").value),cu=costoU(x);
  card.querySelectorAll(".po-btn").forEach(function(o){o.classList.toggle("on",num(o.getAttribute("data-v"))===p);});
  var neto=(p-MOTO)*x.piezas,dif=neto-x.capital,porPza=p-MOTO-cu;
  card.querySelector("[data-f]").innerHTML=on
    ? "<b>Si vendes una:</b> entra "+mx(p)+" − envío "+mx(MOTO)+" − costo "+mx(cu)+" = "+
      (porPza>=0?'<b class="bien">+'+mx(porPza)+"</b>":'<b class="mal">'+mx(porPza)+"</b>")+" libre.<br>"+
      "<b>Si salen las "+x.piezas+":</b> recuperas <b class='mono'>"+mx(neto)+"</b> de "+mx(x.capital)+" · "+
      (dif>=0?'<b class="bien">+'+mx(dif)+"</b>":'te faltan <b class="mal">'+mx(-dif)+"</b>")
    : "Toca la palomita para incluirlo en el plan.";
}

function verBarra(){
  var hay=Object.keys(sel).some(function(i){return sel[i]>0;});
  $("bot").classList.toggle("on",hay||seccion==="remate");
}
function total(){
  var V=viejos(),lib=0,cost=0,pz=0,n=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;n++;});
  $("bot-v").textContent=mx(lib);
  $("bot-s").textContent=n?(pz+" piezas · "+n+" productos · pagaste "+mx(cost)):"Selecciona mercancía a rematar";
  $("b-plan").disabled=!n;
  verBarra();
}

function cablearChart(){
  var ch=$("chart");if(!ch)return;
  ch.addEventListener("mouseover",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    var m=MESES[Number(p.getAttribute("data-i"))];if(!m)return;
    var tip=$("tip"),r=ch.getBoundingClientRect(),pr=p.getBoundingClientRect();
    tip.textContent=m.label+" · "+mx(m.total)+(m.cantidad?" · "+m.cantidad+" pzas":"");
    tip.style.left=(pr.left-r.left+pr.width/2)+"px";tip.style.top=(pr.top-r.top)+"px";
    tip.classList.add("on");p.classList.add("on");
  });
  ch.addEventListener("mouseout",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    $("tip").classList.remove("on");p.classList.remove("on");
  });
}
function espiar(){
  var obs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var id=en.target.id.replace("s-","");
      if(id===seccion)return;seccion=id;
      document.querySelectorAll("[data-ir]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-ir")===id);});
      verBarra();
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  SECS.forEach(function(s){var el=$("s-"+s[0]);if(el)obs.observe(el);});
}

document.addEventListener("click",function(e){
  var ir=e.target.closest("[data-ir]");
  if(ir){var el=$("s-"+ir.getAttribute("data-ir"));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
  var ex=e.target.closest("[data-exp]");if(ex){abrir(ex.getAttribute("data-exp"));return;}
  var od=e.target.closest("[data-ord]");if(od){orden=od.getAttribute("data-ord");sel={};verTodo=false;pintar();return;}
  if(e.target.closest("#vermas")){verTodo=true;pintar();return;}
  var card=e.target.closest(".prod-card");if(!card)return;
  var b=e.target.closest("[data-act]");if(!b)return;
  var i=card.getAttribute("data-i"),x=viejos()[i],act=b.getAttribute("data-act");
  if(act==="tog"){if(sel[i])delete sel[i];else sel[i]=num(card.querySelector("[data-act=in]").value)||a10(costoU(x)+MOTO);}
  if(act==="p"){var v=num(b.getAttribute("data-v"));card.querySelector("[data-act=in]").value=v;sel[i]=v;}
  render(card,i,x);total();
});
document.addEventListener("input",function(e){
  if(e.target.id==="moto"){MOTO=num(e.target.value);
    document.querySelectorAll(".prod-card").forEach(function(c){render(c,c.getAttribute("data-i"),viejos()[c.getAttribute("data-i")]);});total();return;}
  var b=e.target.closest("[data-act=in]");if(!b)return;
  var card=b.closest(".prod-card"),i=card.getAttribute("data-i");
  sel[i]=num(b.value);render(card,i,viejos()[i]);total();
});
$("b-limpiar").addEventListener("click",function(){
  sel={};document.querySelectorAll(".prod-card").forEach(function(c){c.classList.remove("on");
    c.querySelector("[data-f]").textContent="Toca la palomita para incluirlo en el plan.";
    c.querySelectorAll(".po-btn").forEach(function(o){o.classList.remove("on");});});
  total();});

$("b-plan").addEventListener("click",function(){
  var V=viejos(),lin=[],lib=0,cost=0,pz=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
    lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;
    lin.push("• "+x.descripcion+" — "+x.piezas+" pza · REMATE "+mx(sel[i])+" (antes "+mx(x.precio)+")");});
  var txt="REMATE KIOSKO\n"+pz+" piezas · recuperas "+mx(lib)+" ya con el envío descontado\n\n"+lin.join("\n");
  abrirHTML("<h3>Tu plan de remate</h3>"+
    "<p>Vas a mover <b>"+pz+" piezas</b> paradas hace meses y a recuperar <b>"+mx(lib)+"</b> limpios, ya descontado el envío de "+mx(MOTO)+" por pieza. Te costaron "+mx(cost)+".</p>"+
    (lib<cost?"<p>Recuperas menos de lo que pagaste. <b>Eso está bien</b> si llevan un año sin moverse: un billete dormido no vale más por esperar.</p>":"")+
    "<p><b>Véndelas en paquete.</b> El envío cuesta lo mismo lleves una pieza o tres: es por viaje. Ofrece lotes o pide que lo recojan y esa resta desaparece.</p>"+
    '<textarea readonly id="plan-txt">'+esc(txt)+"</textarea>"+
    '<p class="sub" style="margin-top:1rem"><b>Aplicar el remate</b> cambia el precio en tu hoja, en todas las piezas sin vender de esos productos, y se refleja solo en la app y en tu catalogo. El precio anterior queda guardado: se puede deshacer.</p>'+
    '<div style="display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap"><button class="btn-action pri" id="aplicar">Aplicar remate a mi hoja</button>'+
    '<button class="btn-action gh" id="cp">Solo copiar lista</button><button class="btn-action gh" data-cerrar="1">Cerrar</button></div>'+
    '<div id="res-remate" class="sub" style="margin-top:1rem"></div>');
  $("aplicar").addEventListener("click",function(){
    var b=this;b.disabled=true;b.textContent="Aplicando…";
    var items=[];
    Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
      items.push({descripcion:x.descripcion,categoria:x.categoria,precio:sel[i]});});
    api("aplicarRemate",null,{remate:{usuario:"Alex",items:items}},45000).then(function(r){
      if(!r||!r.success)throw new Error((r&&r.error)||"No se pudo aplicar");
      $("res-remate").innerHTML="<b>Listo: "+r.piezas+" pieza"+(r.piezas===1?"":"s")+" con precio nuevo.</b><br>"+
        r.productos.map(function(p){return esc(p.descripcion)+" · "+p.piezas+" pza · "+mx(p.antes)+" → <b>"+mx(p.ahora)+"</b>";}).join("<br>")+
        (r.verificado?"":"<br>"+esc(r.aviso||""));
      b.textContent="Aplicado";
    }).catch(function(e){$("res-remate").innerHTML='<b style="color:var(--rojo)">'+esc(e.message)+"</b>";
      b.disabled=false;b.textContent="Aplicar remate a mi hoja";});
  });
  $("cp").addEventListener("click",function(){var t=$("plan-txt");t.removeAttribute("readonly");t.select();
    try{document.execCommand("copy");}catch(e){}t.setAttribute("readonly","readonly");this.textContent="Copiado";});
});

var EXP={
  capital:["Capital congelado","Es el dinero que ya pagaste y sigue en cajas. No lo perdiste, pero tampoco lo tienes: no puede comprar nada nuevo hasta que se venda.<br><br>La medida que usan los negocios es cuántos <b>meses de ganancia</b> tienes congelados. Uno o dos es normal. Cinco o más significa que compraste más rápido de lo que vendes."],
  remate:["¿Vender al costo es perder?","No. Perder es que el dinero siga parado un año más.<br><br>Una pieza que compraste en $150 y no sale a $300 no vale $300: vale lo que alguien pague hoy. Si la rematas en $180 recuperas tu dinero, compras algo que sí rota y ese billete da la vuelta tres veces al año.<br><br>El que empieza se aferra al precio que <b>quería</b> ganar. El que lleva años mira el calendario, no el precio."],
  pildoras:["Los tres precios que te propongo","<b>Sin perder</b> = costo del producto + envío. Es tu piso real: debajo de ahí pagas por regalar mercancía.<br><br><b>Ganas $50</b> = ese piso más cincuenta pesos limpios por pieza.<br><br><b>Mitad de precio</b> = la mitad de lo que pides hoy. No sale de tus costos, sale de la cabeza del comprador: “50% de descuento” se entiende sin pensar."],
  envio:["El envío te cuesta más de lo que crees","De tus 461 ventas, <b>225 se entregaron a domicilio</b> y en ellas pagaste <b>$10,485</b> de motomandado.<br><br>Cobraste el extra en <b>30 de esas 225</b>: el 13%. Recuperaste $330. <b>Absorbiste $10,155.</b><br><br>Además el moto no siempre cuesta $35: hay 16 entregas de $100 y 10 de $80. Tu promedio real es <b>$47</b>.<br><br>Si empiezas a cobrarlo siempre, este número mejora solo y sin invertir un peso."],
  rotacion:["Rotación","Cuántos días pasan, en promedio, desde que compras una pieza hasta que se vende.<br><br>Lo importante es compararlo contra <b>cuánto lleva parado lo que tienes hoy</b>. Si una categoría se vende en 90 días pero tu stock lleva 340, esas piezas concretas son las que no salen. Esas son las que rematas."],
  margen:["Margen","De cada $100 que entran, cuántos te quedas después de pagar el producto y el envío.<br><br>El margen no es la ganancia. Puedes tener margen alto y ganar poco si vendes pocas piezas: fíjate siempre en las dos columnas juntas."]
};
function abrir(k){var e=EXP[k];if(!e)return;abrirHTML("<h3>"+e[0]+"</h3><p>"+e[1]+'</p><button class="btn-action pri" data-cerrar="1">Entendido</button>');}
function abrirHTML(html){$("mo-in").innerHTML=html;$("mo").classList.add("on");}
$("mo").addEventListener("click",function(e){if(e.target===this||e.target.closest("[data-cerrar]"))this.classList.remove("on");});
})();
</script>
