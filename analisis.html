<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Análisis — Kiosko Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F9; --card:#FFFFFF; --card-alt:#F8FAFC;
  --primary:#0F172A; --text:#1E293B; --text-light:#64748B; --text-muted:#94A3B8;
  --border:#E2E8F0;
  --success:#10B981; --success-bg:#D1FAE5; --success-light:#34D399;
  --warning:#F59E0B; --warning-bg:#FEF3C7;
  --danger:#EF4444; --danger-bg:#FEE2E2;
  --info:#3B82F6; --info-bg:#DBEAFE;
  --purple:#8B5CF6; --purple-bg:#EDE9FE;
  --gradient-1:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-2:linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --gradient-3:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --gradient-4:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow:0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-xl:0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --radius:16px; --radius-sm:12px; --radius-lg:24px; --pill:9999px;
  --transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:0.9375rem;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* Animaciones */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes scaleIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.animate-fade{animation:fadeIn 0.5s ease-out forwards}
.animate-slide{animation:slideIn 0.5s ease-out forwards}
.animate-scale{animation:scaleIn 0.4s ease-out forwards}
.animate-pulse{animation:pulse 2s ease-in-out infinite}
.animate-float{animation:float 3s ease-in-out infinite}

/* Utilidades */
.hidden{display:none!important}
.text-gradient{background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* PIN Screen */
.pin-screen{
  position:fixed;inset:0;z-index:50;
  background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  display:flex;align-items:center;justify-content:center;
  padding:2rem;
}
.pin-card{
  width:100%;max-width:400px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:var(--radius-lg);
  padding:3rem 2rem;
  text-align:center;
  animation:scaleIn 0.5s ease-out;
}
.pin-logo{
  width:80px;height:80px;
  background:var(--gradient-1);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 2rem;
  font-size:2rem;font-weight:800;color:#fff;
  box-shadow:0 10px 30px -10px rgba(102,126,234,0.5);
  animation:float 3s ease-in-out infinite;
}
.pin-card h1{color:#fff;font-size:1.75rem;font-weight:800;margin-bottom:0.5rem}
.pin-card p{color:var(--text-muted);margin-bottom:2rem}
.pin-input{
  width:100%;
  font-size:2.5rem;font-weight:800;
  text-align:center;letter-spacing:0.5em;
  padding:1.5rem;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.1);
  border-radius:var(--radius);
  color:#fff;
  transition:var(--transition);
}
.pin-input:focus{
  outline:none;
  border-color:#667eea;
  background:rgba(255,255,255,0.1);
  box-shadow:0 0 0 4px rgba(102,126,234,0.2);
}
.pin-error{
  color:var(--danger);
  font-size:0.875rem;font-weight:600;
  margin-top:1rem;min-height:1.5rem;
  opacity:0;transition:opacity 0.3s;
}
.pin-error.show{opacity:1}

/* Header */
.header{
  position:sticky;top:0;z-index:40;
  padding:1rem;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;gap:1rem;
}
.header-logo{
  width:48px;height:48px;
  background:var(--gradient-1);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:1.25rem;
  box-shadow:var(--shadow);
}
.header-title{flex:1}
.header-title h1{font-size:1.25rem;font-weight:800;color:var(--primary)}
.header-title small{display:block;color:var(--text-light);font-size:0.8125rem;font-weight:600}
.filter-tabs{
  display:flex;gap:0.5rem;
  background:var(--card-alt);
  padding:0.375rem;
  border-radius:var(--pill);
}
.filter-tab{
  padding:0.5rem 1.25rem;
  border:none;border-radius:var(--pill);
  font-size:0.875rem;font-weight:700;
  color:var(--text-light);
  background:transparent;
  cursor:pointer;
  transition:var(--transition);
}
.filter-tab.active{
  background:#fff;
  color:var(--primary);
  box-shadow:var(--shadow-sm);
}

/* Layout */
.container{
  max-width:1400px;margin:0 auto;
  padding:1.5rem 1rem 8rem;
  display:grid;gap:1.5rem;
  grid-template-columns:repeat(12,1fr);
}

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:1.5rem;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  transition:var(--transition);
  animation:fadeIn 0.5s ease-out;
}
.card:hover{
  box-shadow:var(--shadow-lg);
  transform:translateY(-2px);
}
.card-header{margin-bottom:1.25rem}
.card-title{
  font-size:1.125rem;font-weight:800;
  color:var(--primary);
  margin-bottom:0.25rem;
}
.card-subtitle{
  font-size:0.875rem;color:var(--text-light);
  line-height:1.5;
}

/* KPI Grid */
.kpi-grid{
  grid-column:1/-1;
  display:grid;gap:1rem;
  grid-template-columns:repeat(2,1fr);
}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}

.kpi-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:1.5rem;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  transition:var(--transition);
  animation:fadeIn 0.5s ease-out;
}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--gradient-1);
  transform:scaleX(0);transition:transform 0.3s;
}
.kpi-card:hover::before{transform:scaleX(1)}
.kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}

.kpi-label{
  display:flex;align-items:center;gap:0.5rem;
  font-size:0.8125rem;font-weight:700;color:var(--text-light);
  margin-bottom:0.75rem;
}
.kpi-icon{
  width:32px;height:32px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
}
.kpi-icon.success{background:var(--success-bg);color:var(--success)}
.kpi-icon.warning{background:var(--warning-bg);color:var(--warning)}
.kpi-icon.info{background:var(--info-bg);color:var(--info)}
.kpi-icon.purple{background:var(--purple-bg);color:var(--purple)}

.kpi-value{
  font-size:2rem;font-weight:800;
  color:var(--primary);
  line-height:1;
  margin-bottom:0.25rem;
}
.kpi-sub{
  font-size:0.8125rem;color:var(--text-muted);
  font-weight:600;
}
.kpi-card.highlight{
  background:var(--gradient-1);
  color:#fff;
  border:none;
}
.kpi-card.highlight .kpi-label,
.kpi-card.highlight .kpi-sub{color:rgba(255,255,255,0.8)}
.kpi-card.highlight .kpi-value{color:#fff}

/* Charts */
.chart-container{grid-column:span 7}
@media(max-width:1024px){.chart-container{grid-column:1/-1}}

.donut-chart{
  position:relative;
  width:280px;height:280px;
  margin:2rem auto;
}
.donut-svg{transform:rotate(-90deg);width:100%;height:100%}
.donut-circle{
  fill:none;stroke-width:24;
  transition:stroke-dasharray 1s cubic-bezier(0.4, 0, 0.2, 1);
}
.donut-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.donut-value{
  font-size:2rem;font-weight:800;
  color:var(--primary);
}
.donut-label{
  font-size:0.875rem;color:var(--text-light);
  font-weight:600;
}

.legend{
  display:grid;gap:0.75rem;
  margin-top:1.5rem;
}
.legend-item{
  display:flex;align-items:center;gap:0.75rem;
  padding:0.75rem;border-radius:var(--radius-sm);
  background:var(--card-alt);
  transition:var(--transition);
  cursor:pointer;
}
.legend-item:hover{background:var(--border);transform:translateX(4px)}
.legend-dot{
  width:12px;height:12px;border-radius:3px;
  flex-shrink:0;
}
.legend-text{flex:1;font-weight:700;font-size:0.875rem}
.legend-value{font-weight:800;color:var(--text-light);font-variant-numeric:tabular-nums}

/* Progress Bars */
.rotation-list{grid-column:span 5}
@media(max-width:1024px){.rotation-list{grid-column:1/-1}}

.rotation-item{
  padding:1.25rem;
  border-radius:var(--radius-sm);
  background:var(--card-alt);
  margin-bottom:1rem;
  transition:var(--transition);
  border:2px solid transparent;
}
.rotation-item:hover{
  background:#fff;
  border-color:var(--border);
  box-shadow:var(--shadow);
}
.rotation-header{
  display:flex;justify-content:space-between;
  align-items:flex-start;margin-bottom:1rem;
}
.rotation-title{font-weight:800;color:var(--primary)}
.rotation-meta{
  font-size:0.8125rem;color:var(--text-light);
}
.rotation-bars{display:grid;gap:0.75rem}
.rotation-bar-row{
  display:flex;align-items:center;gap:1rem;
}
.rotation-bar-label{
  width:120px;font-size:0.8125rem;
  font-weight:600;color:var(--text-light);
}
.rotation-bar{
  flex:1;height:10px;border-radius:var(--pill);
  background:var(--border);
  overflow:hidden;
  position:relative;
}
.rotation-bar-fill{
  height:100%;border-radius:var(--pill);
  background:var(--gradient-4);
  transition:width 1s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative;
  overflow:hidden;
}
.rotation-bar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  animation:shimmer 2s infinite;
}
.rotation-bar-fill.warning{background:var(--gradient-2)}
.rotation-bar-fill.danger{background:linear-gradient(90deg, #ef4444, #f97316)}
.rotation-bar-value{
  width:60px;text-align:right;
  font-size:0.8125rem;font-weight:700;
  color:var(--text);
}

/* Settlement Section */
.settlement-section{grid-column:1/-1}
.settlement-header{
  background:linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border:2px solid #f59e0b;
  border-radius:var(--radius);
  padding:1.5rem;
  margin-bottom:1.5rem;
}
.settlement-alert{
  display:flex;align-items:center;gap:1rem;
  color:#92400e;font-weight:700;
}
.settlement-icon{
  width:48px;height:48px;
  background:#f59e0b;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;color:#fff;
}

.settlement-controls{
  background:var(--card-alt);
  border-radius:var(--radius);
  padding:1.25rem;
  margin-bottom:1.5rem;
  display:flex;flex-wrap:wrap;gap:1rem;
  align-items:center;
}
.control-group{
  display:flex;align-items:center;gap:0.75rem;
}
.control-label{font-weight:700;color:var(--text-light);font-size:0.875rem}
.price-input{
  display:flex;align-items:center;gap:0.5rem;
  padding:0.5rem 1rem;
  background:#fff;border:2px solid var(--border);
  border-radius:var(--pill);
  font-weight:800;font-size:1.125rem;
  transition:var(--transition);
}
.price-input:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(15,23,42,0.1);
}
.price-input input{
  width:80px;border:none;background:transparent;
  font-weight:800;font-size:1.125rem;
  text-align:right;color:var(--primary);
}
.price-input input:focus{outline:none}

.sort-buttons{
  display:flex;gap:0.5rem;
  background:#fff;border-radius:var(--pill);
  padding:0.25rem;
}
.sort-btn{
  padding:0.5rem 1rem;
  border:none;border-radius:var(--pill);
  font-weight:700;font-size:0.8125rem;
  color:var(--text-light);
  background:transparent;
  cursor:pointer;
  transition:var(--transition);
}
.sort-btn.active{
  background:var(--primary);color:#fff;
  box-shadow:var(--shadow-sm);
}

/* Product Cards */
.products-grid{
  display:grid;gap:1rem;
  grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
}
@media(max-width:640px){.products-grid{grid-template-columns:1fr}}

.product-card{
  background:var(--card);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:1.25rem;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.product-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--gradient-1);
  transform:scaleX(0);transition:transform 0.3s;
}
.product-card.selected{
  border-color:var(--success);
  background:var(--success-bg);
}
.product-card.selected::before{transform:scaleX(1)}
.product-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-lg);
}

.product-checkbox{
  position:absolute;top:1rem;right:1rem;
  width:28px;height:28px;
  border:2px solid var(--border);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:var(--transition);
  background:#fff;
}
.product-checkbox:hover{border-color:var(--primary)}
.product-card.selected .product-checkbox{
  background:var(--success);
  border-color:var(--success);
  color:#fff;
}

.product-image{
  width:80px;height:80px;
  border-radius:var(--radius-sm);
  object-fit:cover;
  background:var(--card-alt);
  border:1px solid var(--border);
  margin-bottom:1rem;
}
.product-image.placeholder{
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
}

.product-title{
  font-size:1.125rem;font-weight:800;
  color:var(--primary);
  margin-bottom:0.25rem;
}
.product-meta{
  font-size:0.8125rem;color:var(--text-light);
  margin-bottom:0.5rem;
}
.product-frozen{
  display:inline-block;
  padding:0.25rem 0.75rem;
  background:var(--danger-bg);
  color:var(--danger);
  border-radius:var(--pill);
  font-size:0.75rem;font-weight:800;
  margin-bottom:1rem;
}

.price-options{
  display:flex;flex-wrap:wrap;gap:0.5rem;
  margin-bottom:1rem;
}
.price-option{
  flex:1;min-width:120px;
  padding:0.75rem;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;
  cursor:pointer;
  transition:var(--transition);
  text-align:center;
}
.price-option:hover{border-color:var(--primary)}
.price-option.active{
  border-color:var(--success);
  background:var(--success-bg);
}
.price-option-label{
  display:block;font-size:0.75rem;
  font-weight:700;color:var(--text-light);
  margin-bottom:0.25rem;
}
.price-option-value{
  font-weight:800;color:var(--primary);
  font-size:1rem;
}

.product-calculation{
  background:var(--card-alt);
  border-radius:var(--radius-sm);
  padding:1rem;
  font-size:0.8125rem;
  line-height:1.6;
}
.product-calculation b{color:var(--primary)}
.product-calculation .loss{color:var(--danger);font-weight:800}
.product-calculation .gain{color:var(--success);font-weight:800}

/* Bottom Bar */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;
  z-index:40;
  padding:1rem;
  background:linear-gradient(to top, rgba(15,23,42,0.95), rgba(15,23,42,0.8));
  backdrop-filter:blur(20px);
  transform:translateY(100%);
  transition:transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.bottom-bar.show{transform:translateY(0)}
.bottom-bar-inner{
  max-width:900px;margin:0 auto;
  display:flex;align-items:center;gap:1.5rem;
}
.bottom-info{flex:1;color:#fff}
.bottom-info-label{
  display:block;font-size:0.8125rem;
  color:rgba(255,255,255,0.7);
  font-weight:600;
}
.bottom-info-value{
  font-size:2rem;font-weight:800;
  color:#10b981;
  font-variant-numeric:tabular-nums;
}
.bottom-actions{display:flex;gap:0.75rem}
.btn{
  padding:0.875rem 1.5rem;
  border:none;border-radius:var(--pill);
  font-weight:800;font-size:0.9375rem;
  cursor:pointer;
  transition:var(--transition);
  display:flex;align-items:center;gap:0.5rem;
}
.btn-secondary{
  background:rgba(255,255,255,0.1);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
}
.btn-secondary:hover{background:rgba(255,255,255,0.2)}
.btn-primary{
  background:var(--gradient-4);
  color:var(--primary);
  box-shadow:0 4px 15px -3px rgba(16,185,129,0.4);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px -3px rgba(16,185,129,0.5);
}
.btn-primary:disabled{
  opacity:0.5;cursor:not-allowed;
  transform:none;
}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(15,23,42,0.75);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:2rem;
  opacity:0;visibility:hidden;
  transition:var(--transition);
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:2rem;
  max-width:600px;width:100%;
  max-height:80vh;overflow:auto;
  transform:scale(0.95);
  transition:transform 0.3s;
  box-shadow:var(--shadow-xl);
}
.modal-overlay.show .modal{transform:scale(1)}
.modal-title{
  font-size:1.5rem;font-weight:800;
  color:var(--primary);
  margin-bottom:1rem;
}
.modal-content{
  color:var(--text);
  line-height:1.7;
  margin-bottom:1.5rem;
}
.modal-content b{color:var(--primary)}
.modal-actions{
  display:flex;gap:0.75rem;
  justify-content:flex-end;
}
.btn-dark{
  background:var(--primary);
  color:#fff;
}
.btn-outline{
  background:transparent;
  border:2px solid var(--border);
  color:var(--text);
}

/* Loading */
.loading{
  grid-column:1/-1;
  text-align:center;
  padding:4rem 2rem;
  color:var(--text-light);
  font-weight:700;
}
.loading-spinner{
  width:48px;height:48px;
  border:4px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 1rem;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){
  .header-title h1{font-size:1rem}
  .kpi-value{font-size:1.5rem}
  .donut-chart{width:220px;height:220px}
  .bottom-bar-inner{flex-direction:column;text-align:center}
  .bottom-actions{width:100%;justify-content:center}
}
</style>
</head>
<body>

<!-- PIN Screen -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-card">
    <div class="pin-logo">Ki</div>
    <h1>Análisis Pro</h1>
    <p>Ingresa tu PIN de seguridad</p>
    <input type="password" class="pin-input num" id="pinInput" maxlength="6" inputmode="numeric" autocomplete="off">
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">Ki</div>
      <div class="header-title">
        <h1>Tu Negocio <small>Dónde está tu dinero y qué tan rápido se mueve</small></h1>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-period="todo">Todo</button>
        <button class="filter-tab" data-period="12m">12 meses</button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <div class="container" id="container">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>Cargando datos...</div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-bar-inner">
      <div class="bottom-info">
        <span class="bottom-info-label" id="bottomLabel">Selecciona productos para rematar</span>
        <span class="bottom-info-value num" id="bottomValue">$0</span>
      </div>
      <div class="bottom-actions">
        <button class="btn btn-secondary" id="btnClear">Limpiar</button>
        <button class="btn btn-primary" id="btnPlan" disabled>
          <span>Ver Plan</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  
  // Config
  var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";
  
  // API
  function api(action,params,body,timeout){
    timeout=timeout||30000;
    if(!API_URL||!API_TOKEN)return Promise.reject(new Error("Falta config.js"));
    var url=new URL(API_URL),controller=new AbortController(),timer=setTimeout(function(){controller.abort();},timeout),options={redirect:"follow",signal:controller.signal};
    if(body){
      options.method="POST";
      options.headers={"Content-Type":"text/plain;charset=utf-8"};
      options.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:action},body));
    }else url.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:action},params||{})).toString();
    return fetch(url,options).then(function(r){clearTimeout(timer);if(!r.ok)throw new Error("El servidor respondió "+r.status);return r.text();})
      .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("El servidor no devolvió datos válidos");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
      .catch(function(e){clearTimeout(timer);if(e&&e.name==="AbortError")throw new Error("El servidor tardó demasiado");throw e;});
  }

  // Utils
  var $=function(id){return document.getElementById(id)};
  var num=function(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
  var mx=function(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX")};
  var a10=function(n){return Math.ceil(n/10)*10};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var norm=function(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()};
  var dias=function(d){if(!d)return"—";if(d<45)return d+" días";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años"};
  var COLORS=["#10b981","#8b5cf6","#3b82f6","#f59e0b","#ef4444","#14b8a6","#ec4899","#6366f1","#f97316","#84cc16"];

  // State
  var data=null,period="todo",selected={},PHOTOS={},MOTO=35,sortOrder="dinero",showAll=false;

  // PIN Handler
  var pinInput=$("pinInput");
  pinInput.addEventListener("input",function(){
    if(pinInput.value.length<4)return;
    var val=pinInput.value;pinInput.disabled=true;$("pinError").classList.remove("show");
    api("verificarPin",null,{pin:val}).then(function(d){
      if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
      if(d.vendedor!=="Alex")throw new Error("Esta pantalla es solo para Alex");
      $("pinScreen").classList.add("hidden");
      $("app").classList.remove("hidden");
      loadData();
    }).catch(function(e){
      var err=$("pinError");
      err.textContent=e.message;
      err.classList.add("show");
      pinInput.value="";
      pinInput.disabled=false;
      pinInput.focus();
    });
  });

  // Load Data
  function loadData(){
    var container=$("container");
    container.innerHTML='<div class="loading"><div class="loading-spinner"></div><div>Leyendo tu hoja...</div></div>';
    $("bottomBar").classList.remove("show");
    Promise.all([
      api("analisis",{rango:period},null,45000),
      api("catalogo",null,null,30000).catch(function(){return[]})
    ]).then(function(res){
      data=res[0];
      selected={};
      PHOTOS={};
      (res[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)PHOTOS[norm(x.descripcion)]=x.imagen});
      render();
    }).catch(function(e){
      container.innerHTML='<div class="loading">Error: '+esc(e.message)+"</div>";
    });
  }

  // Period Filter
  document.querySelectorAll(".filter-tab").forEach(function(tab){
    tab.addEventListener("click",function(){
      document.querySelectorAll(".filter-tab").forEach(function(t){t.classList.remove("active")});
      this.classList.add("active");
      period=this.dataset.period;
      loadData();
    });
  });

  // Get Months
  function getMonths(){
    if(period==="12m")return 12;
    var desde=data&&data.resumen&&data.resumen.desde;
    if(!desde)return 12;
    return Math.max(1,Math.round((Date.now()-Number(desde))/(30.4*864e5)));
  }

  // Get Old Products
  function getOldProducts(){
    var old=(data.viejos||[]).filter(function(x){return x.dias>180}).slice();
    old.sort(sortOrder==="dinero"?function(a,b){return b.capital-a.capital}:function(a,b){return b.dias-a.dias});
    return old;
  }

  // Cost per unit
  function costPerUnit(x){return x.piezas?x.capital/x.piezas:0}

  // Donut Chart
  function createDonut(segments,total){
    var circumference=2*Math.PI*100,offset=0;
    var arcs=segments.filter(function(s){return s.v>0}).map(function(s){
      var length=Math.max(0,(s.v/total)*circumference);
      var dasharray=length+" "+(circumference-length);
      var circle='<circle class="donut-circle" cx="140" cy="140" r="100" stroke="'+s.c+'" stroke-dasharray="'+dasharray+'" stroke-dashoffset="'+(-offset)+'"/>';
      offset+=(s.v/total)*circumference;
      return circle;
    }).join("");
    return '<div class="donut-chart"><svg class="donut-svg" viewBox="0 0 280 280"><circle class="donut-circle" cx="140" cy="140" r="100" stroke="#E2E8F0"/>'+arcs+'</svg><div class="donut-center"><div class="donut-value num">'+mx(total)+'</div><div class="donut-label">detenidos</div></div></div>';
  }

  // Render
  function render(){
    var resumen=data.resumen||{},capital=data.capital||[],rotacion=data.rotacion||[],margen=data.margen||[],viejos=getOldProducts();
    var porMes=resumen.utilidad/getMonths(),congelado=porMes>0?data.capitalTotal/porMes:0;
    var capitalViejo=viejos.reduce(function(s,x){return s+x.capital},0),pzViejo=viejos.reduce(function(s,x){return s+x.piezas},0);
    var total=data.capitalTotal||1,html="";

    // KPI Grid
    html+='<div class="kpi-grid">'+
      '<div class="kpi-card animate-fade" style="animation-delay:0.1s">'+
        '<div class="kpi-label"><div class="kpi-icon success">💰</div>Dinero detenido</div>'+
        '<div class="kpi-value num">'+mx(data.capitalTotal)+'</div>'+
        '<div class="kpi-sub">en '+data.piezasTotal+" piezas</div>"+
      "</div>"+
      '<div class="kpi-card animate-fade" style="animation-delay:0.2s">'+
        '<div class="kpi-label"><div class="kpi-icon info">📈</div>Ganas al mes</div>'+
        '<div class="kpi-value num">'+mx(porMes)+'</div>'+
        '<div class="kpi-sub">promedio de "+getMonths()+" meses</div>"+
      "</div>"+
      '<div class="kpi-card highlight animate-fade" style="animation-delay:0.3s">'+
        '<div class="kpi-label"><div class="kpi-icon purple">⏱</div>Meses congelados</div>'+
        '<div class="kpi-value num">'+(congelado?congelado.toFixed(1):"—")+'</div>'+
        '<div class="kpi-sub">de ganancia parada</div>"+
      "</div>"+
      '<div class="kpi-card animate-fade" style="animation-delay:0.4s">'+
        '<div class="kpi-label"><div class="kpi-icon warning">⚠</div>Lleva +6 meses</div>'+
        '<div class="kpi-value num">'+mx(capitalViejo)+'</div>'+
        '<div class="kpi-sub">'+pzViejo+" piezas · "+viejos.length+" productos</div>"+
      "</div>"+
    "</div>";

    // Donut Chart
    html+='<div class="card chart-container animate-fade" style="animation-delay:0.5s">'+
      '<div class="card-header"><h2 class="card-title">En qué está parado tu dinero</h2><p class="card-subtitle">Cada rebanada es una categoría. Mientras más grande, más dinero tuyo espera ahí.</p></div>'+
      createDonut(capital.map(function(x,i){return{v:x.capital,c:COLORS[i%COLORS.length]}}),total)+
      '<div class="legend">'+capital.slice(0,7).map(function(x,i){
        return '<div class="legend-item"><div class="legend-dot" style="background:'+COLORS[i%COLORS.length]+'"></div><span class="legend-text">'+esc(x.categoria)+'</span><span class="legend-value num">'+mx(x.capital)+" · "+Math.round(x.capital/total*100)+"%</span></div>";
      }).join("")+"</div>"+
      '<button class="btn btn-outline" style="width:100%;margin-top:1rem" data-exp="capital">¿Por qué importa?</button>'+
    "</div>";

    // Rotation List
    var maxD=Math.max.apply(null,rotacion.map(function(x){return Math.max(x.diasVenta,x.diasStock)}).concat([1]));
    var atoradas=rotacion.filter(function(x){return x.piezas>0&&x.ventas>=3&&x.diasStock>x.diasVenta*2});
    html+='<div class="card rotation-list animate-fade" style="animation-delay:0.6s">'+
      '<div class="card-header"><h2 class="card-title">Qué tan rápido sale cada cosa</h2><p class="card-subtitle">La barra verde es lo que tarda en venderse. La naranja/roja es lo que lleva parado hoy.</p></div>'+
      '<div class="rotation-items">'+rotacion.map(function(x){
        var mal=x.piezas&&x.ventas>=3&&x.diasStock>x.diasVenta*2;
        var claseBarra=mal?"danger":(x.diasStock>x.diasVenta*1.5?"warning":"");
        return '<div class="rotation-item">'+
          '<div class="rotation-header"><div><div class="rotation-title">'+esc(x.categoria)+'</div><div class="rotation-meta">'+x.ventas+" venta"+(x.ventas===1?"":"s")+(x.piezas?" · "+x.piezas+" en stock":"")+"</div></div></div>"+
          '<div class="rotation-bars">'+
            '<div class="rotation-bar-row"><span class="rotation-bar-label">Venta</span><div class="rotation-bar"><div class="rotation-bar-fill" style="width:0%" data-width="'+(x.diasVenta/maxD*100).toFixed(1)+'%"></div></div><span class="rotation-bar-value num">'+dias(x.diasVenta)+'</span></div>'+
            '<div class="rotation-bar-row"><span class="rotation-bar-label">Parado</span><div class="rotation-bar"><div class="rotation-bar-fill '+claseBarra+'" style="width:0%" data-width="'+(x.diasStock/maxD*100).toFixed(1)+'%"></div></div><span class="rotation-bar-value num">'+dias(x.diasStock)+'</span></div>'+
          "</div></div>";
      }).join("")+"</div>"+
      (atoradas.length?'<div class="settlement-header"><div class="settlement-alert"><div class="settlement-icon">⚠</div><div>En <b>'+atoradas.map(function(x){return esc(x.categoria)}).join("</b>, <b>")+"</b> lo que tienes lleva parado más del doble de lo que tarda en venderse.</div></div></div>":'') +
      '<button class="btn btn-outline" style="width:100%;margin-top:1rem" data-exp="rotacion">¿Cómo se lee?</button>'+
    "</div>";

    // Settlement Section
    html+='<div class="card settlement-section animate-fade" style="animation-delay:0.7s">'+
      '<div class="card-header"><h2 class="card-title">Plan de Remate</h2><p class="card-subtitle">Esto lleva más de 6 meses parado: <b>'+mx(capitalViejo)+'</b> en <b>'+pzViejo+" piezas</b>. Elige cuáles mover y a qué precio.</p></div>"+
      (viejos.length>4?'<div class="settlement-header"><div class="settlement-alert"><div class="settlement-icon">💡</div><div>Tus <b>4 productos más pesados</b> concentran <b>'+mx(viejos.slice(0,4).reduce(function(s,x){return s+x.capital},0))+'</b>. Mover esos cuatro vale más que mover los otros '+(viejos.length-4)+" juntos.</div></div></div>":"")+
      '<div class="settlement-controls">'+
        '<div class="control-group"><span class="control-label">Envío que absorbes:</span><div class="price-input">$<input type="number" id="motoInput" step="5" min="0" value="'+MOTO+'"></div></div>'+
        '<div class="sort-buttons"><button class="sort-btn active" data-sort="dinero">Dinero congelado</button><button class="sort-btn" data-sort="dias">Tiempo parado</button></div>'+
      "</div>"+
      '<div class="products-grid" id="productsGrid">'+(viejos.length?viejos.slice(0,showAll?999:12).map(function(x,i){return renderProduct(x,i)}).join(""):'<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-light)">Nada lleva más de 6 meses parado. ¡Vas bien!</div>')+"</div>"+
      (viejos.length>12&&!showAll?'<button class="btn btn-outline" id="btnShowAll" style="width:100%;margin-top:1rem">Ver los '+(viejos.length-12)+" productos restantes · "+mx(viejos.slice(12).reduce(function(s,x){return s+x.capital},0))+"</button>":"")+
      '<div style="display:flex;gap:0.75rem;margin-top:1.5rem">'+
        '<button class="btn btn-outline" data-exp="remate">¿Vender al costo es perder?</button>'+
        '<button class="btn btn-outline" data-exp="pildoras">¿De dónde salen los 3 precios?</button>'+
      "</div>"+
    "</div>";

    // Margin Section
    html+='<div class="card animate-fade" style="animation-delay:0.8s;grid-column:1/-1">'+
      '<div class="card-header"><h2 class="card-title">De dónde sale tu ganancia</h2><p class="card-subtitle">La barra muestra el margen: de cada $100 que entran por esa categoría, cuántos se quedan contigo.</p></div>'+
      '<div class="rotation-items">'+margen.map(function(x,i){
        return '<div class="rotation-item">'+
          '<div class="rotation-header"><div><div class="rotation-title">'+esc(x.categoria)+'</div><div class="rotation-meta">'+x.ventas+" venta"+(x.ventas===1?"":"s")+" · "+mx(x.porVenta)+" c/u</div></div><div style='color:var(--success);font-weight:800'>"+mx(x.utilidad)+" <span style='color:var(--text-light);font-weight:600'>"+Math.round(x.margen)+"%</span></div></div>"+
          '<div class="rotation-bar"><div class="rotation-bar-fill" style="width:0%;background:'+COLORS[i%COLORS.length]+'" data-width="'+Math.min(100,x.margen).toFixed(1)+'%"></div></div>'+
        "</div>";
      }).join("")+"</div>"+
      '<button class="btn btn-outline" style="width:100%;margin-top:1rem" data-exp="margen">¿Qué es el margen?</button>'+
    "</div>";

    $("container").innerHTML=html;
    
    // Animate bars
    setTimeout(function(){
      document.querySelectorAll(".rotation-bar-fill").forEach(function(bar){
        bar.style.width=bar.dataset.width;
      });
    },100);

    if(viejos.length)$("bottomBar").classList.add("show");
    updateTotal();
  }

  // Render Product Card
  function renderProduct(x,i){
    var cu=costPerUnit(x),img=PHOTOS[norm(x.descripcion)],isSelected=selected[i]!=null;
    var precioBase=a10(cu+MOTO),precioGana=a10(cu+MOTO+50),precioMitad=a10(x.precio/2);
    var precioSel=selected[i]||precioBase;
    var neto=(precioSel-MOTO)*x.piezas,dif=neto-x.capital,porPza=precioSel-MOTO-cu;
    return '<div class="product-card '+ (isSelected?"selected":"") +'" data-index="'+i+'">'+
      '<div class="product-checkbox" data-action="toggle">'+(isSelected?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>':"")+'</div>'+
      (img?'<img class="product-image" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.classList.add(\'placeholder\');this.innerHTML=\'📦\'">':'<div class="product-image placeholder">📦</div>')+
      '<div class="product-title">'+esc(x.descripcion)+'</div>'+
      '<div class="product-meta">'+esc(x.categoria)+" · "+x.piezas+" pza · te costó "+mx(cu)+" c/u"+'</div>'+
      '<div class="product-frozen">'+mx(x.capital)+" congelados · "+dias(x.dias)+'</div>'+
      '<div class="price-options">'+
        '<div class="price-option '+(precioSel===precioBase?"active":"")+'" data-action="price" data-value="'+precioBase+'"><span class="price-option-label">Sin perder</span><span class="price-option-value num">'+mx(precioBase)+'</span></div>'+
        '<div class="price-option '+(precioSel===precioGana?"active":"")+'" data-action="price" data-value="'+precioGana+'"><span class="price-option-label">Ganas $50</span><span class="price-option-value num">'+mx(precioGana)+'</span></div>'+
        '<div class="price-option '+(precioSel===precioMitad?"active":"")+'" data-action="price" data-value="'+precioMitad+'"><span class="price-option-label">Mitad precio</span><span class="price-option-value num">'+mx(precioMitad)+'</span></div>'+
      "</div>"+
      '<div class="product-calculation">'+ (isSelected?
        "<b>Si vendes una:</b> entra "+mx(precioSel)+", envío −"+mx(MOTO)+", te costó "+mx(cu)+" → "+
        (porPza>=0?'<span class="gain">+'+mx(porPza)+'</span>':'<span class="loss">'+mx(porPza)+'</span>')+" por pieza.<br>"+
        "<b>Si salen las "+x.piezas+":</b> recuperas <b>"+mx(neto)+"</b> de "+mx(x.capital)+" → "+
        (dif>=0?'<span class="gain">+'+mx(dif)+"</span>":'<span class="loss">−'+mx(-dif)+'</span>')
        :"Toca la palomita para incluirlo en el plan") +
      "</div></div>";
  }

  // Event Listeners
  document.addEventListener("click",function(e){
    var target=e.target;
    
    // Expand buttons
    var expBtn=target.closest("[data-exp]");
    if(expBtn){openModal(expBtn.dataset.exp);return}
    
    // Sort buttons
    var sortBtn=target.closest(".sort-btn");
    if(sortBtn){
      document.querySelectorAll(".sort-btn").forEach(function(b){b.classList.remove("active")});
      sortBtn.classList.add("active");
      sortOrder=sortBtn.dataset.sort;
      selected={};
      showAll=false;
      render();
      return;
    }
    
    // Show all
    if(target.id==="btnShowAll"){showAll=true;render();return}
    
    // Product card actions
    var card=target.closest(".product-card");
    if(card){
      var index=parseInt(card.dataset.index),viejos=getOldProducts(),x=viejos[index];
      var actionBtn=target.closest("[data-action]");
      if(!actionBtn)return;
      var action=actionBtn.dataset.action;
      if(action==="toggle"){
        if(selected[index])delete selected[index];
        else selected[index]=num(card.querySelector("[data-action=price].active")?.dataset.value||a10(costPerUnit(x)+MOTO));
      }
      if(action==="price"){
        var val=num(actionBtn.dataset.value);
        card.querySelectorAll(".price-option").forEach(function(opt){opt.classList.toggle("on",num(opt.dataset.value)===val)});
        selected[index]=val;
      }
      render();
      updateTotal();
      return;
    }
  });

  // Moto input
  document.addEventListener("input",function(e){
    if(e.target.id==="motoInput"){
      MOTO=num(e.target.value);
      render();
      updateTotal();
    }
  });

  // Update Total
  function updateTotal(){
    var viejos=getOldProducts(),libera=0,cost=0,pz=0,n=0;
    Object.keys(selected).forEach(function(i){
      var x=viejos[i];
      if(!x||!(selected[i]>0))return;
      libera+=(selected[i]-MOTO)*x.piezas;
      cost+=x.capital;
      pz+=x.piezas;
      n++;
    });
    $("bottomValue").textContent=mx(libera);
    $("bottomLabel").textContent=n?(pz+" pieza"+(pz===1?"":"s")+" de "+n+" producto"+(n===1?"":"s")+" · pagaste "+mx(cost)+" · envío descontado"):"Selecciona productos para rematar";
    $("btnPlan").disabled=!n;
  }

  // Clear button
  $("btnClear").addEventListener("click",function(){
    selected={};
    render();
    updateTotal();
  });

  // Plan button
  $("btnPlan").addEventListener("click",function(){
    var viejos=getOldProducts(),lines=[],libera=0,cost=0,pz=0;
    Object.keys(selected).forEach(function(i){
      var x=viejos[i];
      if(!x||!(selected[i]>0))return;
      libera+=(selected[i]-MOTO)*x.piezas;
      cost+=x.capital;
      pz+=x.piezas;
      lines.push("• "+x.descripcion+" — "+x.piezas+" pza · REMATE "+mx(selected[i])+" (antes "+mx(x.precio)+")");
    });
    var txt="REMATE KIOSKO\n"+pz+" piezas · recuperas "+mx(libera)+" ya con el envío descontado\n\n"+lines.join("\n");
    openModal("plan",{pz:pz,libera:libera,cost:cost,txt:txt});
  });

  // Modal Content
  var EXP={
    capital:["Capital detenido","Es el dinero que ya pagaste y sigue en cajas. No lo perdiste, pero tampoco lo tienes: no puede comprar nada nuevo hasta que se venda.<br><br>La medida que usan los negocios es cuántos <b>meses de ganancia</b> tienes congelados. Uno o dos es normal. Cinco o más significa que compraste más rápido de lo que vendes."],
    remate:["¿Vender al costo es perder?","No. Perder es que el dinero siga parado un año más.<br><br>Una pieza que compraste en $150 y no sale a $300 no vale $300: vale lo que alguien pague hoy. Si la rematas en $180 recuperas tu dinero, compras algo que sí rota y ese billete da la vuelta tres veces al año."],
    pildoras:["Los tres precios que te propongo","<b>Sin perder</b> = lo que te costó el producto más el envío. Es tu piso real.<br><br><b>Ganas $50</b> = ese piso más cincuenta pesos limpios por pieza.<br><br><b>Mitad de precio</b> = la mitad de lo que pides hoy. “50% de descuento” se entiende sin pensar y es el que más gente atrae."],
    rotacion:["Rotación","Cuántos días pasan, en promedio, desde que compras una pieza hasta que se vende.<br><br>Lo importante es compararlo contra cuánto lleva parado lo que tienes hoy. Si una categoría se vende en 90 días pero tu stock lleva 340, esas piezas concretas son las que no salen."],
    margen:["Margen","De cada $100 que entran, cuántos te quedas después de pagar el producto, el envío y el motomandado.<br><br>El margen no es la ganancia. Puedes tener margen alto y ganar poco si vendes pocas piezas."],
    plan:["Tu plan de remate","<p>Vas a mover <b>{pz} piezas</b> que llevaban meses paradas y a recuperar <b>{libera}</b> limpios, ya descontado el motomandado. Te costaron {cost}.</p>"+
      (libera<cost?"<p>Recuperas menos de lo que pagaste. <b>Eso está bien</b> si esas piezas llevan un año sin moverse: un billete dormido no vale más por esperar.</p>":"")+
      "<p><b>Véndelas en paquete.</b> El envío cuesta lo mismo lleves una pieza o tres: es por viaje. Ofrece lotes o pide que lo recojan y esa resta desaparece.</p>"+
      '<textarea readonly style="width:100%;min-height:150px;background:var(--card-alt);border:1px solid var(--border);border-radius:12px;padding:1rem;font-family:monospace;font-size:0.875rem;margin:1rem 0">{txt}</textarea>'+
      '<div style="display:flex;gap:0.75rem"><button class="btn btn-dark" id="btnCopy">Copiar lista</button><button class="btn btn-outline" data-close>Cerrar</button></div>']
  };

  function openModal(key,data){
    var modal=$("modalContent"),overlay=$("modalOverlay");
    var exp=EXP[key];
    if(!exp)return;
    var content=Array.isArray(exp)?exp[0]+": "+exp[1]:exp;
    if(key==="plan"){
      content=exp[1].replace("{pz}",data.pz).replace("{libera}",mx(data.libera)).replace("{cost}",mx(data.cost)).replace("{txt}",data.txt);
    }
    modal.innerHTML='<div class="modal-title">'+(Array.isArray(exp)?exp[0]:key)+'</div><div class="modal-content">'+(Array.isArray(exp)?exp[1]:exp)+'</div><div class="modal-actions"><button class="btn btn-dark" data-close>Entendido</button></div>';
    if(key==="plan"){
      modal.querySelector("#btnCopy").addEventListener("click",function(){
        var txt=modal.querySelector("textarea");
        txt.removeAttribute("readonly");
        txt.select();
        try{document.execCommand("copy")}catch(e){}
        txt.setAttribute("readonly","readonly");
        this.textContent="Copiado";
      });
    }
    overlay.classList.add("show");
  }

  // Close modal
  $("modalOverlay").addEventListener("click",function(e){
    if(e.target===this||e.target.closest("[data-close]")){
      this.classList.remove("show");
    }
  });

})();
</script>
</body>
</html>
