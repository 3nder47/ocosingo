<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F8">
<title>Análisis — Kiosko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F8; --card:#FFF; --card2:#F6F8FB; --linea:#E5EAF0;
  --ink:#0D1520; --gris:#66727F; --tenue:#98A3AF;
  --verde:#0E7A55; --lima:#C8F73F; --lima2:#A9E317;
  --naranja:#F97316; --rojo:#E0453F; --azul:#4F7DF3; --morado:#9B6BFF; --cyan:#19C2B0;
  --gVerde:linear-gradient(135deg,#0E7A55,#14A06E 60%,#A9E317);
  --gNaranja:linear-gradient(135deg,#F97316,#FBBF24);
  --gAzul:linear-gradient(135deg,#4F7DF3,#19C2B0);
  --gLima:linear-gradient(135deg,#C8F73F,#A9E317);
  --r:22px; --r2:16px; --pill:999px;
  --s1:0 1px 2px rgba(13,21,32,.05);
  --s2:0 2px 6px rgba(13,21,32,.05),0 12px 28px -16px rgba(13,21,32,.3);
  --s3:0 8px 18px rgba(13,21,32,.08),0 26px 50px -24px rgba(13,21,32,.45);
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:.9375rem;line-height:1.5;-webkit-font-smoothing:antialiased}
input,button{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.oculto{display:none!important}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulso{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.65}}
@keyframes brinca{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trazo{to{stroke-dashoffset:0}}
@keyframes aparece{to{opacity:1}}
.ani{animation:sube .55s var(--ease) both}

/* ---------- PIN ---------- */
.pin{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1.5rem;background:var(--bg)}
.pin-c{width:min(370px,100%);background:var(--card);border-radius:var(--r);padding:2.25rem 1.75rem;text-align:center;box-shadow:var(--s2)}
.logo{width:54px;height:54px;border-radius:17px;background:var(--gVerde);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.125rem;margin:0 auto 1.25rem;box-shadow:0 8px 20px -8px rgba(14,122,85,.7)}
.pin-c h1{font-size:1.375rem;font-weight:800;letter-spacing:-.03em}
.pin-c p{color:var(--gris);font-size:.875rem;margin:.25rem 0 1.25rem}
.pin-c input{width:100%;font-size:1.75rem;font-weight:800;letter-spacing:.42em;text-align:center;padding:.75rem;border:1.5px solid var(--linea);border-radius:var(--r2);background:var(--card2)}
.pin-c input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 4px rgba(14,122,85,.12)}
.pin-e{color:var(--rojo);font-size:.8125rem;font-weight:700;min-height:1.25rem;margin-top:.75rem}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.app{grid-template-columns:246px 1fr}}

.lado{display:none}
@media(min-width:1024px){
  .lado{display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh;padding:1.5rem 1rem;background:var(--card);border-right:1px solid var(--linea)}
}
.marca{display:flex;align-items:center;gap:.625rem;padding:0 .5rem 1.5rem}
.marca .logo{width:40px;height:40px;border-radius:13px;margin:0;font-size:.9375rem}
.marca b{font-size:1rem;font-weight:800;letter-spacing:-.02em;display:block}
.marca small{font-size:.6875rem;color:var(--tenue);font-weight:700}
.nav-t{font-size:.625rem;font-weight:800;color:var(--tenue);letter-spacing:.08em;padding:.75rem .75rem .375rem}
.nav{display:flex;align-items:center;gap:.625rem;padding:.625rem .75rem;border-radius:var(--r2);font-size:.875rem;font-weight:700;color:var(--gris);width:100%;text-align:left;transition:background .18s,color .18s}
.nav svg{width:17px;height:17px;flex:none}
.nav:hover{background:var(--card2);color:var(--ink)}
.nav.on{background:var(--ink);color:#fff}
.nav .pin-n{margin-left:auto;font-size:.6875rem;font-weight:800;color:var(--naranja)}
.nav.on .pin-n{color:var(--lima)}

.movil{display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 1rem;position:sticky;top:0;z-index:30;background:rgba(241,244,248,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}
.movil::-webkit-scrollbar{display:none}
@media(min-width:1024px){.movil{display:none}}
.movil button{white-space:nowrap;padding:.5rem .875rem;border-radius:var(--pill);background:var(--card);font-size:.8125rem;font-weight:700;color:var(--gris);box-shadow:var(--s1)}
.movil button.on{background:var(--ink);color:#fff}

.main{padding:1.25rem 1rem 9rem;max-width:1240px;width:100%}
@media(min-width:1024px){.main{padding:1.75rem 2rem 8rem}}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.cab h1{font-size:1.625rem;font-weight:800;letter-spacing:-.035em}
.cab p{color:var(--gris);font-size:.8125rem}
.rango{display:flex;gap:.2rem;background:var(--card);border-radius:var(--pill);padding:.25rem;box-shadow:var(--s1)}
.rango button{padding:.4rem .875rem;border-radius:var(--pill);font-size:.75rem;font-weight:700;color:var(--gris);transition:.18s}
.rango button.on{background:var(--ink);color:#fff}

.rej{display:grid;gap:1rem;grid-template-columns:repeat(12,1fr);align-items:start}
.c{grid-column:1/-1;background:var(--card);border-radius:var(--r);padding:1.375rem;box-shadow:var(--s2)}
@media(min-width:900px){
  .c.w4{grid-column:span 4}.c.w5{grid-column:span 5}.c.w6{grid-column:span 6}
  .c.w7{grid-column:span 7}.c.w8{grid-column:span 8}
  .c.w5,.c.w7{align-self:stretch}
  .c.w7 .rotwrap{max-height:560px;overflow-y:auto;padding-right:.35rem}
}
.tit{font-size:1.0625rem;font-weight:800;letter-spacing:-.02em}
.sub{font-size:.8125rem;color:var(--gris);line-height:1.55;margin-top:.2rem}
.sub b{color:var(--ink)}

/* ---------- tarjetas veredicto (nuevo) ---------- */
.verd{grid-column:1/-1;background:var(--card);border-radius:var(--r);padding:1.5rem;box-shadow:var(--s2);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:1rem;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
@media(min-width:900px){.verd{grid-column:span 4}}
.verd:hover{transform:translateY(-3px);box-shadow:var(--s3)}
.verd .num{position:absolute;top:1.1rem;right:1.25rem;font-size:.6875rem;font-weight:800;color:var(--tenue);letter-spacing:.12em}
.verd h2{font-size:.6875rem;font-weight:800;color:var(--tenue);letter-spacing:.1em;text-transform:uppercase}
.verd .lead{font-size:.875rem;color:var(--gris);font-weight:600;line-height:1.5}
.verd .lead b{color:var(--ink);font-weight:800}
.verd .hero-n{font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin:.1rem 0 .1rem}
.verd .hero-n small{font-size:.8125rem;font-weight:700;color:var(--gris);letter-spacing:0;display:block;margin-top:.35rem}
.verd .cta{margin-top:auto;align-self:flex-start;border-radius:var(--pill);padding:.55rem 1rem;font-size:.8125rem;font-weight:800;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:.4rem;transition:transform .2s var(--ease),box-shadow .2s}
.verd .cta:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(13,21,32,.5)}
.verd .cta.lima{background:var(--lima2);color:#12341F}
.verd .cta.lima:hover{box-shadow:0 8px 18px -6px rgba(169,227,23,.7)}
.verd .cta svg{width:14px;height:14px}
.verd.acento-verde{border-top:3px solid var(--verde)}
.verd.acento-lima{border-top:3px solid var(--lima2)}
.verd.acento-naranja{border-top:3px solid var(--naranja)}

/* lista dentro de veredicto (qué comprar) */
.vlist{display:grid;gap:.4rem;margin-top:.25rem}
.vlist .row{display:flex;align-items:center;gap:.6rem;font-size:.8125rem;font-weight:700;padding:.35rem .5rem;border-radius:10px;transition:background .18s}
.vlist .row:hover{background:var(--card2)}
.vlist .row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.vlist .row .dot.ok{background:var(--verde);animation:pulso 2.6s ease-in-out infinite}
.vlist .row .dot.bad{background:var(--naranja);animation:pulso 2.6s ease-in-out infinite .4s}
.vlist .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlist .row .mt{font-size:.6875rem;color:var(--gris);font-weight:700;font-variant-numeric:tabular-nums}
.vlist .row .arrow{font-size:.75rem;font-weight:800}
.vlist .row .arrow.up{color:var(--verde);animation:brinca 2.8s ease-in-out infinite}
.vlist .row .arrow.dn{color:var(--naranja);animation:brinca 2.8s ease-in-out infinite .3s;transform:scaleY(-1)}

/* piso real (a cuánto vender) */
.piso{background:var(--card2);border-radius:var(--r2);padding:.875rem 1rem;margin-top:.25rem}
.piso .row{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;font-size:.75rem;font-weight:700;color:var(--gris);padding:.25rem 0}
.piso .row b{font-size:1rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.piso .row b.g{color:var(--verde)}

/* hero */
.hero{grid-column:1/-1;border-radius:var(--r);padding:1.625rem;color:#fff;background:var(--gVerde);position:relative;overflow:hidden;box-shadow:0 16px 36px -20px rgba(14,122,85,.9);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.25rem}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 66%)}
.hero .lb{font-size:.75rem;font-weight:700;opacity:.8}
.hero .big{font-size:clamp(2.5rem,7vw,3.25rem);font-weight:800;letter-spacing:-.045em;line-height:1;margin:.35rem 0 .5rem}
.hero .hint{font-size:.8125rem;font-weight:600;opacity:.85;margin-top:.35rem}
.hero>div{position:relative}
.hero .pillas{display:flex;gap:.5rem;flex-wrap:wrap;position:relative}
.hp{background:rgba(255,255,255,.16);border-radius:var(--pill);padding:.4rem .75rem;font-size:.75rem;font-weight:700;backdrop-filter:blur(6px)}
.hp.lima{background:var(--lima);color:#12341F}

/* kpis */
.kpi{background:var(--card);border-radius:var(--r);padding:1.125rem;box-shadow:var(--s2);grid-column:span 6;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
@media(min-width:900px){.kpi{grid-column:span 4}}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--s3)}
.kpi .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:.625rem}
.kpi .ico svg{width:17px;height:17px}
.kpi .lb{font-size:.75rem;font-weight:700;color:var(--gris)}
.kpi b{display:block;font-size:1.625rem;font-weight:800;letter-spacing:-.035em;margin:.25rem 0 .15rem;line-height:1}
.kpi small{font-size:.6875rem;color:var(--tenue);font-weight:700}

/* chart */
.chart{position:relative;margin-top:1rem}
.chart svg{width:100%;height:190px;display:block;overflow:visible}
.chart .linea{fill:none;stroke:url(#gl);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2200;stroke-dashoffset:2200;animation:trazo 1.5s var(--ease) .2s forwards}
.chart .area{fill:url(#ga);opacity:0;animation:aparece .8s ease 1s forwards}
.chart .pt{fill:#fff;stroke:var(--verde);stroke-width:3;cursor:pointer;transition:r .18s}
.chart .pt:hover,.chart .pt.on{r:7}
.chart .ejes{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.6875rem;color:var(--tenue);font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:.4rem .65rem;font-size:.75rem;font-weight:700;white-space:nowrap;opacity:0;transform:translate(-50%,-130%);transition:opacity .15s}
.tip.on{opacity:1}

/* dona */
.dona{position:relative;width:190px;height:190px;margin:0 auto;flex:none}
.dona svg{width:100%;height:100%;transform:rotate(-90deg)}
.dona circle{fill:none;stroke-width:22;transition:stroke-dasharray 1s var(--ease)}
.dona .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dona .ctr b{font-size:1.375rem;font-weight:800;letter-spacing:-.03em;display:block}
.dona .ctr span{font-size:.6875rem;color:var(--gris);font-weight:700}
.leg{display:grid;gap:.4rem;margin-top:1rem}
.leg button{display:flex;align-items:center;gap:.625rem;padding:.5rem .625rem;border-radius:var(--r2);width:100%;text-align:left;font-size:.8125rem;font-weight:700;transition:background .18s,transform .18s}
.leg button:hover{background:var(--card2);transform:translateX(3px)}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .v{color:var(--gris);font-variant-numeric:tabular-nums}

/* rotación */
.rot{background:var(--card2);border-radius:var(--r2);padding:1rem;margin-bottom:.625rem;border:1.5px solid transparent;transition:.2s var(--ease)}
.rot:hover{background:#fff;border-color:var(--linea);box-shadow:var(--s1)}
.rot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.75rem}
.rot .hd b{font-weight:800;font-size:.9375rem}
.rot .hd small{display:block;color:var(--gris);font-size:.6875rem;font-weight:600}
.rb{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.rb .et{width:52px;font-size:.6875rem;font-weight:700;color:var(--gris);flex:none}
.rb .tr{flex:1;height:9px;border-radius:var(--pill);background:var(--linea);overflow:hidden}
.rb .fi{height:100%;border-radius:var(--pill);transform-origin:left;animation:crece 1s var(--ease) both}
.rb .vl{width:62px;text-align:right;font-size:.6875rem;font-weight:800;font-variant-numeric:tabular-nums;flex:none}

/* avisos */
.aviso{border-radius:var(--r2);padding:.875rem 1rem;font-size:.8125rem;line-height:1.55;margin-top:1rem;font-weight:600;display:flex;gap:.75rem;align-items:flex-start}
.aviso .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.aviso.warn{background:#FFF4E5;color:#8A4A08}.aviso.warn .ic{background:var(--naranja);color:#fff}.aviso.warn b{color:#C2410C}
.aviso.ok{background:#E4F6EE;color:#0B5B3E}.aviso.ok .ic{background:var(--verde);color:#fff}
.que{margin-top:1rem;border:1.5px solid var(--linea);border-radius:var(--pill);padding:.45rem .9rem;font-size:.75rem;font-weight:700;color:var(--gris);transition:.18s}
.que:hover{border-color:var(--ink);color:var(--ink)}

/* remate */
.ctrl{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;background:var(--card2);border-radius:var(--r2);padding:.875rem 1rem;margin-top:1rem;font-size:.8125rem;font-weight:700}
.ctrl small{flex-basis:100%;font-size:.6875rem;color:var(--gris);font-weight:600}
.inp{display:inline-flex;align-items:center;gap:.25rem;background:#fff;border:1.5px solid var(--linea);border-radius:var(--pill);padding:.3rem .75rem;font-weight:800}
.inp input{width:3.25rem;border:none;background:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--ink)}
.ord{display:flex;gap:.25rem;background:#fff;border-radius:var(--pill);padding:.2rem;box-shadow:var(--s1)}
.ord button{padding:.4rem .8rem;border-radius:var(--pill);font-size:.75rem;font-weight:700;color:var(--gris)}
.ord button.on{background:var(--ink);color:#fff}
.malla{display:grid;gap:.875rem;margin-top:1rem;grid-template-columns:1fr}
@media(min-width:680px){.malla{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.malla{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--card);border:2px solid var(--linea);border-radius:var(--r);padding:1rem;position:relative;transition:.22s var(--ease);display:flex;flex-direction:column;gap:.75rem}
.pc:hover{transform:translateY(-3px);box-shadow:var(--s3)}
.pc.on{border-color:var(--lima2);background:#FBFFF0}
.pc .top{display:flex;gap:.75rem;align-items:flex-start}
.pc .im{width:62px;height:62px;border-radius:var(--r2);object-fit:cover;background:var(--card2);border:1px solid var(--linea);flex:none}
.pc .im.sin{display:grid;place-items:center;color:var(--tenue)}
.pc .tx{flex:1;min-width:0}
.pc .tx b{font-size:.9375rem;font-weight:800;line-height:1.3;display:block}
.pc .tx small{color:var(--gris);font-size:.6875rem;font-weight:600}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--linea);background:#fff;display:grid;place-items:center;color:transparent;flex:none;transition:.18s}
.pc.on .chk{background:var(--ink);border-color:var(--ink);color:var(--lima)}
.tags{display:flex;gap:.375rem;flex-wrap:wrap}
.tg{border-radius:var(--pill);padding:.2rem .6rem;font-size:.6875rem;font-weight:800}
.tg.cong{background:#E4F6EE;color:var(--verde)}
.tg.dias{background:#FFF4E5;color:#C2410C}
.precios{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.po{border:1.5px solid var(--linea);border-radius:var(--r2);padding:.5rem .35rem;text-align:center;transition:.18s}
.po:hover{border-color:var(--ink)}
.po.on{border-color:var(--ink);background:var(--ink);color:#fff}
.po span{display:block;font-size:.625rem;font-weight:700;color:var(--gris);margin-bottom:.1rem}
.po.on span{color:rgba(255,255,255,.65)}
.po b{font-size:.9375rem;font-weight:800;font-variant-numeric:tabular-nums}
.libre{display:flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:700;color:var(--gris)}
.cuenta{background:var(--card2);border-radius:var(--r2);padding:.75rem .875rem;font-size:.75rem;line-height:1.6;color:var(--gris);font-weight:600}
.cuenta b{color:var(--ink);font-weight:800}
.cuenta b.mal{color:var(--rojo)}
.cuenta b.bien{color:var(--verde)}
.vermas{width:100%;border:1.5px dashed var(--linea);border-radius:var(--r2);padding:.9rem;font-size:.8125rem;font-weight:700;color:var(--gris);margin-top:1rem}
.vermas:hover{border-color:var(--ink);color:var(--ink)}

/* barra inferior */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 1rem calc(1rem + env(safe-area-inset-bottom));transform:translateY(130%);transition:transform .45s var(--ease)}
.bot.on{transform:none}
.bot-in{max-width:820px;margin:0 auto;background:var(--ink);color:#fff;border-radius:var(--r);padding:.875rem 1rem;display:flex;align-items:center;gap:1rem;box-shadow:0 18px 44px -14px rgba(13,21,32,.65)}
.bot-t{flex:1;min-width:0}
.bot-t small{display:block;font-size:.6875rem;color:rgba(255,255,255,.6);font-weight:700}
.bot-t b{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:var(--lima);font-variant-numeric:tabular-nums}
.btn{border-radius:var(--pill);padding:.7rem 1.2rem;font-size:.875rem;font-weight:800;transition:.2s var(--ease);white-space:nowrap}
.btn.pri{background:var(--lima);color:#12341F}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px rgba(169,227,23,.7)}
.btn.pri:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);transform:none;box-shadow:none;cursor:not-allowed}
.btn.gh{border:1px solid rgba(255,255,255,.22);color:#fff}
.btn.gh:hover{background:rgba(255,255,255,.1)}

/* modal */
.mo{position:fixed;inset:0;z-index:70;background:rgba(13,21,32,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:1.25rem;opacity:0;visibility:hidden;transition:.25s}
.mo.on{opacity:1;visibility:visible}
.mo-in{background:var(--card);border-radius:var(--r);padding:1.75rem;width:min(600px,100%);max-height:85vh;overflow:auto;transform:scale(.95);transition:transform .28s var(--ease);box-shadow:var(--s3)}
.mo.on .mo-in{transform:none}
.mo-in h3{font-size:1.3125rem;font-weight:800;letter-spacing:-.025em;margin-bottom:.75rem}
.mo-in p{color:var(--gris);font-size:.875rem;line-height:1.7;margin-bottom:.875rem}
.mo-in p b{color:var(--ink)}
.mo-in textarea{width:100%;min-height:160px;background:var(--card2);border:1px solid var(--linea);border-radius:var(--r2);padding:.875rem;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;white-space:pre;resize:vertical;color:var(--ink)}
.mo-in .btn.pri{background:var(--ink);color:#fff}
.mo-in .btn.gh{border-color:var(--linea);color:var(--ink)}
.cargando{grid-column:1/-1;text-align:center;padding:5rem 1rem;color:var(--gris);font-weight:700}
.spin{width:44px;height:44px;border:4px solid var(--linea);border-top-color:var(--verde);border-radius:50%;margin:0 auto 1rem;animation:gira .9s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* detalle colapsable */
.detalle{border:1.5px dashed var(--linea);border-radius:var(--r2);padding:.9rem 1rem;margin-top:1rem;background:transparent;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:1rem;font-weight:800;font-size:.875rem;color:var(--ink);transition:.2s}
.detalle:hover{border-color:var(--ink);background:var(--card2)}
.detalle span{color:var(--gris);font-weight:700;font-size:.75rem}
.detalle svg{width:16px;height:16px;transition:transform .28s var(--ease)}
.detalle.abierto svg{transform:rotate(180deg)}
.det-wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;margin-top:1rem}
.det-wrap.oculto{display:none}
.det-wrap .c{box-shadow:var(--s1)}

/* pills semáforo */
.sem{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--pill);padding:.15rem .55rem;font-size:.6875rem;font-weight:800}
.sem.ok{background:#E4F6EE;color:var(--verde)}
.sem.warn{background:#FFF4E5;color:#C2410C}
.sem .d{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulso 2.4s ease-in-out infinite}
</style>
</head>
<body>

<div class="pin" id="pin"><div class="pin-c">
  <div class="logo">Ki</div><h1>Análisis</h1><p>Tu PIN de Kiosko</p>
  <input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
  <div class="pin-e" id="pin-e"></div>
</div></div>

<div id="app" class="oculto"><div class="app">
  <aside class="lado">
    <div class="marca"><div class="logo">Ki</div><div><b>Kiosko</b><small>Ocosingo</small></div></div>
    <div class="nav-t">DECISIONES</div>
    <button class="nav on" data-ir="quecomprar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>Qué comprar</button>
    <button class="nav" data-ir="parado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/></svg>Dinero dormido</button>
    <button class="nav" data-ir="margen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>A cuánto vender</button>
    <div class="nav-t">DETALLE</div>
    <button class="nav" data-ir="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>Ventas por mes</button>
    <button class="nav" data-ir="rotacion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Rotación</button>
    <button class="nav" data-ir="remate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 8.4 12 17l-4-4"/><path d="M4 4h16v16H4z"/></svg>Plan de remate<span class="pin-n" id="nav-n"></span></button>
  </aside>

  <div>
    <div class="movil" id="movil"></div>
    <main class="main">
      <div class="cab">
        <div><h1>Tu negocio</h1><p>3 decisiones, 3 números. Nada más.</p></div>
        <div class="rango"><button id="r-todo" class="on">Todo</button><button id="r-12m">12 meses</button></div>
      </div>
      <div class="rej" id="rej"><div class="cargando"><div class="spin"></div>Leyendo tu hoja…</div></div>
    </main>
  </div>
</div></div>

<div class="bot" id="bot"><div class="bot-in">
  <div class="bot-t"><small id="bot-s">Elige qué rematar</small><b class="n" id="bot-v">$0</b></div>
  <button class="btn gh" id="b-limpiar">Limpiar</button>
  <button class="btn pri" id="b-plan" disabled>Ver plan</button>
</div></div>
<div class="mo" id="mo"><div class="mo-in" id="mo-in"></div></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";
function api(a,p,b,ms){ms=ms||30000;
  if(!API_URL||!API_TOKEN)return Promise.reject(new Error("Falta config.js"));
  var u=new URL(API_URL),c=new AbortController(),t=setTimeout(function(){c.abort();},ms),o={redirect:"follow",signal:c.signal};
  if(b){o.method="POST";o.headers={"Content-Type":"text/plain;charset=utf-8"};o.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:a},b));}
  else u.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:a},p||{})).toString();
  return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error("El servidor respondió "+r.status);return r.text();})
   .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("El servidor no devolvió datos válidos");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
   .catch(function(e){clearTimeout(t);if(e&&e.name==="AbortError")throw new Error("El servidor tardó demasiado");throw e;});}

var $=function(i){return document.getElementById(i);};
function num(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function mx(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX");}
function a10(n){return Math.ceil(n/10)*10;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function dias(d){if(!d)return"—";if(d<45)return d+" d";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años";}
function diasCorto(d){if(!d)return"—";if(d<45)return d+"d";var m=Math.round(d/30.4);return m<24?m+"m":(Math.round(d/365*10)/10)+"a";}
var PAL=["#0E7A55","#A9E317","#4F7DF3","#F97316","#9B6BFF","#19C2B0","#E0453F","#FBBF24","#EC4899","#8FA0B0"];

var D=null,MESES=[],rango="todo",sel={},FOTOS={},MOTO=35,orden="dinero",verTodo=false,seccion="quecomprar",detalleAbierto=false;

function cuenta(el,hasta,fmt){
  var t0=performance.now(),dur=900;
  (function paso(t){var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);
    el.textContent=fmt(hasta*k);if(k<1)requestAnimationFrame(paso);})(t0);
}

/* PIN */
var pi=$("pin-in");
pi.addEventListener("input",function(){
  if(pi.value.length<4)return;
  var v=pi.value;pi.disabled=true;$("pin-e").textContent="";
  api("verificarPin",null,{pin:v}).then(function(d){
    if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
    if(d.vendedor!=="Alex")throw new Error("Esta pantalla es solo para Alex");
    $("pin").classList.add("oculto");$("app").classList.remove("oculto");cargar();
  }).catch(function(e){$("pin-e").textContent=e.message;pi.value="";pi.disabled=false;pi.focus();});
});

function cargar(){
  $("rej").innerHTML='<div class="cargando"><div class="spin"></div>Leyendo tu hoja…</div>';
  $("bot").classList.remove("on");
  Promise.all([
    api("analisis",{rango:rango},null,45000),
    api("catalogo",null,null,30000).catch(function(){return[];}),
    api("inicio",{usuario:"Alex"},null,35000).catch(function(){return{};})
  ]).then(function(r){
    D=r[0];sel={};FOTOS={};detalleAbierto=false;
    (r[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)FOTOS[norm(x.descripcion)]=x.imagen;});
    MESES=(r[2]&&r[2].ventasMes)||[];
    pintar();
  }).catch(function(e){$("rej").innerHTML='<div class="cargando">'+esc(e.message)+"</div>";});
}
$("r-todo").addEventListener("click",function(){if(rango==="todo")return;rango="todo";marcaR();cargar();});
$("r-12m").addEventListener("click",function(){if(rango==="12m")return;rango="12m";marcaR();cargar();});
function marcaR(){$("r-todo").classList.toggle("on",rango==="todo");$("r-12m").classList.toggle("on",rango==="12m");}

function meses(){if(rango==="12m")return 12;var d=D&&D.resumen&&D.resumen.desde;if(!d)return 12;
  return Math.max(1,Math.round((Date.now()-Number(d))/(30.4*864e5)));}
function viejos(){var V=(D.viejos||[]).filter(function(x){return x.dias>180;}).slice();
  V.sort(orden==="dinero"?function(a,b){return b.capital-a.capital;}:function(a,b){return b.dias-a.dias;});return V;}
function costoU(x){return x.piezas?x.capital/x.piezas:0;}

/* --- gráfica de área --- */
function area(){
  if(!MESES.length)return "";
  var W=680,H=190,P={t:16,b:8,l:4,r:4};
  var vals=MESES.map(function(m){return Number(m.total)||0;});
  var max=Math.max.apply(null,vals.concat([1])),n=vals.length;
  var px=function(i){return P.l+i*((W-P.l-P.r)/Math.max(1,n-1));};
  var py=function(v){return P.t+(H-P.t-P.b)*(1-v/max);};
  var pts=vals.map(function(v,i){return [px(i),py(v)];});
  var d=pts.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+","+q[1].toFixed(1);
    var p0=pts[i-1],cx=(p0[0]+q[0])/2;
    return "C"+cx.toFixed(1)+","+p0[1].toFixed(1)+" "+cx.toFixed(1)+","+q[1].toFixed(1)+" "+q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  var ar=d+" L"+pts[n-1][0].toFixed(1)+","+H+" L"+pts[0][0].toFixed(1)+","+H+" Z";
  return '<div class="chart" id="chart"><svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7A55"/><stop offset="1" stop-color="#A9E317"/></linearGradient>'+
    '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14A06E" stop-opacity=".28"/><stop offset="1" stop-color="#14A06E" stop-opacity="0"/></linearGradient></defs>'+
    '<path class="area" d="'+ar+'"/><path class="linea" d="'+d+'"/>'+
    pts.map(function(q,i){return '<circle class="pt" data-i="'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5"/>';}).join("")+
    '</svg><div class="tip" id="tip"></div>'+
    '<div class="ejes"><span>'+esc(MESES[0].label)+"</span><span>"+esc(MESES[n-1].label)+"</span></div></div>";
}

function dona(segs,total){
  var C=2*Math.PI*78,off=0;
  var arcos=segs.filter(function(s){return s.v>0;}).map(function(s){
    var len=Math.max(0,s.v/total*C-3);
    var h='<circle cx="95" cy="95" r="78" stroke="'+s.c+'" stroke-linecap="round" stroke-dasharray="'+len.toFixed(1)+" "+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';
    off+=s.v/total*C;return h;}).join("");
  return '<div class="dona"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" stroke="#EEF2F6"/>'+arcos+
    '</svg><div class="ctr"><b class="n">'+mx(total)+"</b><span>dormido</span></div></div>";
}

var SECS=[["quecomprar","Qué comprar"],["parado","Dormido"],["margen","A cuánto"],["ventas","Ventas"],["rotacion","Rotación"],["remate","Remate"]];

function semaforo(x){
  if(!x.piezas||x.ventas<3)return "";
  var mal=x.diasStock>x.diasVenta*2;
  return '<span class="sem '+(mal?"warn":"ok")+'"><span class="d"></span>'+(mal?"fuera de rango":"en rango")+'</span>';
}

function pintar(){
  var R=D.resumen||{},cap=D.capital||[],rot=D.rotacion||[],mar=D.margen||[],V=viejos();
  var porMes=R.utilidad/meses(),cong=porMes>0?D.capitalTotal/porMes:0;
  var capV=V.reduce(function(s,x){return s+x.capital;},0),pzV=V.reduce(function(s,x){return s+x.piezas;},0);
  var T=D.capitalTotal||1,h="";

  $("movil").innerHTML=SECS.map(function(s,i){return '<button data-ir="'+s[0]+'"'+(i===0?' class="on"':"")+">"+s[1]+"</button>";}).join("");
  $("nav-n").textContent=V.length?V.length:"";

  /* ---------- ① QUÉ COMPRAR ---------- */
  var ordenadas=rot.slice().filter(function(x){return x.ventas>=2;}).sort(function(a,b){
    var ra=a.diasStock>0?a.diasVenta/a.diasStock:0;
    var rb=b.diasStock>0?b.diasVenta/b.diasStock:0;
    return rb-ra;
  });
  var suben=ordenadas.filter(function(x){return x.piezas>0&&x.diasStock<x.diasVenta*1.5;}).slice(0,3);
  var bajan=ordenadas.filter(function(x){return x.piezas>0&&x.diasStock>x.diasVenta*2;}).slice(0,3);
  if(!suben.length&&ordenadas.length)suben=ordenadas.slice(0,2);
  if(!bajan.length&&ordenadas.length)bajan=ordenadas.slice(-2).reverse();
  var sugerencia=Math.min(capV,Math.round((bajan[0]&&bajan[0].capital||0)*0.5/100)*100);

  h+='<section class="verd ani acento-verde" id="s-quecomprar">'+
    '<div class="num">①</div>'+
    '<h2>Qué comprar</h2>'+
    '<div class="lead">Esto rota y esto no. <b>Mete dinero donde sale, sácalo donde se duerme.</b></div>'+
    '<div class="vlist">'+
      suben.map(function(x){return '<div class="row"><span class="dot ok"></span><span class="nm">'+esc(x.categoria)+'</span><span class="mt">'+diasCorto(x.diasVenta)+'</span><span class="arrow up">▲</span></div>';}).join("")+
      bajan.map(function(x){return '<div class="row"><span class="dot bad"></span><span class="nm">'+esc(x.categoria)+'</span><span class="mt">'+diasCorto(x.diasStock)+'</span><span class="arrow dn">▲</span></div>';}).join("")+
    '</div>'+
    (sugerencia>0?'<div class="lead" style="font-size:.75rem">Sugerencia: mover <b>'+mx(sugerencia)+'</b> de las lentas a las rápidas.</div>':"")+
    '<button class="cta" data-ir="rotacion">Ver detalle<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'+
  '</section>';

  /* ---------- ② DINERO DORMIDO ---------- */
  h+='<section class="verd ani acento-naranja" id="s-parado" style="animation-delay:.08s">'+
    '<div class="num">②</div>'+
    '<h2>Dinero dormido</h2>'+
    '<div class="hero-n n" id="hero-dormido">$0</div>'+
    '<small style="font-size:.75rem;font-weight:700;color:var(--gris);margin-top:-.5rem;display:block">'+
      pzV+' piezas paradas más de 6 meses · te costaron '+mx(capV)+
    '</small>'+
    '<div class="lead">No lo perdiste. <b>Ya es tuyo, solo está dormido.</b>'+
      (cong?' Son <b>'+cong.toFixed(1)+' meses</b> de tu ganancia parados en cajas.':'')+
    '</div>'+
    (V.length?'<button class="cta lima" data-ir="remate">Despertar este dinero<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
            :'<div class="aviso ok" style="margin-top:0"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></span><div>Nada lleva más de 6 meses parado. Vas bien.</div></div>')+
  '</section>';

  /* ---------- ③ A CUÁNTO VENDER ---------- */
  var pisoProm=0;
  if(V.length){var ps=V.slice(0,20).map(function(x){return costoU(x)+MOTO;});pisoProm=ps.reduce(function(s,x){return s+x;},0)/ps.length;}
  h+='<section class="verd ani acento-lima" id="s-margen" style="animation-delay:.16s">'+
    '<div class="num">③</div>'+
    '<h2>A cuánto vender</h2>'+
    '<div class="hero-n n g">'+Math.round(R.margen)+'%</div>'+
    '<small style="font-size:.75rem;font-weight:700;color:var(--gris);margin-top:-.5rem;display:block">margen real general</small>'+
    '<div class="piso">'+
      '<div class="row"><span>Tu piso con envío</span><b class="g">'+(pisoProm?mx(pisoProm):"—")+'</b></div>'+
      '<div class="row"><span>Envío por pieza</span><b>'+mx(MOTO)+'</b></div>'+
    '</div>'+
    '<div class="lead" style="font-size:.75rem">Por debajo de tu piso pierdes. <b>Ya con el motomandado descontado.</b></div>'+
    '<button class="cta" data-ir="margen">Ver márgenes<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'+
  '</section>';

  /* ---------- detalle colapsable ---------- */
  h+='<button class="detalle'+(detalleAbierto?" abierto":"")+'" id="det"><div>Ver detalle completo<span> · ventas, rotación y plan de remate</span></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>';

  h+='<div class="det-wrap'+(detalleAbierto?"":" oculto")+'" id="detw">';

  /* ventas */
  if(MESES.length){
    var ult=MESES[MESES.length-1],prev=MESES.length>1?MESES[MESES.length-2]:null;
    var dif=prev?(Number(ult.total)-Number(prev.total)):0;
    h+='<section class="c ani" id="s-ventas"><h2 class="tit">Ventas de los últimos '+MESES.length+' meses</h2>'+
      '<p class="sub">Cada punto es un mes.'+(prev?" El último vendiste <b>"+mx(ult.total)+"</b>, "+(dif>=0?"<b>"+mx(dif)+" más</b>":"<b>"+mx(-dif)+" menos</b>")+" que el anterior.":"")+"</p>"+
      area()+"</section>";
  }

  /* capital */
  h+='<section class="c w5 ani" id="s-capital"><h2 class="tit">Dónde está dormido</h2>'+
    '<p class="sub">Cada rebanada es una categoría. Más grande = más dinero esperando.</p>'+
    '<div style="margin-top:1.25rem">'+dona(cap.map(function(x,i){return{v:x.capital,c:PAL[i%PAL.length]};}),T)+"</div>"+
    '<div class="leg">'+cap.slice(0,7).map(function(x,i){
      return '<button><i style="background:'+PAL[i%PAL.length]+'"></i><span class="t">'+esc(x.categoria)+'</span><span class="v">'+mx(x.capital)+" · "+Math.round(x.capital/T*100)+"%</span></button>";}).join("")+"</div>"+
    '<button class="que" data-exp="capital">¿Por qué importa? ›</button></section>';

  /* rotación */
  var maxD=Math.max.apply(null,rot.map(function(x){return Math.max(x.diasVenta,x.diasStock);}).concat([1]));
  var ator=rot.filter(function(x){return x.piezas>0&&x.ventas>=3&&x.diasStock>x.diasVenta*2;});
  h+='<section class="c w7 ani" id="s-rotacion"><h2 class="tit">Qué se mueve y qué no</h2>'+
    '<p class="sub">Verde: <b>tarda en venderse</b>. Naranja: <b>lleva parado hoy</b>. Si la naranja pasa del doble, fuera de rango.</p>'+
    '<div class="rotwrap" style="margin-top:1rem">'+rot.map(function(x){
      var mal=x.piezas&&x.ventas>=3&&x.diasStock>x.diasVenta*2;
      return '<div class="rot"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" venta"+(x.ventas===1?"":"s")+(x.piezas?" · "+x.piezas+" en stock":"")+"</small></div>"+semaforo(x)+"</div>"+
        '<div class="rb"><span class="et">Venta</span><div class="tr"><i class="fi" style="width:'+Math.max(3,x.diasVenta/maxD*100).toFixed(1)+'%;background:linear-gradient(90deg,#0E7A55,#A9E317)"></i></div><span class="vl">'+dias(x.diasVenta)+"</span></div>"+
        '<div class="rb"><span class="et">Parado</span><div class="tr"><i class="fi" style="width:'+Math.max(3,x.diasStock/maxD*100).toFixed(1)+'%;background:'+(mal?"linear-gradient(90deg,#E0453F,#F97316)":"var(--gNaranja)")+'"></i></div><span class="vl">'+dias(x.diasStock)+"</span></div></div>";
    }).join("")+"</div>"+
    (ator.length?'<div class="aviso warn"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div>En <b>'+ator.map(function(x){return esc(x.categoria);}).join("</b>, <b>")+"</b> lo que te queda lleva parado más del doble de lo que tarda en venderse. La categoría no es lenta: son <b>esas piezas</b> las que no salen.</div></div>":'<div class="aviso ok"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></span><div>Nada se está atorando: tu stock está dentro de sus tiempos normales.</div></div>')+
    '<button class="que" data-exp="rotacion">¿Cómo se lee? ›</button></section>';

  /* margen detalle */
  h+='<section class="c ani" id="s-margen-det"><h2 class="tit">De dónde sale tu ganancia</h2>'+
    '<p class="sub">La barra más larga es la que mejor te paga. El porcentaje dice, de cada $100 que entran, cuántos se quedan contigo.</p>'+
    '<div style="margin-top:1rem">'+(function(){var mm=Math.max.apply(null,mar.map(function(y){return y.margen;}).concat([1]));return mar.map(function(x,i){
      return '<div class="rot"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" venta"+(x.ventas===1?"":"s")+" · "+mx(x.porVenta)+' c/u</small></div><div style="text-align:right"><b style="color:var(--verde)">'+mx(x.utilidad)+'</b><small>'+Math.round(x.margen)+"% margen</small></div></div>"+
        '<div class="rb"><div class="tr"><i class="fi" style="width:'+Math.max(6,x.margen/mm*100).toFixed(1)+'%;background:'+PAL[i%PAL.length]+'"></i></div></div></div>';}).join("");})()+"</div>"+
    '<button class="que" data-exp="margen">¿Qué es el margen? ›</button></section>';

  /* remate */
  h+='<section class="c ani" id="s-remate"><h2 class="tit">Plan de remate</h2>'+
    '<p class="sub">Lleva más de 6 meses parado: <b>'+mx(capV)+"</b> en <b>"+pzV+" piezas</b>. Elige cuáles mover y a qué precio.</p>"+
    (V.length>4?'<div class="aviso warn"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span><div>Tus <b>4 productos más pesados</b> ('+esc(V.slice(0,4).map(function(x){return x.descripcion;}).join(", "))+") concentran <b>"+mx(V.slice(0,4).reduce(function(s,x){return s+x.capital;},0))+"</b>. Mover esos cuatro vale más que mover los otros "+(V.length-4)+" juntos.</div></div>":"")+
    '<div class="ctrl"><span>Envío que absorbes por pieza</span><span class="inp">$<input id="moto" type="number" step="5" min="0" value="'+MOTO+'"></span>'+
    '<span style="margin-left:auto"></span><div class="ord"><button data-ord="dinero"'+(orden==="dinero"?' class="on"':"")+'>Dinero</button><button data-ord="dias"'+(orden==="dias"?' class="on"':"")+'>Antigüedad</button></div>'+
    '<small>El motomandado sale de tu bolsa en casi todas tus entregas. Ya está descontado en cada cuenta.</small></div>'+
    '<div class="malla" id="malla">'+(V.length?V.slice(0,verTodo?999:12).map(pcHTML).join(""):'<div class="aviso ok" style="grid-column:1/-1"><span class="ic"></span><div>Nada lleva más de 6 meses parado. Vas bien.</div></div>')+"</div>"+
    (V.length>12&&!verTodo?'<button class="vermas" id="vermas">Ver los '+(V.length-12)+" productos restantes · entre todos suman "+mx(V.slice(12).reduce(function(s,x){return s+x.capital;},0))+"</button>":"")+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="que" data-exp="remate">¿Vender al costo es perder? ›</button>'+
    '<button class="que" data-exp="pildoras">¿De dónde salen los 3 precios? ›</button>'+
    '<button class="que" data-exp="envio">¿Por qué descuento el envío? ›</button></div></section>';

  h+='</div>'; /* fin det-wrap */

  $("rej").innerHTML=h;
  cuenta($("hero-dormido"),capV,mx);
  cablearChart();espiar();total();cablearDetalle();
}

function cablearDetalle(){
  var b=$("det");if(!b)return;
  b.addEventListener("click",function(){
    detalleAbierto=!detalleAbierto;
    b.classList.toggle("abierto",detalleAbierto);
    $("detw").classList.toggle("oculto",!detalleAbierto);
    if(detalleAbierto)setTimeout(function(){cablearChart();espiar();},50);
  });
}

function pcHTML(x,i){
  var cu=costoU(x),img=FOTOS[norm(x.descripcion)];
  return '<article class="pc" data-i="'+i+'">'+
    '<div class="top">'+
      (img?'<img class="im" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'<span class="im sin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.4"/><path d="m21 15-5-5L5 19"/></svg></span>')+
      '<div class="tx"><b>'+esc(x.descripcion)+"</b><small>"+esc(x.categoria)+" · "+x.piezas+" pza · te costó "+mx(cu)+" c/u</small></div>"+
      '<button class="chk" data-act="tog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></button>'+
    "</div>"+
    '<div class="tags"><span class="tg cong">'+mx(x.capital)+' congelados</span><span class="tg dias">'+dias(x.dias)+"</span></div>"+
    (function(){var op=[["Sin perder",a10(cu+MOTO)],["Ganas $50",a10(cu+MOTO+50)],["Mitad",a10(x.precio/2)]],vis={},u=[];
      op.forEach(function(o){if(vis[o[1]])return;vis[o[1]]=1;u.push(o);});
      return '<div class="precios" style="grid-template-columns:repeat('+u.length+',1fr)">'+u.map(function(o){
        return '<button class="po" data-act="p" data-v="'+o[1]+'"><span>'+o[0]+'</span><b class="n">'+mx(o[1])+"</b></button>";}).join("")+"</div>";})()+
    '<div class="libre">o pon tu precio <span class="inp">$<input data-act="in" type="number" step="10" min="0" value="'+a10(cu+MOTO)+'"></span></div>'+
    '<div class="cuenta" data-f="1">Marca esta pieza para incluirla en el plan</div></article>';
}

function render(card,i,x){
  if(!x)return;
  var on=sel[i]!=null&&sel[i]>0;card.classList.toggle("on",on);
  var p=num(card.querySelector("[data-act=in]").value),cu=costoU(x);
  card.querySelectorAll(".po").forEach(function(o){o.classList.toggle("on",num(o.getAttribute("data-v"))===p);});
  var neto=(p-MOTO)*x.piezas,dif=neto-x.capital,porPza=p-MOTO-cu;
  card.querySelector("[data-f]").innerHTML=on
    ? "<b>Una sola:</b> entra "+mx(p)+" − envío "+mx(MOTO)+" − costo "+mx(cu)+" = "+
      (porPza>=0?'<b class="bien">+'+mx(porPza)+"</b>":'<b class="mal">'+mx(porPza)+"</b>")+" por pieza.<br>"+
      "<b>Las "+x.piezas+":</b> recuperas <b>"+mx(neto)+"</b> de "+mx(x.capital)+" · "+
      (dif>=0?'<b class="bien">+'+mx(dif)+"</b>":'te faltan <b class="mal">'+mx(-dif)+"</b>")
    : "Marca esta pieza para incluirla en el plan";
}

function verBarra(){
  var hay=Object.keys(sel).some(function(i){return sel[i]>0;});
  $("bot").classList.toggle("on",hay||seccion==="remate");
}
function total(){
  var V=viejos(),lib=0,cost=0,pz=0,n=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;n++;});
  $("bot-v").textContent=mx(lib);
  $("bot-s").textContent=n?(pz+" pieza"+(pz===1?"":"s")+" de "+n+" producto"+(n===1?"":"s")+" · pagaste "+mx(cost)+" · envío descontado"):"Elige qué rematar";
  $("b-plan").disabled=!n;
  verBarra();
}

function cablearChart(){
  var ch=$("chart");if(!ch||ch.dataset.listoch)return;ch.dataset.listoch="1";
  ch.addEventListener("mouseover",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    var m=MESES[Number(p.getAttribute("data-i"))];if(!m)return;
    var tip=$("tip"),r=ch.getBoundingClientRect(),pr=p.getBoundingClientRect();
    tip.textContent=m.label+" · "+mx(m.total)+(m.cantidad?" · "+m.cantidad+" pzas":"");
    tip.style.left=(pr.left-r.left+pr.width/2)+"px";tip.style.top=(pr.top-r.top)+"px";
    tip.classList.add("on");p.classList.add("on");
  });
  ch.addEventListener("mouseout",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    $("tip").classList.remove("on");p.classList.remove("on");
  });
}

function espiar(){
  var ids=SECS.map(function(s){return "s-"+s[0];}).filter(function(id){return $(id);});
  var obs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var id=en.target.id.replace("s-","");
      if(id===seccion)return;seccion=id;
      document.querySelectorAll("[data-ir]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-ir")===id);});
      verBarra();
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  ids.forEach(function(id){var el=$(id);if(el)obs.observe(el);});
}

document.addEventListener("click",function(e){
  var ir=e.target.closest("[data-ir]");
  if(ir){var el=$("s-"+ir.getAttribute("data-ir"));
    if(!el&&ir.getAttribute("data-ir")==="remate"){detalleAbierto=true;$("detw").classList.remove("oculto");$("det").classList.add("abierto");el=$("s-remate");}
    if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
  var ex=e.target.closest("[data-exp]");if(ex){abrir(ex.getAttribute("data-exp"));return;}
  var od=e.target.closest("[data-ord]");if(od){orden=od.getAttribute("data-ord");sel={};verTodo=false;pintar();return;}
  if(e.target.closest("#vermas")){verTodo=true;pintar();return;}
  var card=e.target.closest(".pc");if(!card)return;
  var b=e.target.closest("[data-act]");if(!b)return;
  var i=card.getAttribute("data-i"),x=viejos()[i],act=b.getAttribute("data-act");
  if(act==="tog"){if(sel[i])delete sel[i];else sel[i]=num(card.querySelector("[data-act=in]").value)||a10(costoU(x)+MOTO);}
  if(act==="p"){var v=num(b.getAttribute("data-v"));card.querySelector("[data-act=in]").value=v;sel[i]=v;}
  render(card,i,x);total();
});
document.addEventListener("input",function(e){
  if(e.target.id==="moto"){MOTO=num(e.target.value);
    document.querySelectorAll(".pc").forEach(function(c){render(c,c.getAttribute("data-i"),viejos()[c.getAttribute("data-i")]);});total();return;}
  var b=e.target.closest("[data-act=in]");if(!b)return;
  var card=b.closest(".pc"),i=card.getAttribute("data-i");
  sel[i]=num(b.value);render(card,i,viejos()[i]);total();
});
$("b-limpiar").addEventListener("click",function(){
  sel={};document.querySelectorAll(".pc").forEach(function(c){c.classList.remove("on");
    c.querySelector("[data-f]").textContent="Marca esta pieza para incluirla en el plan";
    c.querySelectorAll(".po").forEach(function(o){o.classList.remove("on");});});
  total();});

$("b-plan").addEventListener("click",function(){
  var V=viejos(),lin=[],lib=0,cost=0,pz=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
    lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;
    lin.push("• "+x.descripcion+" — "+x.piezas+" pza · REMATE "+mx(sel[i])+" (antes "+mx(x.precio)+")");});
  var txt="REMATE KIOSKO\n"+pz+" piezas · recuperas "+mx(lib)+" ya con el envío descontado\n\n"+lin.join("\n");
  abrirHTML("<h3>Tu plan de remate</h3>"+
    "<p>Vas a mover <b>"+pz+" piezas</b> que llevaban meses paradas y a recuperar <b>"+mx(lib)+"</b> limpios, ya descontado el motomandado de "+mx(MOTO)+" por pieza. Te costaron "+mx(cost)+".</p>"+
    (lib<cost?"<p>Recuperas menos de lo que pagaste. <b>Eso está bien</b> si esas piezas llevan un año sin moverse: un billete dormido no vale más por esperar.</p>":"")+
    "<p><b>Véndelas en paquete.</b> El envío cuesta lo mismo lleves una pieza o tres: es por viaje. Ofrece lotes o pide que lo recojan y esa resta desaparece.</p>"+
    '<textarea readonly id="plan-txt">'+esc(txt)+"</textarea>"+
    '<div style="display:flex;gap:.5rem;margin-top:.875rem"><button class="btn pri" id="cp">Copiar lista</button><button class="btn gh" data-cerrar="1">Cerrar</button></div>');
  $("cp").addEventListener("click",function(){var t=$("plan-txt");t.removeAttribute("readonly");t.select();
    try{document.execCommand("copy");}catch(e){}t.setAttribute("readonly","readonly");this.textContent="Copiado";});
});

var EXP={
  capital:["Capital detenido","Es el dinero que ya pagaste y sigue en cajas. No lo perdiste, pero tampoco lo tienes: no puede comprar nada nuevo hasta que se venda.<br><br>La medida que usan los negocios es cuántos <b>meses de ganancia</b> tienes congelados. Uno o dos es normal. Cinco o más significa que compraste más rápido de lo que vendes, o compraste cosas que no salen."],
  remate:["¿Vender al costo es perder?","No. Perder es que el dinero siga parado un año más.<br><br>Una pieza que compraste en $150 y no sale a $300 no vale $300: vale lo que alguien pague hoy. Si la rematas en $180 recuperas tu dinero, compras algo que sí rota y ese billete da la vuelta tres veces al año.<br><br>El error clásico del que empieza es aferrarse al precio que <b>quería</b> ganar. El que lleva años mira el calendario, no el precio."],
  pildoras:["Los tres precios que te propongo","<b>Sin perder</b> = lo que te costó el producto más el envío. Es tu piso real: por debajo de ahí estás pagando por regalar mercancía.<br><br><b>Ganas $50</b> = ese piso más cincuenta pesos limpios por pieza.<br><br><b>Mitad de precio</b> = la mitad de lo que pides hoy. “50% de descuento” se entiende sin pensar y es el que más gente atrae."],
  envio:["El envío te está costando más de lo que crees","Revisé tus 461 ventas. <b>225 se entregaron a domicilio</b> —la mitad— y en ellas pagaste <b>$10,485</b> de motomandado.<br><br>Cobraste el extra al cliente en <b>30 de esas 225 entregas</b>: el 13%. Recuperaste $330 de $10,485. <b>Absorbiste $10,155.</b><br><br>Además el moto no siempre cuesta $35: hay 16 entregas de $100 y 10 de $80. Tu promedio real por entrega es de <b>$47</b>.<br><br>Por eso aquí el envío se descuenta completo. Si empiezas a cobrarlo siempre, este número mejora solo."],
  rotacion:["Rotación","Cuántos días pasan, en promedio, desde que compras una pieza hasta que se vende.<br><br>Lo importante no es el número solo: es compararlo contra <b>cuánto lleva parado lo que tienes hoy</b>. Si una categoría se vende en 90 días pero tu stock lleva 340, esas piezas concretas son las que no salen."],
  margen:["Margen","De cada $100 que entran, cuántos te quedas después de pagar el producto, el envío y el motomandado.<br><br>El margen no es la ganancia. Puedes tener margen alto y ganar poco si vendes pocas piezas."]
};
function abrir(k){var e=EXP[k];if(!e)return;abrirHTML("<h3>"+e[0]+"</h3><p>"+e[1]+'</p><button class="btn pri" data-cerrar="1">Entendido</button>');}
function abrirHTML(html){$("mo-in").innerHTML=html;$("mo").classList.add("on");}
$("mo").addEventListener("click",function(e){if(e.target===this||e.target.closest("[data-cerrar]"))this.classList.remove("on");});
})();
</script>
</body>
</html>
