<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F172A">
<title>Análisis Estratégico — Kiosko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8FAFC;
  --card: rgba(255, 255, 255, 0.85);
  --card-solid: #FFFFFF;
  --linea: #E2E8F0;
  --ink: #0F172A;
  --gris: #64748B;
  --tenue: #94A3B8;
  
  --verde: #10B981;
  --verde-bg: #D1FAE5;
  --lima: #84CC16;
  --naranja: #F97316;
  --naranja-bg: #FFEDD5;
  --rojo: #EF4444;
  --rojo-bg: #FEE2E2;
  --azul: #3B82F6;
  --azul-bg: #DBEAFE;
  --morado: #8B5CF6;
  
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
  --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.15);
  
  --r: 20px;
  --r2: 14px;
  --pill: 999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  font-size: 0.9375rem;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

input, button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.oculto { display: none !important; }

/* ---------- ANIMACIONES ---------- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.ani { animation: fadeUp 0.6s var(--ease) both; }

/* ---------- PIN SCREEN ---------- */
.pin {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center; padding: 1.5rem;
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
}
.pin-c {
  width: min(380px, 100%);
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--r);
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
.logo-icon {
  width: 64px; height: 64px; border-radius: 18px;
  background: linear-gradient(135deg, var(--verde), var(--lima));
  color: #fff; display: grid; place-items: center;
  font-weight: 800; font-size: 1.5rem; margin: 0 auto 1.5rem;
  box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
}
.pin-c h1 { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; }
.pin-c p { color: var(--tenue); font-size: 0.875rem; margin: 0.5rem 0 1.75rem; }
.pin-c input {
  width: 100%; font-size: 2.25rem; font-weight: 800; letter-spacing: 0.5em;
  text-align: center; padding: 1rem;
  border: 2px solid rgba(255, 255, 255, 0.1); border-radius: var(--r2);
  background: rgba(0, 0, 0, 0.2); color: #fff;
  transition: all 0.2s var(--ease);
}
.pin-c input:focus { outline: none; border-color: var(--verde); background: rgba(0, 0, 0, 0.3); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
.pin-c input.shake { animation: shake 0.4s var(--ease); border-color: var(--rojo); }
.pin-e { color: var(--rojo); font-size: 0.8125rem; font-weight: 700; min-height: 1.25rem; margin-top: 1rem; opacity: 0; transition: opacity 0.2s; }
.pin-e.show { opacity: 1; }

/* ---------- LAYOUT ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
@media(min-width: 1024px) { .app { grid-template-columns: 280px 1fr; } }

/* SIDEBAR */
.lado { display: none; }
@media(min-width: 1024px) {
  .lado {
    display: flex; flex-direction: column; gap: 0.5rem;
    position: sticky; top: 0; height: 100vh; padding: 2rem 1.5rem;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid var(--linea);
  }
}
.marca { display: flex; align-items: center; gap: 0.875rem; padding: 0 0.5rem 2rem; }
.marca .logo-icon { width: 44px; height: 44px; border-radius: 12px; margin: 0; font-size: 1rem; }
.marca b { font-size: 1.125rem; font-weight: 800; display: block; letter-spacing: -0.02em; color: var(--ink); }
.marca small { font-size: 0.7rem; color: var(--gris); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

.nav-t { font-size: 0.65rem; font-weight: 800; color: var(--tenue); letter-spacing: 0.1em; padding: 1.5rem 0.75rem 0.5rem; }
.nav {
  display: flex; align-items: center; gap: 0.875rem; padding: 0.875rem 1rem;
  border-radius: var(--r2); font-size: 0.875rem; font-weight: 700; color: var(--gris);
  width: 100%; text-align: left; transition: all 0.2s var(--ease);
}
.nav svg { width: 18px; height: 18px; flex: none; stroke-width: 2.2; }
.nav:hover { background: rgba(255, 255, 255, 0.8); color: var(--ink); transform: translateX(4px); }
.nav.on { background: var(--ink); color: #fff; box-shadow: var(--shadow-lg); }
.nav .badge { margin-left: auto; font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: var(--pill); background: var(--naranja-bg); color: var(--naranja); }
.nav.on .badge { background: rgba(255,255,255,0.2); color: #fff; }

/* MOBILE NAV */
.movil {
  display: flex; gap: 0.5rem; overflow-x: auto; padding: 1rem; position: sticky; top: 0; z-index: 30;
  background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linea); scrollbar-width: none;
}
.movil::-webkit-scrollbar { display: none; }
@media(min-width: 1024px) { .movil { display: none; } }
.movil button {
  white-space: nowrap; padding: 0.6rem 1.25rem; border-radius: var(--pill);
  background: var(--card-solid); font-size: 0.8125rem; font-weight: 700; color: var(--gris);
  box-shadow: var(--shadow-sm); border: 1px solid var(--linea); transition: 0.2s;
}
.movil button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* MAIN */
.main { padding: 1.5rem 1rem 10rem; max-width: 1200px; width: 100%; margin: 0 auto; }
@media(min-width: 1024px) { .main { padding: 2.5rem 2rem 10rem; } }

.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
.cab h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.035em; color: var(--ink); }
.cab p { color: var(--gris); font-size: 0.9rem; margin-top: 0.25rem; }

.rango { display: flex; gap: 0.25rem; background: var(--card-solid); padding: 0.25rem; border-radius: var(--pill); box-shadow: var(--shadow-sm); border: 1px solid var(--linea); }
.rango button { padding: 0.5rem 1rem; border-radius: var(--pill); font-size: 0.8rem; font-weight: 700; color: var(--gris); transition: 0.2s; }
.rango button.on { background: var(--ink); color: #fff; box-shadow: var(--shadow); }

/* BENTO GRID */
.bento { display: grid; gap: 1.25rem; grid-template-columns: repeat(12, 1fr); }
.b-card {
  grid-column: 1 / -1;
  background: var(--card);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--r);
  padding: 1.75rem;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.b-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

.tit { font-size: 1.125rem; font-weight: 800; letter-spacing: -0.025em; display: flex; align-items: center; gap: 0.625rem; color: var(--ink); }
.sub { font-size: 0.875rem; color: var(--gris); line-height: 1.6; margin-top: 0.375rem; }
.sub b { color: var(--ink); }

@media(min-width: 900px) {
  .b-card.w4 { grid-column: span 4; }
  .b-card.w5 { grid-column: span 5; }
  .b-card.w6 { grid-column: span 6; }
  .b-card.w7 { grid-column: span 7; }
  .b-card.w8 { grid-column: span 8; }
}

/* DECISION TAGS */
.decision-tag {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.375rem 0.875rem; border-radius: var(--pill);
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem;
}
.d1 { background: var(--azul-bg); color: var(--azul); }
.d2 { background: var(--naranja-bg); color: var(--naranja); }
.d3 { background: var(--verde-bg); color: var(--verde); }

/* HERO */
.hero-bento {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
  color: #fff; position: relative; border-radius: var(--r);
  padding: 2.5rem 2rem; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.4);
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem;
}
.hero-bento::before {
  content: ""; position: absolute; right: -50px; top: -50px; width: 300px; height: 300px;
  border-radius: 50%; background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
  filter: blur(40px); pointer-events: none;
}
.hero-bento > div { position: relative; z-index: 2; }
.hero-bento .lb { font-size: 0.8rem; font-weight: 700; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 0.05em; }
.hero-bento .big { font-size: clamp(2.5rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 0.5rem 0 0.75rem; background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.pillas { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.hp { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--pill); padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 700; backdrop-filter: blur(10px); }
.hp.lima { background: var(--lima); color: #0F172A; border: none; font-weight: 800; }

/* KPIs */
.kpi-card {
  background: var(--card-solid); border: 1px solid var(--linea); border-radius: var(--r);
  padding: 1.5rem; box-shadow: var(--shadow-sm); grid-column: span 6;
  transition: all 0.25s var(--ease); display: flex; flex-direction: column; justify-content: space-between;
}
@media(min-width: 900px) { .kpi-card { grid-column: span 4; } }
.kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: transparent; }
.kpi-card .ico {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 1rem;
}
.kpi-card .ico svg { width: 22px; height: 22px; }
.kpi-card .lb { font-size: 0.75rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-card b { display: block; font-size: 1.625rem; font-weight: 800; letter-spacing: -0.035em; margin: 0.25rem 0 0.25rem; line-height: 1.1; }
.kpi-card small { font-size: 0.75rem; color: var(--tenue); font-weight: 600; }

/* CHARTS */
.chart-container { position: relative; margin-top: 1.5rem; }
.chart-container svg { width: 100%; height: 220px; display: block; overflow: visible; }
.chart-container .linea { fill: none; stroke: url(#gl); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: drawLine 1.5s var(--ease) 0.3s forwards; }
.chart-container .area { fill: url(#ga); opacity: 0; animation: fadeUp 0.8s ease 0.8s forwards; }
.chart-container .pt { fill: #fff; stroke: var(--verde); stroke-width: 3; cursor: pointer; transition: all 0.2s var(--ease); }
.chart-container .pt:hover, .chart-container .pt.on { r: 6; fill: var(--lima); stroke: var(--ink); }
.chart-container .ejes { display: flex; justify-content: space-between; margin-top: 0.75rem; font-size: 0.725rem; color: var(--tenue); font-weight: 700; }

.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 10px; padding: 0.5rem 0.875rem; font-size: 0.775rem; font-weight: 700; white-space: nowrap; opacity: 0; transform: translate(-50%, -140%); transition: opacity 0.2s, transform 0.2s; box-shadow: var(--shadow-lg); z-index: 10; }
.tip.on { opacity: 1; transform: translate(-50%, -125%); }

.dona-wrapper { position: relative; width: 200px; height: 200px; margin: 1rem auto; flex: none; }
.dona-wrapper svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dona-wrapper circle { fill: none; stroke-width: 22; transition: stroke-dasharray 1s var(--ease); }
.dona-wrapper .ctr { position: absolute; inset: 0; display: flex; flex-direction: column; place-content: center; text-align: center; }
.dona-wrapper .ctr b { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; display: block; line-height: 1.1; }
.dona-wrapper .ctr span { font-size: 0.7rem; color: var(--gris); font-weight: 700; text-transform: uppercase; margin-top: 4px; }

.legenda { display: grid; gap: 0.5rem; margin-top: 1.5rem; }
.legenda button { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--r2); background: rgba(255,255,255,0.5); border: 1px solid transparent; width: 100%; text-align: left; font-size: 0.825rem; font-weight: 700; transition: all 0.2s var(--ease); }
.legenda button:hover { background: #fff; border-color: var(--linea); transform: translateX(4px); box-shadow: var(--shadow-sm); }
.legenda i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legenda .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legenda .v { color: var(--gris); }

/* ROTACIÓN ITEMS */
.rot-item { background: rgba(255, 255, 255, 0.6); border-radius: var(--r2); padding: 1.25rem; margin-bottom: 0.875rem; border: 1px solid var(--linea); transition: all 0.2s var(--ease); }
.rot-item:hover { background: #fff; box-shadow: var(--shadow); border-color: transparent; }
.rot-item .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.875rem; }
.rot-item .hd b { font-weight: 800; font-size: 0.95rem; }
.rot-item .hd small { display: block; color: var(--gris); font-size: 0.725rem; font-weight: 600; margin-top: 2px; }
.rb { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
.rb .et { width: 60px; font-size: 0.725rem; font-weight: 700; color: var(--gris); flex: none; }
.rb .tr { flex: 1; height: 8px; border-radius: var(--pill); background: #E2E8F0; overflow: hidden; }
.rb .fi { height: 100%; border-radius: var(--pill); transform-origin: left; animation: fillBar 1s var(--ease) both; }
.rb .vl { width: 70px; text-align: right; font-size: 0.75rem; font-weight: 800; flex: none; }

/* AVISOS */
.aviso { border-radius: var(--r2); padding: 1rem 1.25rem; font-size: 0.825rem; line-height: 1.55; margin-top: 1.25rem; font-weight: 600; display: flex; gap: 0.875rem; align-items: flex-start; }
.aviso .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.aviso.warn { background: var(--naranja-bg); color: #9A3412; border: 1px solid #FFEDD5; } .aviso.warn .ic { background: var(--naranja); color: #fff; }
.aviso.ok { background: var(--verde-bg); color: #065F46; border: 1px solid #A7F3D0; } .aviso.ok .ic { background: var(--verde); color: #fff; }

.btn-help { margin-top: 1rem; border: 1px solid var(--linea); border-radius: var(--pill); padding: 0.5rem 1rem; font-size: 0.775rem; font-weight: 700; color: var(--gris); background: rgba(255,255,255,0.6); transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
.btn-help:hover { border-color: var(--ink); color: var(--ink); background: #fff; transform: translateY(-1px); box-shadow: var(--shadow-sm); }

/* PLAN DE REMATE */
.ctrl-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; background: var(--card-solid); border-radius: var(--r2); padding: 1rem 1.25rem; margin-top: 1.25rem; font-size: 0.825rem; font-weight: 700; border: 1px solid var(--linea); box-shadow: var(--shadow-sm); }
.ctrl-bar small { flex-basis: 100%; font-size: 0.725rem; color: var(--gris); font-weight: 600; margin-top: 0.25rem; }
.inp-pill { display: inline-flex; align-items: center; gap: 0.25rem; background: var(--bg); border: 1px solid var(--linea); border-radius: var(--pill); padding: 0.375rem 0.875rem; font-weight: 800; }
.inp-pill input { width: 3.5rem; border: none; background: none; text-align: right; font-weight: 800; }
.inp-pill input:focus { outline: none; }

.ord-pill { display: flex; gap: 0.25rem; background: var(--bg); border-radius: var(--pill); padding: 0.25rem; border: 1px solid var(--linea); margin-left: auto; }
.ord-pill button { padding: 0.45rem 0.9rem; border-radius: var(--pill); font-size: 0.75rem; font-weight: 700; color: var(--gris); transition: 0.2s; }
.ord-pill button.on { background: var(--ink); color: #fff; box-shadow: var(--shadow-sm); }

.product-grid { display: grid; gap: 1rem; margin-top: 1.25rem; grid-template-columns: 1fr; }
@media(min-width: 680px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
@media(min-width: 1100px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }

.prod-card {
  background: var(--card-solid); border: 2px solid var(--linea); border-radius: var(--r);
  padding: 1.25rem; position: relative; transition: all 0.25s var(--ease);
  display: flex; flex-direction: column; gap: 0.875rem; box-shadow: var(--shadow-sm);
}
.prod-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.prod-card.on { border-color: var(--verde); background: #F0FDF4; box-shadow: var(--shadow-glow); }
.prod-card .top { display: flex; gap: 0.875rem; align-items: flex-start; }
.prod-card .im { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--bg); border: 1px solid var(--linea); flex: none; }
.prod-card .im.sin { display: grid; place-items: center; color: var(--tenue); }
.prod-card .tx { flex: 1; min-width: 0; }
.prod-card .tx b { font-size: 0.95rem; font-weight: 800; line-height: 1.35; display: block; color: var(--ink); }
.prod-card .tx small { color: var(--gris); font-size: 0.725rem; font-weight: 600; display: block; margin-top: 4px; }

.chk-box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--linea); background: #fff; display: grid; place-items: center; color: transparent; flex: none; transition: 0.2s; }
.prod-card.on .chk-box { background: var(--verde); border-color: var(--verde); color: #fff; animation: pop 0.3s var(--ease); }

.tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.tg { border-radius: var(--pill); padding: 0.25rem 0.65rem; font-size: 0.7rem; font-weight: 800; }
.tg.cong { background: var(--verde-bg); color: var(--verde); }
.tg.dias { background: var(--naranja-bg); color: var(--naranja); }

.precios-opt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.po-btn { border: 1.5px solid var(--linea); border-radius: var(--r2); padding: 0.6rem 0.4rem; text-align: center; transition: 0.2s; background: rgba(255,255,255,0.5); }
.po-btn:hover { border-color: var(--ink); background: #fff; }
.po-btn.on { border-color: var(--ink); background: var(--ink); color: #fff; box-shadow: var(--shadow); }
.po-btn span { display: block; font-size: 0.65rem; font-weight: 700; color: var(--gris); margin-bottom: 0.15rem; text-transform: uppercase; }
.po-btn.on span { color: rgba(255, 255, 255, 0.7); }
.po-btn b { font-size: 0.9rem; font-weight: 800; }

.libre-input { display: flex; align-items: center; gap: 0.5rem; font-size: 0.775rem; font-weight: 700; color: var(--gris); margin-top: 0.25rem; }
.cuenta-box { background: var(--bg); border-radius: var(--r2); padding: 0.875rem; font-size: 0.775rem; line-height: 1.6; color: var(--gris); font-weight: 600; border: 1px solid var(--linea); margin-top: auto; }
.cuenta-box b { color: var(--ink); font-weight: 800; }
.cuenta-box b.mal { color: var(--rojo); }
.cuenta-box b.bien { color: var(--verde); }

.vermas-btn { width: 100%; border: 2px dashed var(--linea); border-radius: var(--r2); padding: 1rem; font-size: 0.85rem; font-weight: 800; color: var(--gris); margin-top: 1.25rem; transition: 0.2s; background: transparent; }
.vermas-btn:hover { border-color: var(--ink); color: var(--ink); background: #fff; }

/* BOTTOM BAR */
.bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0 1rem calc(1rem + env(safe-area-inset-bottom)); transform: translateY(150%); transition: transform 0.4s var(--ease); }
.bottom-bar.on { transform: translateY(0); }
.bottom-bar-inner { max-width: 800px; margin: 0 auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff; border-radius: 24px; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); }
.bottom-bar-text { flex: 1; min-width: 0; }
.bottom-bar-text small { display: block; font-size: 0.725rem; color: rgba(255, 255, 255, 0.6); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
.bottom-bar-text b { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; color: var(--lima); }

.btn-action { border-radius: var(--pill); padding: 0.875rem 1.5rem; font-size: 0.9rem; font-weight: 800; transition: all 0.2s var(--ease); white-space: nowrap; }
.btn-action.pri { background: var(--lima); color: #0F172A; }
.btn-action.pri:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(132, 204, 22, 0.4); }
.btn-action.pri:disabled { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.3); transform: none; box-shadow: none; cursor: not-allowed; }
.btn-action.gh { border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
.btn-action.gh:hover { background: rgba(255, 255, 255, 0.1); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 1.25rem; opacity: 0; visibility: hidden; transition: all 0.3s var(--ease); }
.modal-overlay.on { opacity: 1; visibility: visible; }
.modal-box { background: var(--card-solid); border-radius: var(--r); padding: 2rem; width: min(600px, 100%); max-height: 85vh; overflow: auto; transform: scale(0.95); transition: transform 0.3s var(--ease); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid var(--linea); }
.modal-overlay.on .modal-box { transform: scale(1); }
.modal-box h3 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 0.875rem; color: var(--ink); }
.modal-box p { color: var(--gris); font-size: 0.9rem; line-height: 1.7; margin-bottom: 1rem; }
.modal-box p b { color: var(--ink); }
.modal-box textarea { width: 100%; min-height: 160px; background: var(--bg); border: 1px solid var(--linea); border-radius: var(--r2); padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.775rem; white-space: pre; resize: vertical; color: var(--ink); }

.cargando { grid-column: 1 / -1; text-align: center; padding: 6rem 1rem; color: var(--gris); font-weight: 700; }
.spin { width: 48px; height: 48px; border: 4px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; margin: 0 auto 1.25rem; animation: spin 0.8s linear infinite; }

@media(prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- PIN MODAL -->
<div class="pin" id="pin">
  <div class="pin-c">
    <div class="logo-icon">Ki</div>
    <h1>Análisis Estratégico</h1>
    <p>Ingresa tu PIN para acceder al tablero</p>
    <input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <div class="pin-e" id="pin-e"></div>

</div>

<!-- APP MAIN STRUCTURE -->
<div id="app" class="oculto">
  <div class="app">
    <!-- NAV LATERAL DESKTOP -->
    <aside class="lado">
      <div class="marca">
        <div class="logo-icon">Ki</div>
        <div><b>Kiosko</b><small>Ocosingo</small></div>

      <div class="nav-t">DECISIONES CLAVE</div>
      <button class="nav on" data-ir="resumen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Resumen
      </button>
      <button class="nav" data-ir="rotacion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        1. Qué Comprar
      </button>
      <button class="nav" data-ir="remate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.6 8.4 12 17l-4-4"/><path d="M4 4h16v16H4z"/></svg>
        2. Plan Remate <span class="badge" id="nav-n">0</span>
      </button>
      <button class="nav" data-ir="margen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        3. A Cuánto Vender
      </button>

      <div class="nav-t">HISTÓRICO</div>
      <button class="nav" data-ir="ventas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
        Ventas por Mes
      </button>
      <button class="nav" data-ir="parado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/></svg>
        Dinero Detenido
      </button>
    </aside>

    <!-- CONTENT WRAPPER -->
    <div>
      <div class="movil" id="movil"></div>
      
      <main class="main">
        <div class="cab">
          <div>
            <h1>Tablero de Decisiones</h1>
            <p>Dónde está tu dinero, qué comprar y cuánto recuperar hoy mismo</p>
          </div>
          <div class="rango">
            <button id="r-todo" class="on">Todo el tiempo</button>
            <button id="r-12m">Últimos 12 meses</button>
          </div>

        <div class="bento" id="rej">
          <div class="cargando"><div class="spin"></div>Sincronizando datos de tu negocio...</div>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- BARRA FLOTANTE DE REMATE -->
<div class="bottom-bar" id="bot">
  <div class="bottom-bar-inner">
    <div class="bottom-bar-text">
      <small id="bot-s">Selecciona mercancía a rematar</small>
      <b class="mono" id="bot-v">$0</b>
    </div>
    <button class="btn-action gh" id="b-limpiar">Limpiar</button>
    <button class="btn-action pri" id="b-plan" disabled>Generar Plan</button>
  </div>
</div>

<!-- MODAL EXPLICATIVO -->
<div class="modal-overlay" id="mo">
  <div class="modal-box" id="mo-in"></div>
</div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";

function api(a,p,b,ms){
  ms=ms||30000;
  if(!API_URL||!API_TOKEN) return Promise.reject(new Error("Falta el archivo config.js con las credenciales"));
  var u=new URL(API_URL),c=new AbortController(),t=setTimeout(function(){c.abort();},ms),o={redirect:"follow",signal:c.signal};
  if(b){o.method="POST";o.headers={"Content-Type":"text/plain;charset=utf-8"};o.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:a},b));}
  else u.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:a},p||{})).toString();
  return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error("Respuesta del servidor: "+r.status);return r.text();})
   .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("Respuesta de datos no válida");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
   .catch(function(e){clearTimeout(t);if(e&&e.name==="AbortError")throw new Error("El servidor tardó demasiado tiempo");throw e;});
}

var $=function(i){return document.getElementById(i);};
function num(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function mx(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX");}
function a10(n){return Math.ceil(n/10)*10;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function dias(d){if(!d)return"—";if(d<45)return d+" días";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años";}

var PAL=["#10B981","#84CC16","#3B82F6","#F97316","#8B5CF6","#14B8A6","#EF4444","#F59E0B","#EC4899","#64748B"];
var D=null,MESES=[],rango="todo",sel={},FOTOS={},MOTO=35,orden="dinero",verTodo=false,seccion="resumen";

/* Animación de Números */
function cuenta(el,hasta,fmt){
  var t0=performance.now(),dur=1000;
  (function paso(t){
    var k=Math.min(1,(t-t0)/dur);
    k=1-Math.pow(1-k,3);
    el.textContent=fmt(hasta*k);
    if(k<1)requestAnimationFrame(paso);
  })(t0);
}

/* Validación del PIN con Shake en error */
var pi=$("pin-in");
pi.addEventListener("input",function(){
  if(pi.value.length<4)return;
  var v=pi.value;pi.disabled=true;$("pin-e").classList.remove("show");
  api("verificarPin",null,{pin:v}).then(function(d){
    if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
    if(d.vendedor!=="Alex")throw new Error("Pantalla restringida a Alex");
    $("pin").classList.add("oculto");$("app").classList.remove("oculto");cargar();
  }).catch(function(e){
    $("pin-e").textContent=e.message;
    $("pin-e").classList.add("show");
    pi.value="";
    pi.disabled=false;
    pi.focus();
    pi.classList.add("shake");
    setTimeout(function(){pi.classList.remove("shake");},400);
  });
});

function cargar(){
  $("rej").innerHTML='<div class="cargando"><div class="spin"></div>Sincronizando hoja de datos…</div>';
  $("bot").classList.remove("on");
  Promise.all([
    api("analisis",{rango:rango},null,45000),
    api("catalogo",null,null,30000).catch(function(){return[];}),
    api("inicio",{usuario:"Alex"},null,35000).catch(function(){return{};})
  ]).then(function(r){
    D=r[0];sel={};FOTOS={};
    (r[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)FOTOS[norm(x.descripcion)]=x.imagen;});
    MESES=(r[2]&&r[2].ventasMes)||[];
    pintar();
  }).catch(function(e){$("rej").innerHTML='<div class="cargando">Error: '+esc(e.message)+"<br><small>Revisa la consola (F12) y que config.js exista.</small></div>";});
}

$("r-todo").addEventListener("click",function(){if(rango==="todo")return;rango="todo";marcaR();cargar();});
$("r-12m").addEventListener("click",function(){if(rango==="12m")return;rango="12m";marcaR();cargar();});
function marcaR(){$("r-todo").classList.toggle("on",rango==="todo");$("r-12m").classList.toggle("on",rango==="12m");}

function meses(){if(rango==="12m")return 12;var d=D&&D.resumen&&D.resumen.desde;if(!d)return 12;
  return Math.max(1,Math.round((Date.now()-Number(d))/(30.4*864e5)));}
function viejos(){var V=(D.viejos||[]).filter(function(x){return x.dias>180;}).slice();
  V.sort(orden==="dinero"?function(a,b){return b.capital-a.capital;}:function(a,b){return b.dias-a.dias;});return V;}
function costoU(x){return x.piezas?x.capital/x.piezas:0;}

/* Render Gráfica */
function area(){
  if(!MESES.length)return "";
  var W=680,H=220,P={t:20,b:10,l:4,r:4};
  var vals=MESES.map(function(m){return Number(m.total)||0;});
  var max=Math.max.apply(null,vals.concat([1])),n=vals.length;
  var px=function(i){return P.l+i*((W-P.l-P.r)/Math.max(1,n-1));};
  var py=function(v){return P.t+(H-P.t-P.b)*(1-v/max);};
  var pts=vals.map(function(v,i){return [px(i),py(v)];});
  var d=pts.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+","+q[1].toFixed(1);
    var p0=pts[i-1],cx=(p0[0]+q[0])/2;
    return "C"+cx.toFixed(1)+","+p0[1].toFixed(1)+" "+cx.toFixed(1)+","+q[1].toFixed(1)+" "+q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  var ar=d+" L"+pts[n-1][0].toFixed(1)+","+H+" L"+pts[0][0].toFixed(1)+","+H+" Z";
  return '<div class="chart-container" id="chart"><svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#84CC16"/></linearGradient>'+
    '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".3"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>'+
    '<path class="area" d="'+ar+'"/><path class="linea" d="'+d+'"/>'+
    pts.map(function(q,i){return '<circle class="pt" data-i="'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4"/>';}).join("")+
    '</svg><div class="tip" id="tip"></div>'+
    '<div class="ejes"><span>'+esc(MESES[0].label)+"</span><span>"+esc(MESES[n-1].label)+"</span></div></div>";
}

/* Render Dona */
function dona(segs,total){
  var C=2*Math.PI*78,off=0;
  var arcos=segs.filter(function(s){return s.v>0;}).map(function(s){
    var len=Math.max(0,s.v/total*C-3);
    var h='<circle cx="95" cy="95" r="78" stroke="'+s.c+'" stroke-linecap="round" stroke-dasharray="'+len.toFixed(1)+" "+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';
    off+=s.v/total*C;return h;}).join("");
  return '<div class="dona-wrapper"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" stroke="#E2E8F0"/>'+arcos+
    '</svg><div class="ctr"><b class="mono">'+mx(total)+"</b><span>En Cajas</span></div></div>";
}

var SECS=[["resumen","Resumen"],["rotacion","1. Qué Comprar"],["remate","2. Sacar Dinero"],["margen","3. Precios"],["ventas","Ventas"],["parado","Parado"]];

function pintar(){
  var R=D.resumen||{},cap=D.capital||[],rot=D.rotacion||[],mar=D.margen||[],V=viejos();
  var porMes=R.utilidad/meses(),cong=porMes>0?D.capitalTotal/porMes:0;
  var capV=V.reduce(function(s,x){return s+x.capital;},0),pzV=V.reduce(function(s,x){return s+x.piezas;},0);
  var T=D.capitalTotal||1,h="";

  $("movil").innerHTML=SECS.map(function(s,i){return '<button data-ir="'+s[0]+'"'+(i===0?' class="on"':"")+">"+s[1]+"</button>";}).join("");
  $("nav-n").textContent=V.length?V.length:"0";

  /* HERO BENTO */
  h+='<section class="hero-bento ani" id="s-resumen"><div><div class="lb">Capital Congelado en Mercancía</div>'+
    '<div class="big mono" id="hero-v">$0</div>'+
    '<div class="lb">'+D.piezasTotal+' piezas físicas pagadas en bodega</div></div>'+
    '<div class="pillas"><span class="hp lima">'+(cong?cong.toFixed(1):"—")+" meses de ganancia</span>"+
    '<span class="hp">Ganancia prom: '+mx(porMes)+"/mes</span></div></section>";

  /* KPIs */
  var ks=[
    ["En riesgo (+6 meses)",mx(capV),pzV+" pzas · "+V.length+" productos","var(--naranja)","var(--naranja-bg)",'<path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/>'],
    ["Margen General Real",Math.round(R.margen)+"%","de cada $100 que ingresan","var(--verde)","var(--verde-bg)",'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',R.margen],
    ["Ganancia del Periodo",mx(R.utilidad),R.ventas+" ventas · "+mx(R.porVenta)+" c/u","var(--azul)","var(--azul-bg)",'<path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>']
  ];
  h+=ks.map(function(k,i){return '<div class="kpi-card ani" style="animation-delay:'+(.08*(i+1))+'s">'+
    '<div class="ico" style="background:'+k[4]+';color:'+k[3]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+k[5]+"</svg></div>"+
    '<div><div class="lb">'+k[0]+'</div><b class="mono">'+k[1]+"</b><small>"+k[2]+"</small></div>"+
    (k[6]!=null?'<div class="rb" style="margin-top:0.75rem"><div class="tr"><i class="fi" style="width:'+Math.min(100,k[6]).toFixed(0)+'%;background:linear-gradient(90deg,#10B981,#84CC16)"></i></div></div>':"")+
    "</div>";}).join("");

  /* DECISIÓN 1: QUÉ COMPRAR */
  var maxD=Math.max.apply(null,rot.map(function(x){return Math.max(x.diasVenta,x.diasStock);}).concat([1]));
  var ator=rot.filter(function(x){return x.piezas>0&&x.ventas>=3&&x.diasStock>x.diasVenta*2;});
  h+='<section class="b-card w7 ani" id="s-rotacion">'+
    '<span class="decision-tag d1">Decisión 1: Qué Comprar</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg> Rotación de Inventario</h2>'+
    '<p class="sub">Verde: <b>días que tarda en venderse</b>. Naranja: <b>días que lleva parado hoy</b>. Invierte en verde, frena en naranja.</p>'+
    '<div style="margin-top:1.25rem">'+rot.map(function(x){
      var mal=x.piezas&&x.ventas>=3&&x.diasStock>x.diasVenta*2;
      return '<div class="rot-item"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" ventas · "+(x.piezas?x.piezas+" en stock":"sin stock")+"</small></div></div>"+
        '<div class="rb"><span class="et">Venta</span><div class="tr"><i class="fi" style="width:'+Math.max(4,x.diasVenta/maxD*100).toFixed(1)+'%;background:linear-gradient(90deg,#10B981,#84CC16)"></i></div><span class="vl mono">'+dias(x.diasVenta)+"</span></div>"+
        '<div class="rb"><span class="et">Parado</span><div class="tr"><i class="fi" style="width:'+Math.max(4,x.diasStock/maxD*100).toFixed(1)+'%;background:'+(mal?"linear-gradient(90deg,#EF4444,#F97316)":"linear-gradient(90deg,#F97316,#F59E0B)")+'"></i></div><span class="vl mono">'+dias(x.diasStock)+"</span></div></div>";
    }).join("")+"</div>"+
    (ator.length?'<div class="aviso warn"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div>Atención en <b>'+ator.map(function(x){return esc(x.categoria);}).join("</b>, <b>")+"</b>: el stock sobrante lleva parado más del doble del tiempo normal de venta.</div></div>":'<div class="aviso ok"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5L20 7"/></svg></span><div>Rotación saludable: ningún grupo excede sus tiempos promedio.</div></div>')+
    '<button class="btn-help" data-exp="rotacion"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ¿Cómo interpretar esto?</button></section>';

  /* DONA CAPITAL DETENIDO */
  h+='<section class="b-card w5 ani" id="s-parado">'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/></svg> Distribución del Capital</h2>'+
    '<p class="sub">Mapeo de categorías en cajas. Mientras más grande la sección, más dinero guardado.</p>'+
    '<div style="margin-top:1rem">'+dona(cap.map(function(x,i){return{v:x.capital,c:PAL[i%PAL.length]};}),T)+"</div>"+
    '<div class="legenda">'+cap.slice(0,7).map(function(x,i){
      return '<button><i style="background:'+PAL[i%PAL.length]+'"></i><span class="t">'+esc(x.categoria)+'</span><span class="v mono">'+mx(x.capital)+" · "+Math.round(x.capital/T*100)+"%</span></button>";}).join("")+"</div>"+
    '<button class="btn-help" data-exp="capital">¿Por qué es vital?</button></section>';

  /* DECISIÓN 2: PLAN REMATE */
  h+='<section class="b-card ani" id="s-remate">'+
    '<span class="decision-tag d2">Decisión 2: Recuperar Efectivo</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.6 8.4 12 17l-4-4"/><path d="M4 4h16v16H4z"/></svg> Plan de Remate Inteligente</h2>'+
    '<p class="sub">Tienes <b>'+mx(capV)+'</b> parados (+6 meses) en <b>'+pzV+' piezas</b>. Selecciónalos para liberar flujo de caja de inmediato.</p>'+
    (V.length>4?'<div class="aviso warn"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span><div><b>Foco estratégico:</b> Los 4 productos más antiguos ('+esc(V.slice(0,4).map(function(x){return x.descripcion;}).join(", "))+") concentran <b>"+mx(V.slice(0,4).reduce(function(s,x){return s+x.capital;},0))+"</b> de capital sin movimiento.</div></div>":"")+
    '<div class="ctrl-bar"><span>Costo promedio de envío:</span><span class="inp-pill">$<input id="moto" type="number" step="5" min="0" value="'+MOTO+'"></span>'+
    '<span style="margin-left:auto">Ordenar:</span><div class="ord-pill"><button data-ord="dinero"'+(orden==="dinero"?' class="on"':"")+'>Dinero</button><button data-ord="dias"'+(orden==="dias"?' class="on"':"")+'>Antigüedad</button></div>'+
    '<small>El motomandado sale de tu bolsa. Ya viene restado en el neto para proteger tu piso real.</small></div>'+
    '<div class="product-grid" id="malla">'+(V.length?V.slice(0,verTodo?999:12).map(pcHTML).join(""):'<div class="aviso ok" style="grid-column:1/-1"><span class="ic"></span><div>Tu bodega está libre de inventario congelado de más de 6 meses.</div></div>')+"</div>"+
    (V.length>12&&!verTodo?'<button class="vermas-btn" id="vermas">Mostrar '+ (V.length-12) +" productos más (suman "+mx(V.slice(12).reduce(function(s,x){return s+x.capital;},0))+")</button>":"")+
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1.25rem"><button class="btn-help" data-exp="remate">¿Vender al costo es perder?</button>'+
    '<button class="btn-help" data-exp="pildoras">¿De dónde salen los 3 precios?</button>'+
    '<button class="btn-help" data-exp="envio">¿Por qué descontar envío?</button></div></section>';

  /* DECISIÓN 3: MARGEN REAL */
  h+='<section class="b-card ani" id="s-margen">'+
    '<span class="decision-tag d3">Decisión 3: Definir Precios</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Rendimiento Real por Categoría</h2>'+
    '<p class="sub">Porcentaje libre tras pagar mercancía y flete. La barra más extensa indica la línea que más aporta a tu ganancia.</p>'+
    '<div style="margin-top:1.25rem">'+(function(){var mm=Math.max.apply(null,mar.map(function(y){return y.margen;}).concat([1]));return mar.map(function(x,i){
      return '<div class="rot-item"><div class="hd"><div><b>'+esc(x.categoria)+"</b><small>"+x.ventas+" ventas · "+mx(x.porVenta)+' c/u</small></div><div style="text-align:right"><b style="color:var(--verde)" class="mono">'+mx(x.utilidad)+'</b><small>'+Math.round(x.margen)+"% margen real</small></div></div>"+
        '<div class="rb"><div class="tr"><i class="fi" style="width:'+Math.max(6,x.margen/mm*100).toFixed(1)+'%;background:'+PAL[i%PAL.length]+'"></i></div></div></div>';}).join("");})()+"</div>"+
    '<button class="btn-help" data-exp="margen">¿Qué es el margen real?</button></section>';

  /* VENTAS HISTÓRICAS */
  if(MESES.length){
    var ult=MESES[MESES.length-1],prev=MESES.length>1?MESES[MESES.length-2]:null;
    var dif=prev?(Number(ult.total)-Number(prev.total)):0;
    h+='<section class="b-card ani" id="s-ventas">'+
      '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg> Comportamiento de Ventas</h2>'+
      '<p class="sub">Historial visual de los últimos '+MESES.length+' meses.'+
      (prev?" En el último mes registraste <b>"+mx(ult.total)+"</b> ("+(dif>=0?"<b style=\'color:var(--verde)\'>+"+mx(dif)+"</b>":'<b style=\"color:var(--rojo)\">-'+mx(-dif)+"</b>")+" respecto al anterior).":"")+"</p>"+
      area()+"</section>";
  }

  $("rej").innerHTML=h;
  cuenta($("hero-v"),D.capitalTotal,mx);
  cablearChart();espiar();total();
}

function pcHTML(x,i){
  var cu=costoU(x),img=FOTOS[norm(x.descripcion)];
  return '<article class="prod-card" data-i="'+i+'">'+
    '<div class="top">'+
      (img?'<img class="im" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.classList.add(\'sin\');this.innerHTML=\'📦\'">':'<span class="im sin">📦</span>')+
      '<div class="tx"><b>'+esc(x.descripcion)+"</b><small>"+esc(x.categoria)+" · "+x.piezas+" pza · costo: "+mx(cu)+"</small></div>"+
      '<button class="chk-box" data-act="tog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg></button>'+
    "</div>"+
    '<div class="tags"><span class="tg cong">'+mx(x.capital)+' congelados</span><span class="tg dias">'+dias(x.dias)+"</span></div>"+
    (function(){var op=[["Sin perder",a10(cu+MOTO)],["Ganas $50",a10(cu+MOTO+50)],["Mitad",a10(x.precio/2)]],vis={},u=[];
      op.forEach(function(o){if(vis[o[1]])return;vis[o[1]]=1;u.push(o);});
      return '<div class="precios-opt" style="grid-template-columns:repeat('+u.length+',1fr)">'+u.map(function(o){
        return '<button class="po-btn" data-act="p" data-v="'+o[1]+'"><span>'+o[0]+'</span><b class="mono">'+mx(o[1])+"</b></button>";}).join("")+"</div>";})()+
    '<div class="libre-input">o asigna: <span class="inp-pill">$<input data-act="in" type="number" step="10" min="0" value="'+a10(costoU(x)+MOTO)+'"></span></div>'+
    '<div class="cuenta-box" data-f="1">Haz clic en el cuadro para añadir este producto al plan de remate.</div></article>';
}

function render(card,i,x){
  if(!x)return;
  var on=sel[i]!=null&&sel[i]>0;card.classList.toggle("on",on);
  var p=num(card.querySelector("[data-act=in]").value),cu=costoU(x);
  card.querySelectorAll(".po-btn").forEach(function(o){o.classList.toggle("on",num(o.getAttribute("data-v"))===p);});
  var neto=(p-MOTO)*x.piezas,dif=neto-x.capital,porPza=p-MOTO-cu;
  card.querySelector("[data-f]").innerHTML=on
    ? "<b>Por unidad:</b> precio "+mx(p)+" − envío "+mx(MOTO)+" − costo "+mx(cu)+" = "+
      (porPza>=0?'<b class="bien">+'+mx(porPza)+"</b>":'<b class="mal">'+mx(porPza)+"</b>")+" libre.<br>"+
      "<b>Lote de "+x.piezas+":</b> recuperas <b class='mono'>"+mx(neto)+"</b> de "+mx(x.capital)+" · "+
      (dif>=0?'<b class="bien">+'+mx(dif)+"</b>":'diferencia <b class="mal">'+mx(-dif)+"</b>")
    : "Haz clic en el cuadro para añadir este producto al plan de remate.";
}

function verBarra(){
  var hay=Object.keys(sel).some(function(i){return sel[i]>0;});
  $("bot").classList.toggle("on",hay||seccion==="remate");
}
function total(){
  var V=viejos(),lib=0,cost=0,pz=0,n=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;n++;});
  $("bot-v").textContent=mx(lib);
  $("bot-s").textContent=n?(pz+" piezas ("+n+" prod.) · costo base: "+mx(cost)+" · flete restado"):"Selecciona mercancía a rematar";
  $("b-plan").disabled=!n;
  verBarra();
}

/* Interactividad Chart */
function cablearChart(){
  var ch=$("chart");if(!ch)return;
  ch.addEventListener("mouseover",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    var m=MESES[Number(p.getAttribute("data-i"))];if(!m)return;
    var tip=$("tip"),r=ch.getBoundingClientRect(),pr=p.getBoundingClientRect();
    tip.textContent=m.label+" · "+mx(m.total)+(m.cantidad?" · "+m.cantidad+" pzas":"");
    tip.style.left=(pr.left-r.left+pr.width/2)+"px";tip.style.top=(pr.top-r.top)+"px";
    tip.classList.add("on");p.classList.add("on");
  });
  ch.addEventListener("mouseout",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    $("tip").classList.remove("on");p.classList.remove("on");
  });
}

function espiar(){
  var ids=SECS.map(function(s){return "s-"+s[0];});
  var obs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var id=en.target.id.replace("s-","");
      if(id===seccion)return;seccion=id;
      document.querySelectorAll("[data-ir]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-ir")===id);});
      verBarra();
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  ids.forEach(function(id){var el=$(id);if(el)obs.observe(el);});
}

document.addEventListener("click",function(e){
  var ir=e.target.closest("[data-ir]");
  if(ir){var el=$("s-"+ir.getAttribute("data-ir"));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
  var ex=e.target.closest("[data-exp]");if(ex){abrir(ex.getAttribute("data-exp"));return;}
  var od=e.target.closest("[data-ord]");if(od){orden=od.getAttribute("data-ord");sel={};verTodo=false;pintar();return;}
  if(e.target.closest("#vermas")){verTodo=true;pintar();return;}
  var card=e.target.closest(".prod-card");if(!card)return;
  var b=e.target.closest("[data-act]");if(!b)return;
  var i=card.getAttribute("data-i"),x=viejos()[i],act=b.getAttribute("data-act");
  if(act==="tog"){if(sel[i])delete sel[i];else sel[i]=num(card.querySelector("[data-act=in]").value)||a10(costoU(x)+MOTO);}
  if(act==="p"){var v=num(b.getAttribute("data-v"));card.querySelector("[data-act=in]").value=v;sel[i]=v;}
  render(card,i,x);total();
});

document.addEventListener("input",function(e){
  if(e.target.id==="moto"){MOTO=num(e.target.value);
    document.querySelectorAll(".prod-card").forEach(function(c){render(c,c.getAttribute("data-i"),viejos()[c.getAttribute("data-i")]);});total();return;}
  var b=e.target.closest("[data-act=in]");if(!b)return;
  var card=b.closest(".prod-card"),i=card.getAttribute("data-i");
  sel[i]=num(b.value);render(card,i,viejos()[i]);total();
});

$("b-limpiar").addEventListener("click",function(){
  sel={};document.querySelectorAll(".prod-card").forEach(function(c){c.classList.remove("on");
    c.querySelector("[data-f]").textContent="Haz clic en el cuadro para añadir este producto al plan de remate.";
    c.querySelectorAll(".po-btn").forEach(function(o){o.classList.remove("on");});});
  total();
});

$("b-plan").addEventListener("click",function(){
  var V=viejos(),lin=[],lib=0,cost=0,pz=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
    lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;
    lin.push("• "+x.descripcion+" — "+x.piezas+" pza · PRECIO REMATE "+mx(sel[i])+" (antes "+mx(x.precio)+")");});
  var txt="PLAN DE REMATE KIOSKO\n"+pz+" piezas · Efectivo neto recuperable: "+mx(lib)+" (envío descontado)\n\n"+lin.join("\n");
  abrirHTML("<h3>Estrategia de Liquidez Generada</h3>"+
    "<p>Recuperarás <b>"+mx(lib)+"</b> líquidos limpios liberando <b>"+pz+" piezas</b> de inventario. Costo de adquisición original: "+mx(cost)+".</p>"+
    (lib<cost?"<p>Nota: El monto recuperado está por debajo del costo inicial. <b>Esto es correcto estratégicamente</b> para productos parados hace meses: el dinero inmóvil pierde valor contra la inflación y costo de oportunidad.</p>":"")+
    "<p><b>Consejo de venta:</b> Intenta vender en paquetes o combos. Como el costo del envío es fijo por viaje, al vender lotes multiplicas tu margen libre.</p>"+
    '<textarea readonly id="plan-txt">'+esc(txt)+"</textarea>"+
    '<div style="display:flex;gap:0.75rem;margin-top:1.25rem"><button class="btn-action pri" id="cp">Copiar lista al portapapeles</button><button class="btn-action gh" style="color:var(--ink);border-color:var(--linea)" data-cerrar="1">Cerrar</button></div>');
  $("cp").addEventListener("click",function(){var t=$("plan-txt");t.removeAttribute("readonly");t.select();
    try{document.execCommand("copy");}catch(e){}t.setAttribute("readonly","readonly");this.textContent="¡Copiado!";});
});

var EXP={
  capital:["Capital Congelado","Representa el valor directo invertido en productos guardados en cajas. No es una pérdida financiera inmediata, pero restringe la liquidez de tu negocio impidiéndote comprar inventario de alta rotación."],
  remate:["¿Vender al costo es perder?","No. La verdadera pérdida es mantener dinero estancado durante más de medio año.<br><br>Si un artículo de $150 no se vende a $300, su valor real del mercado actual es inferior. Rematarlo a $180 te devuelve capital fresco para comprar productos que rotan rápidamente."],
  pildoras:["Estructura de los 3 precios sugeridos","<b>Sin perder:</b> Costo del producto + flete. Es el piso financiero real para no registrar pérdidas operativas.<br><br><b>Ganas $50:</b> Recupera costo base y genera $50 de margen libre por pieza.<br><br><b>Mitad de precio:</b> 50% de descuento directo sobre el precio de lista anterior. Maximiza la velocidad de salida."],
  envio:["Impacto del Motomandado","Descontar el envío por producto asegura que tus cálculos de liquidez sean exactos y no asumas ganancias ficticias que luego absorbe la logística de entrega."],
  rotacion:["Días de Rotación","Indica el promedio de días necesarios para completar la venta de un inventario desde su compra original."],
  margen:["Margen Real por Categoría","El porcentaje neto retenido por el negocio una vez deducidos costos de adquisición y gastos de envío."]
};

function abrir(k){var e=EXP[k];if(!e)return;abrirHTML("<h3>"+e[0]+"</h3><p>"+e[1]+'</p><button class="btn-action pri" data-cerrar="1">Entendido</button>');}
function abrirHTML(html){$("mo-in").innerHTML=html;$("mo").classList.add("on");}
$("mo").addEventListener("click",function(e){if(e.target===this||e.target.closest("[data-cerrar]"))this.classList.remove("on");});
})();
</script>
</body>
</html>
