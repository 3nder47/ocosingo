<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG=window.OC_CONFIG||{},API_URL=CFG.API_URL||"",API_TOKEN=CFG.API_TOKEN||"";
function apiUnaVez(a,p,b,ms){ms=ms||30000;
  if(!API_URL||!API_TOKEN)return Promise.reject(new Error("Falta la configuración de config.js"));
  var u=new URL(API_URL),c=new AbortController(),t=setTimeout(function(){c.abort();},ms),o={redirect:"follow",signal:c.signal};
  if(b){o.method="POST";o.headers={"Content-Type":"text/plain;charset=utf-8"};o.body=JSON.stringify(Object.assign({token:API_TOKEN,accion:a},b));}
  else u.search=new URLSearchParams(Object.assign({token:API_TOKEN,accion:a},p||{})).toString();
  return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok){var he=new Error("Respuesta del servidor: "+r.status);he.tipo="http";he.status=r.status;throw he;}return r.text();})
   .then(function(x){var j;try{j=JSON.parse(x);}catch(e){throw new Error("Respuesta de datos no válida");}if(!j.ok)throw new Error(j.error||"Error del servidor");return j.data;})
   .catch(function(e){clearTimeout(t);
     if(e&&e.name==="AbortError"){var le=new Error("El servidor tardó demasiado");le.tipo="lento";throw le;}
     if(e&&!e.tipo&&e.name==="TypeError")e.tipo="red";
     throw e;});}

/* ---------- Reintentos ante los hipos de Google ----------------------------
   Apps Script a veces ejecuta el codigo bien y falla al ENTREGAR la respuesta
   (404 o 5xx desde googleusercontent). Se reintenta 2 veces mas, con 0.4 s y
   1.2 s de espera. Si los tres intentos fallan sale el mismo error de siempre.
   Solo se reintenta lo que no puede duplicar nada: las lecturas y verificarPin.
   aplicarRemate NO se reintenta: guardaria el precio ya rematado en la columna
   T como "precio antes" y romperia el deshacer. */
var REINTENTABLES={verificarPin:1};
var TRANSITORIOS=[404,429,500,502,503,504];
function api(a,p,b,ms){
  var esperas=[400,1200],puede=!b||REINTENTABLES[a]===1;
  function intento(i){
    return apiUnaVez(a,p,b,ms).catch(function(e){
      var transitorio=(e.tipo==="http"&&TRANSITORIOS.indexOf(e.status)>-1)
                    ||(e.tipo==="red"&&navigator.onLine!==false);
      if(!puede||!transitorio||i>=esperas.length)throw e;
      return new Promise(function(ok){setTimeout(ok,esperas[i]);}).then(function(){return intento(i+1);});
    });
  }
  return intento(0);
}

var $=function(i){return document.getElementById(i);};
function num(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function mx(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX");}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function a10(n){return Math.ceil(n/10)*10;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function dias(d){if(d==null||!isFinite(d))return"—";if(d<45)return d+" días";var m=Math.round(d/30.4);return m<24?m+" meses":(Math.round(d/365*10)/10)+" años";}
var PAL=["#10B981","#84CC16","#3B82F6","#F97316","#8B5CF6","#14B8A6","#EF4444","#F59E0B","#EC4899","#64748B"];
var D=null,CAT=[],MOTO_REAL=35,COBRO=10,MESES=[],rango="todo",sel={},FOTOS={},MOTO=25,orden="dinero",verTodo=false,seccion="resumen";

function cuenta(el,hasta,fmt){
  if(!el)return;var t0=performance.now(),dur=1000;
  (function paso(t){var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);el.textContent=fmt(hasta*k);if(k<1)requestAnimationFrame(paso);})(t0);
}

/* ---------- Sesion de Alex, compartida entre alta / analisis / glosario ----------
   Vive en sessionStorage: aguanta recargas y saltos entre pantallas dentro de la
   misma pestana, y se borra sola al cerrar el navegador. No guarda el PIN: solo
   la marca de que ya lo validaste. */
var SES_KEY="kiosko:sesion:alex";
function sesionViva(){try{return sessionStorage.getItem(SES_KEY)==="1";}catch(e){return false;}}
function abrirSesion(){try{sessionStorage.setItem(SES_KEY,"1");}catch(e){}}
function entrar(){
  $("pin").classList.add("oculto");$("app").classList.remove("oculto");
  cargar();
}

var pi=$("pin-in");
pi.addEventListener("input",function(){
  if(pi.value.length<4)return;
  var v=pi.value;pi.disabled=true;$("pin-e").style.color="";$("pin-e").textContent="Conectando… la primera vez puede tardar unos segundos";
  api("verificarPin",null,{pin:v},60000).then(function(d){
    if(!d||!d.valido)throw new Error((d&&d.error)||"PIN incorrecto");
    if(d.vendedor!=="Alex")throw new Error("Pantalla restringida a Alex");
    abrirSesion();entrar();
  }).catch(function(e){$("pin-e").style.color="var(--rojo)";$("pin-e").textContent=e.message+" · vuelve a escribirlo";pi.value="";pi.disabled=false;pi.focus();});
});

function cargar(){
  $("rej").innerHTML='<div class="cargando"><div class="spin"></div>Sincronizando tu hoja…</div>';
  $("bot").classList.remove("on");
  Promise.all([
    api("analisis",{rango:rango},null,45000),
    api("catalogo",null,null,30000).catch(function(){return[];}),
    api("inicio",{usuario:"Alex"},null,35000).catch(function(){return{};})
  ]).then(function(r){
    D=r[0];sel={};FOTOS={};CAT=r[1]||[];
    (r[1]||[]).forEach(function(x){if(x&&x.descripcion&&x.imagen)FOTOS[norm(x.descripcion)]=x.imagen;});
    MESES=(r[2]&&r[2].ventasMes)||[];
    pintar();
  }).catch(function(e){$("rej").innerHTML='<div class="cargando">'+esc(e.message)+"</div>";});
}
$("r-todo").addEventListener("click",function(){if(rango==="todo")return;rango="todo";marcaR();cargar();});
$("r-12m").addEventListener("click",function(){if(rango==="12m")return;rango="12m";marcaR();cargar();});
function marcaR(){$("r-todo").classList.toggle("on",rango==="todo");$("r-12m").classList.toggle("on",rango==="12m");}
function meses(){if(rango==="12m")return 12;var d=D&&D.resumen&&D.resumen.desde;if(!d)return 12;
  return Math.max(1,Math.round((Date.now()-Number(d))/(30.4*864e5)));}
function viejos(){var V=(D.viejos||[]).filter(function(x){return x.dias>180;}).slice();
  V.sort(orden==="dinero"?function(a,b){return b.capital-a.capital;}:function(a,b){return b.dias-a.dias;});return V;}
function costoU(x){return x.piezas?x.capital/x.piezas:0;}

/* Gráfica: escala proporcional, raya de promedio y el mes en curso marcado aparte */
function area(){
  if(!MESES.length)return "";
  var W=680,H=200,P={t:26,b:10,l:4,r:4};
  var vals=MESES.map(function(m){return Number(m.total)||0;}),n=vals.length;
  var completos=n>1?vals.slice(0,n-1):vals;
  var prom=completos.reduce(function(a,b){return a+b;},0)/Math.max(1,completos.length);
  var max=Math.max.apply(null,vals.concat([1]));
  var px=function(i){return P.l+i*((W-P.l-P.r)/Math.max(1,n-1));};
  var py=function(v){return P.t+(H-P.t-P.b)*(1-v/max);};
  var pts=vals.map(function(v,i){return [px(i),py(v)];});
  var d=pts.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+","+q[1].toFixed(1);
    var p0=pts[i-1],cx=(p0[0]+q[0])/2;
    return "C"+cx.toFixed(1)+","+p0[1].toFixed(1)+" "+cx.toFixed(1)+","+q[1].toFixed(1)+" "+q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  var ar=d+" L"+pts[n-1][0].toFixed(1)+","+H+" L"+pts[0][0].toFixed(1)+","+H+" Z";
  var yp=py(prom);
  return '<div class="chart-container" id="chart"><svg viewBox="0 0 '+W+" "+H+'">'+
    '<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#84CC16"/></linearGradient>'+
    '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".3"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+P.l+'" y1="'+yp.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+yp.toFixed(1)+'" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>'+
    '<text x="'+(W-P.r)+'" y="'+(yp-7).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="#94A3B8">promedio '+mx(prom)+'</text>'+
    '<path class="area" d="'+ar+'"/><path class="linea" vector-effect="non-scaling-stroke" d="'+d+'"/>'+
    pts.map(function(q,i){return '<circle class="pt'+(i===n-1?" curso":"")+'" data-i="'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5"/>';}).join("")+
    '</svg><div class="tip" id="tip"></div>'+
    '<div class="ejes"><span>'+esc(MESES[0].label)+"</span><span>"+esc(MESES[n-1].label)+" · en curso</span></div></div>";
}
/* Texto honesto: compara meses completos y deja el actual aparte */
function textoVentas(){
  var n=MESES.length,curso=MESES[n-1],comp=n>1?MESES[n-2]:null,ant=n>2?MESES[n-3]:null;
  var dif=(comp&&ant)?(Number(comp.total)-Number(ant.total)):0;
  return '<p class="sub">Historial de los últimos '+n+' meses. La raya punteada es tu promedio mensual: arriba fue buen mes, abajo fue flojo.'+
    (comp?" Tu último mes completo, <b>"+esc(comp.label)+"</b>, cerró en <b>"+mx(comp.total)+"</b>"+
      (ant?" ("+(dif>=0?"<b style='color:var(--verde-deep)'>+"+mx(dif)+"</b>":"<b style='color:var(--rojo)'>−"+mx(-dif)+"</b>")+" contra "+esc(ant.label)+")":"")+".":"")+
    " <b>"+esc(curso.label)+"</b> va a la mitad, por eso no se compara todavía.</p>";
}
/* Desglose visual: filas con barra proporcional. Sirve para explicar CUALQUIER
   cuenta con peras y manzanas, en vez de soltar una fórmula. */
function desglose(titulo,filas,resultado,nota){
  var max=Math.max.apply(null,filas.concat([resultado]).map(function(f){return Math.abs(f.v);}).concat([1]));
  var h='<div class="desglose"><div class="dg-t">'+esc(titulo)+"</div>";
  filas.forEach(function(f){
    h+='<div class="dg-fila '+(f.signo==="-"?"dg-menos":"dg-mas")+'">'+
       '<div class="et">'+esc(f.et)+(f.sub?"<small>"+esc(f.sub)+"</small>":"")+"</div>"+
       '<div class="pista"><div class="barra" style="width:'+Math.max(4,Math.abs(f.v)/max*100).toFixed(1)+'%"></div></div>'+
       '<div class="val">'+(f.signo==="-"?"−":"+")+mx(Math.abs(f.v))+"</div></div>";
  });
  h+='<div class="dg-fila dg-res">'+
     '<div class="et">'+esc(resultado.et)+(resultado.sub?"<small>"+esc(resultado.sub)+"</small>":"")+"</div>"+
     '<div class="pista"><div class="barra" style="width:'+Math.max(4,Math.abs(resultado.v)/max*100).toFixed(1)+'%"></div></div>'+
     '<div class="val">'+mx(resultado.v)+"</div></div>";
  if(nota)h+='<div class="dg-nota">'+nota+"</div>";
  return h+"</div>";
}
function dona(segs,total){
  if(!(total>0))return '<div class="dona-wrapper"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" stroke="rgba(210,220,233,.4)"/></svg><div class="ctr"><b class="mono">$0</b><span>en cajas</span></div></div>';
  var C=2*Math.PI*78,off=0;
  var arcos=segs.filter(function(s){return s.v>0;}).map(function(s){
    var len=Math.max(0,s.v/total*C-3);
    var h='<circle cx="95" cy="95" r="78" stroke="'+s.c+'" stroke-linecap="round" stroke-dasharray="'+len.toFixed(1)+" "+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';
    off+=s.v/total*C;return h;}).join("");
  return '<div class="dona-wrapper"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" stroke="rgba(210,220,233,.4)"/>'+arcos+
    '</svg><div class="ctr"><b class="mono">'+mx(total)+"</b><span>en cajas</span></div></div>";
}

var SECS=[["resumen","Resumen"],["simular","¿Me conviene?"],["recientes","Recién llegados"],["rotacion","1. Qué comprar"],["remate","2. Sacar dinero"],["margen","3. Qué deja más"],["ventas","Ventas"],["parado","Parado"]];

function pintar(){
  var R=D.resumen||{},cap=D.capital||[],rot=D.rotacion||[],mar=D.margen||[],V=viejos();
  var porMes=R.utilidad/meses(),cong=porMes>0?D.capitalTotal/porMes:0;
  var capV=V.reduce(function(s,x){return s+x.capital;},0),pzV=V.reduce(function(s,x){return s+x.piezas;},0);
  var T=D.capitalTotal||1,h="";
  $("movil").innerHTML=SECS.map(function(s,i){return '<button data-ir="'+s[0]+'"'+(i===0?' class="on"':"")+">"+s[1]+"</button>";}).join("");
  $("nav-n").textContent=V.length?V.length:"";

  h+='<section class="hero-bento ani" id="s-resumen"><div><div class="lb">Capital congelado en mercancía</div>'+
    '<div class="big mono" id="hero-v">$0</div>'+
    '<div class="lb">'+D.piezasTotal+' piezas pagadas que siguen en cajas</div></div>'+
    '<div class="pillas"><span class="hp lima">'+(cong?cong.toFixed(1):"—")+" meses de ganancia</span>"+
    '<span class="hp">Ganas '+mx(porMes)+" al mes</span></div></section>";

  var ks=[
    ["En riesgo (+6 meses)",mx(capV),pzV+" pzas · "+V.length+" productos","var(--naranja)","#FFF7ED",'<path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/>'],
    ["Margen general",Math.round(R.margen)+"%","de cada $100 que entran","var(--verde-deep)","#ECFDF5",'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',R.margen],
    ["Ganancia del periodo",mx(R.utilidad),R.ventas+" ventas · "+mx(R.porVenta)+" c/u","var(--azul)","#EFF6FF",'<path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>']
  ];
  h+=ks.map(function(k,i){return '<div class="kpi-card ani" style="animation-delay:'+(.08*(i+1))+'s">'+
    '<div class="ico" style="background:'+k[4]+';color:'+k[3]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+k[5]+"</svg></div>"+
    '<div><div class="lb">'+k[0]+'</div><b class="mono">'+k[1]+"</b><small>"+k[2]+"</small></div>"+
    (k[6]!=null?'<div class="rb" style="margin-top:.75rem"><div class="tr"><i class="fi" style="width:'+Math.min(100,Number(k[6])||0).toFixed(0)+'%;background:linear-gradient(90deg,#10B981,#84CC16)"></i></div></div>':"")+
    "</div>";}).join("");

  /* ---- Antes de comprar: qué te va a costar puesto aquí ---- */
  var cats={};
  (D.rotacion||[]).forEach(function(x){cats[x.categoria]=x;});
  h+='<section class="b-card ani" id="s-simular">'+
    '<span class="decision-tag d1">Antes de comprar</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg> ¿Me conviene comprarlo?</h2>'+
    '<p class="sub">Escribe lo que ves en la plataforma <b>antes</b> de pagar. Te digo cuánto te costará puesto en Ocosingo, a cuánto tendrías que venderlo y si esa categoría se está moviendo.</p>'+
    '<div class="ctrl-bar" style="align-items:flex-end">'+
      '<label class="campo" style="flex:1;min-width:140px"><span>Precio en la plataforma, por pieza</span><span class="money"><i>$</i><input id="sim-precio" type="number" min="0" step="1" placeholder="200" inputmode="decimal"></span></label>'+
      '<label class="campo" style="width:100px"><span>Piezas</span><input id="sim-piezas" type="number" min="1" step="1" value="2"></label>'+
      '<label class="campo" style="flex:1;min-width:190px"><span>¿Dónde lo compras?</span><select id="sim-tienda" class="chip" style="padding:.7rem .9rem;border-radius:var(--r2);width:100%">'+
        '<option value="1.33">Temu / AliExpress / TikTok / Shopee — viene de China</option>'+
        '<option value="1.00">Temu con etiqueta "Local" — ya está en México</option>'+

/* ---------- Recien llegados: la cuenta de cada producto nuevo, con y sin envio ----------
   Sirve para ver (y mostrarle a Irene) cuanto queda por pieza si se cobra el envio
   aparte o si va incluido en el precio. Usa lo que ya devuelve `catalogo`. */
function recientes(){
  var lim=Date.now()-30*864e5;
  return CAT.filter(function(x){return x&&x.origen==="Alex"&&Number(x.agregado)>=lim&&Number(x.stock)>0;})
    .sort(function(a,b){return Number(b.agregado)-Number(a.agregado);});
}
function ganancia(precio,costo,conCobro){
  var entra=precio+(conCobro?COBRO:0),g=entra-costo-MOTO_REAL;
  return {g:g,m:entra>0?Math.round(g/entra*100):0};
}
function recientesLista(){
  var L=recientes();
  if(!L.length)return '<div class="aviso ok"><span class="ic"></span><div>No hay productos dados de alta en los últimos 30 días.</div></div>';
  var pz=0,inv=0,gC=0,gI=0;
  L.forEach(function(x){var n=Number(x.stock)||0,c=Number(x.costoFinal)||0,p=Number(x.precio)||0;
    pz+=n;inv+=c*n;gC+=ganancia(p,c,true).g*n;gI+=ganancia(p,c,false).g*n;});
  var celda=function(t,r,verde){return '<div class="rot-item" style="margin:0'+(verde?';background:#ECFDF5;border-color:#A7F3D0':'')+'">'+
    '<div class="lb" style="font-size:.7rem;font-weight:800;color:'+(verde?"var(--verde-deep)":"var(--gris)")+';text-transform:uppercase">'+t+'</div>'+
    '<div class="mono" style="font-size:1.35rem;font-weight:800;color:'+(r.g>=0?(verde?"var(--verde-deep)":"var(--ink)"):"var(--rojo)")+'">'+(r.g>=0?"+":"")+mx(r.g)+'</div>'+
    '<small style="color:var(--gris);font-weight:600">por pieza · '+r.m+'% de margen</small></div>';};
  return '<div class="aviso ok" style="background:#EFF6FF;border-color:#DBEAFE;color:#1E40AF"><span class="ic" style="background:var(--azul)"></span>'+
    '<div><b>'+L.length+' producto'+(L.length===1?"":"s")+' · '+pz+' pieza'+(pz===1?"":"s")+' · invertiste '+mx(inv)+'.</b> Si se vende todo: cobrando envío ganas <b>'+mx(gC)+'</b>; con envío incluido ganas <b>'+mx(gI)+'</b>. La diferencia son los <b>'+mx(gC-gI)+'</b> de los $'+COBRO+' que dejas de cobrar.</div></div>'+
    L.map(function(x){
      var c=Number(x.costoFinal)||0,p=Number(x.precio)||0,n=Number(x.stock)||0,img=x.imagen;
      var rc=ganancia(p,c,true),ri=ganancia(p,c,false);
      return '<article class="prod-card" style="cursor:default"><div class="top">'+
        (img?'<img class="im" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'<span class="im sin"></span>')+
        '<div class="tx"><b>'+esc(x.descripcion)+'</b><small>'+esc(x.categoria)+' · '+n+' pza · te costó '+mx(c)+' · lo vendes en '+mx(p)+'</small></div></div>'+
        '<div style="display:grid;gap:.6rem;grid-template-columns:1fr 1fr;margin-top:.75rem">'+celda("Cobrando $"+COBRO+" de envío",rc,false)+celda("Envío incluido",ri,true)+'</div>'+
        '<div class="cuenta-box" style="margin-top:.6rem">Entra '+mx(p)+(rc.g!==ri.g?' (+'+mx(COBRO)+' si cobras envío)':'')+' − costo '+mx(c)+' − moto '+mx(MOTO_REAL)+'.</div>'+
        '</article>';}).join("");
}
function recientesHTML(){
  return '<section class="b-card ani" id="s-recientes">'+
    '<span class="decision-tag d1">Lo último que entró</span>'+
    '<h2 class="tit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 7 12 3 4 7v10l8 4 8-4z"/><path d="M12 12v9M4 7l8 5 8-5"/></svg> Recién llegados</h2>'+
    '<p class="sub">Lo que diste de alta en los últimos 30 días, con la cuenta de cada pieza en los dos modelos: <b>cobrando el envío aparte</b> o <b>con el envío incluido en el precio</b>. Así se ve cuánto cuesta de verdad anunciar "envío gratis".</p>'+
    '<div class="ctrl-bar"><span>Lo que cobra el moto:</span><span class="inp-pill">$<input id="rec-moto" type="number" step="5" min="0" value="'+MOTO_REAL+'"></span>'+

/* Las tres pildoras dependen del motomandado. Se generan aqui, en su propia
   funcion, para poder REGENERARLAS cuando cambia el campo de envio. Antes se
   calculaban una sola vez al dibujar la tarjeta: si cambiabas el envio, la
   pildora "Sin perder" seguia mostrando el precio piso viejo mientras la
   cuenta de abajo ya usaba el nuevo. Tocarla te dejaba por debajo del costo. */
function pillasHTML(x,cu){
  var op=[["Sin perder",a10(cu+MOTO)],["Ganas $50",a10(cu+MOTO+50)],["Mitad",a10(x.precio/2)]],vis={},u=[];
  op.forEach(function(o){if(vis[o[1]])return;vis[o[1]]=1;u.push(o);});
  return '<div class="precios-opt" style="grid-template-columns:repeat('+u.length+',1fr)">'+u.map(function(o){
    return '<button class="po-btn" data-act="p" data-v="'+o[1]+'"><span>'+o[0]+'</span><b class="mono">'+mx(o[1])+"</b></button>";}).join("")+"</div>";
}

function pcHTML(x,i){
  var cu=costoU(x),img=FOTOS[norm(x.descripcion)];
  return '<article class="prod-card" data-i="'+i+'">'+
    '<div class="top">'+
      (img?'<img class="im" src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()">':'<span class="im sin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.4"/><path d="m21 15-5-5L5 19"/></svg></span>')+
      '<div class="tx"><b>'+esc(x.descripcion)+"</b><small>"+esc(x.categoria)+" · "+x.piezas+" pza · te costó "+mx(cu)+" c/u</small></div>"+
      '<button class="chk-box" data-act="tog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg></button>'+
    "</div>"+
    '<div class="tags"><span class="tg cong">'+mx(x.capital)+' congelados</span><span class="tg dias">'+dias(x.dias)+"</span></div>"+
    pillasHTML(x,cu)+
    '<div class="libre-input">o pon tu precio: <span class="inp-pill">$<input data-act="in" type="number" step="10" min="0" value="'+a10(cu+MOTO)+'"></span></div>'+
    '<div class="cuenta-box" data-f="1">Toca la palomita para incluirlo en el plan.</div>'+
    '<button class="btn-help" data-act="porque" style="margin-top:0">¿Como salio este precio?</button></article>';
}

function render(card,i,x){
  if(!x)return;
  var on=sel[i]!=null&&sel[i]>0;card.classList.toggle("on",on);
  var p=num(card.querySelector("[data-act=in]").value),cu=costoU(x);
  var po=card.querySelector(".precios-opt");if(po)po.outerHTML=pillasHTML(x,cu);
  card.querySelectorAll(".po-btn").forEach(function(o){o.classList.toggle("on",num(o.getAttribute("data-v"))===p);});
  var neto=(p-MOTO)*x.piezas,dif=neto-x.capital,porPza=p-MOTO-cu;
  card.querySelector("[data-f]").innerHTML=on
    ? "<b>Si vendes una:</b> entra "+mx(p)+" − envío "+mx(MOTO)+" − costo "+mx(cu)+" = "+
      (porPza>=0?'<b class="bien">+'+mx(porPza)+"</b>":'<b class="mal">'+mx(porPza)+"</b>")+" libre.<br>"+
      "<b>Si salen las "+x.piezas+":</b> recuperas <b class='mono'>"+mx(neto)+"</b> de "+mx(x.capital)+" · "+
      (dif>=0?'<b class="bien">+'+mx(dif)+"</b>":'te faltan <b class="mal">'+mx(-dif)+"</b>")
    : "Toca la palomita para incluirlo en el plan.";
}

function explicarProducto(x,precio){

    "<p>Lleva <b>"+dias(x.dias)+"</b> parado y tienes <b>"+x.piezas+" pieza"+(x.piezas===1?"":"s")+"</b>. Asi sale la cuenta del remate.</p>"+
    desglose("Si vendes una pieza a "+mx(precio),
      [{et:"Precio de remate",sub:"lo que te paga el cliente",v:precio,signo:"+"},
       {et:"Motomandado",sub:"sale de tu bolsa en cada entrega",v:MOTO,signo:"-"},
       {et:"Lo que te costo",sub:"ya puesto aqui",v:cu,signo:"-"}],
      {et:porPza>=0?"Te queda":"Pierdes",sub:"por cada pieza",v:porPza},
      "Tu <b>precio piso</b> es "+mx(cu+MOTO)+". Debajo de ahi pagas por regalar mercancia, salvo que el cliente recoja.")+
    desglose("Si salen las "+x.piezas+" piezas",
      [{et:"Entra en total",sub:x.piezas+" x "+mx(precio),v:precio*x.piezas,signo:"+"},
       {et:"Envios",sub:x.piezas+" x "+mx(MOTO),v:MOTO*x.piezas,signo:"-"}],

             :"Recuperas <b>"+mx(-dif)+" menos</b> de lo que pagaste. <b>Eso esta bien</b> si lleva un año parado: un billete dormido no vale mas por esperar, y ese dinero libre puede comprar algo que si rota.")+
      "<br>Si los vendes <b>en paquete</b>, un solo viaje cubre varias piezas y esa resta del envio casi desaparece.")+
    '<button class="btn-action pri" data-cerrar="1">Entendido</button>');
}
function simular(){
  var out=$("sim-out");if(!out)return;
  var pr=num($("sim-precio").value),pz=Math.max(1,Math.round(num($("sim-piezas").value))||1);
  var fa=num($("sim-factor").value)||1.33,cat=$("sim-cat").value;
  if(!(pr>0)){out.innerHTML='<p class="sub" style="margin-top:1rem">Escribe el precio que ves en la plataforma y te hago la cuenta.</p>';return;}
  var cf=r2(pr*fa),inv=r2(cf*pz),piso=r2(cf+MOTO),sug=a10(cf*2),gana=r2(sug+10-cf-MOTO);
  var c=null;(D.rotacion||[]).forEach(function(x){if(x.categoria===cat)c=x;});
  var alerta="";
  if(c){
    var mal=c.piezas>0&&c.ventas>=3&&c.diasStock>c.diasVenta*2;
    alerta='<div class="aviso '+(mal?"warn":"ok")+'"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">'+
      (mal?'<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>':'<path d="m5 12 5 5L20 7"/>')+
      "</svg></span><div><b>"+esc(cat)+"</b>: normalmente se vende en <b>"+dias(c.diasVenta)+"</b>"+
      (c.piezas?", y hoy tienes <b>"+c.piezas+" piezas</b> que llevan <b>"+dias(c.diasStock)+"</b> paradas":", y hoy no tienes existencia")+". "+
      (mal?"<b>Piénsalo dos veces:</b> lo que ya tienes de esta categoría no se está moviendo. Meter más dinero aquí lo congela.":"Esta categoría está sana: tu stock está dentro de sus tiempos normales.")+
      "</div></div>";
  }
  out.innerHTML=desglose("Lo que de verdad te va a costar",
    [{et:"Precio en la plataforma",sub:pz+" pieza"+(pz===1?"":"s")+" × "+mx(pr),v:pr*pz,signo:"+"},
     {et:"Impuestos y envío",sub:"factor ×"+fa.toFixed(2),v:r2(inv-pr*pz),signo:"+"}],
    {et:"Te costará",sub:mx(cf)+" cada pieza",v:inv},
    "Ese es el dinero que sale de tu bolsa y se queda dormido hasta que vendas.")+
  '<div class="compara" style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr;margin-top:1rem">'+
    '<div class="rot-item" style="margin:0"><div class="lb" style="font-size:.72rem;font-weight:800;color:var(--gris);text-transform:uppercase">Tu precio piso</div>'+
    '<div class="mono" style="font-size:1.5rem;font-weight:800">'+mx(piso)+"</div>"+
    '<small style="color:var(--gris);font-weight:600">costo + envío. Debajo de aquí pierdes dinero.</small></div>'+
    '<div class="rot-item" style="margin:0;background:#ECFDF5;border-color:#A7F3D0"><div class="lb" style="font-size:.72rem;font-weight:800;color:var(--verde-deep);text-transform:uppercase">Véndelo en</div>'+
    '<div class="mono" style="font-size:1.5rem;font-weight:800;color:var(--verde-deep)">'+mx(sug)+"</div>"+
    '<small style="color:var(--gris);font-weight:600">te dejaría '+mx(gana)+" por pieza</small></div></div>"+
  veredicto(sug,piso,cf)+alerta;
}
/* Compara tu precio contra lo que cobra la competencia en Marketplace */
function veredicto(sug,piso,cf){
  var mer=num($("sim-mercado").value);
  if(!(mer>0)){
    return '<div class="aviso ok" style="background:#EFF6FF;border-color:#DBEAFE;color:#1E40AF"><span class="ic" style="background:var(--azul)">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>'+
      '<div><b>Búscalo en Marketplace y anota el precio aquí arriba.</b> El mercado manda sobre cualquier regla: si allá está más barato que tu precio sugerido, el sugerido no sirve.</div></div>';
  }
  var gana=r2(mer+10-cf-MOTO),margen=mer+10>0?Math.round(gana/(mer+10)*100):0;
  var tipo,txt;
  if(mer<=piso){tipo="warn";txt="<b>No lo compres.</b> La competencia lo vende en "+mx(mer)+" y a ti te costaría "+mx(piso)+" puesto y entregado. Venderías con pérdida desde el primer día.";}
  else if(mer<sug){tipo="warn";txt="<b>Se puede, pero con menos margen del que esperabas.</b> Tu sugerido era "+mx(sug)+" y el mercado está en "+mx(mer)+". Si te alineas al mercado te quedarían <b>"+mx(gana)+"</b> por pieza ("+margen+"% de margen). Decide si ese número te compensa el esfuerzo de la venta.";}
  else {tipo="ok";txt="<b>Buena oportunidad.</b> El mercado está en "+mx(mer)+", arriba de tu precio sugerido de "+mx(sug)+". Puedes ponerte un poco abajo de la competencia y aun así ganar <b>"+mx(gana)+"</b> por pieza.";}
  return '<div class="aviso '+tipo+'"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">'+
    (tipo==="warn"?'<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>':'<path d="m5 12 5 5L20 7"/>')+
    "</svg></span><div>"+txt+"</div></div>";
}
function verBarra(){
  var hay=Object.keys(sel).some(function(i){return sel[i]>0;});
  $("bot").classList.toggle("on",hay||seccion==="remate");
}
function total(){
  var V=viejos(),lib=0,cost=0,pz=0,n=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;n++;});
  $("bot-v").textContent=mx(lib);
  $("bot-s").textContent=n?(pz+" piezas · "+n+" productos · pagaste "+mx(cost)):"Selecciona mercancía a rematar";
  $("b-plan").disabled=!n;
  verBarra();
}

function cablearChart(){
  var ch=$("chart");if(!ch)return;
  ch.addEventListener("mouseover",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    var m=MESES[Number(p.getAttribute("data-i"))];if(!m)return;
    var tip=$("tip"),r=ch.getBoundingClientRect(),pr=p.getBoundingClientRect();
    tip.textContent=m.label+" · "+mx(m.total)+(m.cantidad?" · "+m.cantidad+" pzas":"");
    tip.style.left=(pr.left-r.left+pr.width/2)+"px";tip.style.top=(pr.top-r.top)+"px";
    tip.classList.add("on");p.classList.add("on");
  });
  ch.addEventListener("mouseout",function(e){
    var p=e.target.closest(".pt");if(!p)return;
    $("tip").classList.remove("on");p.classList.remove("on");
  });
}
function espiar(){
  var obs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var id=en.target.id.replace("s-","");
      if(id===seccion)return;seccion=id;
      document.querySelectorAll("[data-ir]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-ir")===id);});
      verBarra();
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  SECS.forEach(function(s){var el=$("s-"+s[0]);if(el)obs.observe(el);});
}

document.addEventListener("click",function(e){
  var ir=e.target.closest("[data-ir]");
  if(ir){var el=$("s-"+ir.getAttribute("data-ir"));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
  var ex=e.target.closest("[data-exp]");if(ex){abrir(ex.getAttribute("data-exp"));return;}
  var od=e.target.closest("[data-ord]");if(od){orden=od.getAttribute("data-ord");sel={};verTodo=false;pintar();return;}
  if(e.target.closest("#vermas")){verTodo=true;pintar();return;}
  var card=e.target.closest(".prod-card");if(!card)return;
  var b=e.target.closest("[data-act]");if(!b)return;
  var i=card.getAttribute("data-i"),x=viejos()[i],act=b.getAttribute("data-act");
  if(act==="tog"){if(sel[i])delete sel[i];else sel[i]=num(card.querySelector("[data-act=in]").value)||a10(costoU(x)+MOTO);}
  if(act==="porque"){explicarProducto(x,num(card.querySelector("[data-act=in]").value));return;}
  if(act==="p"){var v=num(b.getAttribute("data-v"));card.querySelector("[data-act=in]").value=v;sel[i]=v;}
  render(card,i,x);total();
});
document.addEventListener("input",function(e){
  if(e.target.id==="moto"){MOTO=num(e.target.value);
    document.querySelectorAll(".prod-card").forEach(function(c){render(c,c.getAttribute("data-i"),viejos()[c.getAttribute("data-i")]);});total();return;}
  var b=e.target.closest("[data-act=in]");if(!b)return;
  var card=b.closest(".prod-card"),i=card.getAttribute("data-i");
  sel[i]=num(b.value);render(card,i,viejos()[i]);total();
});
$("b-limpiar").addEventListener("click",function(){
  sel={};document.querySelectorAll(".prod-card").forEach(function(c){c.classList.remove("on");
    c.querySelector("[data-f]").textContent="Toca la palomita para incluirlo en el plan.";
    c.querySelectorAll(".po-btn").forEach(function(o){o.classList.remove("on");});});
  total();});

$("b-plan").addEventListener("click",function(){
  var V=viejos(),lin=[],lib=0,cost=0,pz=0;
  Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
    lib+=(sel[i]-MOTO)*x.piezas;cost+=x.capital;pz+=x.piezas;
    lin.push("• "+x.descripcion+" — "+x.piezas+" pza · REMATE "+mx(sel[i])+" (antes "+mx(x.precio)+")");});
  var txt="REMATE KIOSKO\n"+pz+" piezas · recuperas "+mx(lib)+" ya con el envío descontado\n\n"+lin.join("\n");
  abrirHTML("<h3>Tu plan de remate</h3>"+
    "<p>Vas a mover <b>"+pz+" piezas</b> paradas hace meses y a recuperar <b>"+mx(lib)+"</b> limpios, ya descontado el envío de "+mx(MOTO)+" por pieza. Te costaron "+mx(cost)+".</p>"+
    (lib<cost?"<p>Recuperas menos de lo que pagaste. <b>Eso está bien</b> si llevan un año sin moverse: un billete dormido no vale más por esperar.</p>":"")+
    "<p><b>Véndelas en paquete.</b> El envío cuesta lo mismo lleves una pieza o tres: es por viaje. Ofrece lotes o pide que lo recojan y esa resta desaparece.</p>"+
    '<textarea readonly id="plan-txt">'+esc(txt)+"</textarea>"+
    '<p class="sub" style="margin-top:1rem"><b>Aplicar el remate</b> cambia el precio en tu hoja, en todas las piezas sin vender de esos productos, y se refleja solo en la app y en tu catalogo. El precio anterior queda guardado: se puede deshacer.</p>'+
    '<div style="display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap"><button class="btn-action pri" id="aplicar">Aplicar remate a mi hoja</button>'+
    '<button class="btn-action gh" id="cp">Solo copiar lista</button><button class="btn-action gh" data-cerrar="1">Cerrar</button></div>'+
    '<div id="res-remate" class="sub" style="margin-top:1rem"></div>');
  $("aplicar").addEventListener("click",function(){
    var b=this;b.disabled=true;b.textContent="Aplicando…";
    var items=[];
    Object.keys(sel).forEach(function(i){var x=V[i];if(!x||!(sel[i]>0))return;
      items.push({descripcion:x.descripcion,categoria:x.categoria,precio:sel[i]});});
    api("aplicarRemate",null,{remate:{usuario:"Alex",items:items}},45000).then(function(r){
      if(!r||!r.success)throw new Error((r&&r.error)||"No se pudo aplicar");
      $("res-remate").innerHTML="<b>Listo: "+r.piezas+" pieza"+(r.piezas===1?"":"s")+" con precio nuevo.</b><br>"+
        r.productos.map(function(p){return esc(p.descripcion)+" · "+p.piezas+" pza · "+mx(p.antes)+" → <b>"+mx(p.ahora)+"</b>";}).join("<br>")+
        (r.verificado?"":"<br>"+esc(r.aviso||""));
      b.textContent="Aplicado";
    }).catch(function(e){$("res-remate").innerHTML='<b style="color:var(--rojo)">'+esc(e.message)+"</b>";
      b.disabled=false;b.textContent="Aplicar remate a mi hoja";});
  });
  $("cp").addEventListener("click",function(){var t=$("plan-txt");t.removeAttribute("readonly");t.select();
    try{document.execCommand("copy");}catch(e){}t.setAttribute("readonly","readonly");this.textContent="Copiado";});
});

var EXP={
  capital:["Capital congelado","Es el dinero que ya pagaste y sigue en cajas. No lo perdiste, pero tampoco lo tienes: no puede comprar nada nuevo hasta que se venda.<br><br>La medida que usan los negocios es cuántos <b>meses de ganancia</b> tienes congelados. Uno o dos es normal. Cinco o más significa que compraste más rápido de lo que vendes."],
  remate:["¿Vender al costo es perder?","No. Perder es que el dinero siga parado un año más.<br><br>Una pieza que compraste en $150 y no sale a $300 no vale $300: vale lo que alguien pague hoy. Si la rematas en $180 recuperas tu dinero, compras algo que sí rota y ese billete da la vuelta tres veces al año.<br><br>El que empieza se aferra al precio que <b>quería</b> ganar. El que lleva años mira el calendario, no el precio."],
  pildoras:["Los tres precios que te propongo","<b>Sin perder</b> = costo del producto + envío. Es tu piso real: debajo de ahí pagas por regalar mercancía.<br><br><b>Ganas $50</b> = ese piso más cincuenta pesos limpios por pieza.<br><br><b>Mitad de precio</b> = la mitad de lo que pides hoy. No sale de tus costos, sale de la cabeza del comprador: “50% de descuento” se entiende sin pensar."],
  envio:["El envío te cuesta más de lo que crees","De tus 461 ventas, <b>225 se entregaron a domicilio</b> y en ellas pagaste <b>$10,485</b> de motomandado.<br><br>Cobraste el extra en <b>30 de esas 225</b>: el 13%. Recuperaste $330. <b>Absorbiste $10,155.</b><br><br>Además el moto no siempre cuesta $35: hay 16 entregas de $100 y 10 de $80. Tu promedio real es <b>$47</b>.<br><br>Si empiezas a cobrarlo siempre, este número mejora solo y sin invertir un peso."],
  rotacion:["Rotación","Cuántos días pasan, en promedio, desde que compras una pieza hasta que se vende.<br><br>Lo importante es compararlo contra <b>cuánto lleva parado lo que tienes hoy</b>. Si una categoría se vende en 90 días pero tu stock lleva 340, esas piezas concretas son las que no salen. Esas son las que rematas."],
  margen:["Margen","De cada $100 que entran, cuántos te quedas después de pagar el producto y el envío.<br><br>El margen no es la ganancia. Puedes tener margen alto y ganar poco si vendes pocas piezas: fíjate siempre en las dos columnas juntas."]
};
function abrir(k){
  var e=EXP[k];if(!e)return;
  var extra="";
  if(k==="margen"){
    var mar=(D.margen||[]),mejor=mar.slice().sort(function(a,b){return b.utilidad-a.utilidad;})[0];
    extra=desglose("Así se calcula una venta tuya",
      [{et:"Precio de venta",sub:"lo que te paga el cliente",v:280,signo:"+"},
       {et:"Cobro a domicilio",sub:"lo que le cobras por el envío",v:10,signo:"+"},
       {et:"Costo del producto",sub:"lo que te costó puesto aquí",v:136.77,signo:"-"},
       {et:"Motomandado",sub:"lo que le pagas al repartidor",v:35,signo:"-"}],
      {et:"Tu ganancia",sub:"esto sí es tuyo",v:118.23},
      "Ejemplo real: tu Kemei KM-1419. Entraron <b>$290</b> y salieron <b>$171.77</b>, así que te quedan <b>$118.23</b>.<br>"+
      '<span class="dg-pct">Margen = 118.23 ÷ 290 = 41%</span><br>'+
      "El <b>margen</b> es ese porcentaje. La <b>ganancia acumulada</b> es esta misma cuenta sumada en todas tus ventas de la categoría"+
      (mejor?": en <b>"+esc(mejor.categoria)+"</b> llevas <b>"+mx(mejor.utilidad)+"</b> juntando "+mejor.ventas+" ventas.":"."));
  }
  if(k==="capital"){
    var pm=(D.resumen||{}).utilidad/meses();
    extra=desglose("Cuánto de tu ganancia está congelada",
      [{et:"Dinero en cajas",sub:"ya lo pagaste, no lo tienes",v:D.capitalTotal,signo:"+"},
       {et:"Ganas al mes",sub:"promedio de "+meses()+" meses",v:pm,signo:"-"}],
      {et:"Meses congelados",sub:"lo primero entre lo segundo",v:0},
      "Se divide uno entre otro: <b>"+mx(D.capitalTotal)+" ÷ "+mx(pm)+" = "+
      (pm>0?(D.capitalTotal/pm).toFixed(1):"—")+" meses</b>.<br>Es cuánto tiempo tendrías que trabajar para volver a juntar el dinero que hoy está dormido en cajas.");
    extra=extra.replace(/<div class="val">\$0<\/div>/,'<div class="val">'+(pm>0?(D.capitalTotal/pm).toFixed(1):"—")+" meses</div>");
  }
  abrirHTML("<h3>"+e[0]+"</h3><p>"+e[1]+"</p>"+extra+'<button class="btn-action pri" data-cerrar="1">Entendido</button>');
}
function abrirHTML(html){$("mo-in").innerHTML=html;$("mo").classList.add("on");}
$("mo").addEventListener("click",function(e){if(e.target===this||e.target.closest("[data-cerrar]"))this.classList.remove("on");});

/* Ya validaste el PIN en esta sesion del navegador: pasa directo. */
if(sesionViva())entrar();
})();
</script>
