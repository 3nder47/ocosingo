<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<title>Kiosko · producto</title>
<meta name="kiosko-version" content="v7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tono:#8A6A1F;        /* color extraído de la foto; el JS lo reescribe */
  --tono-hondo:#4A3910;  /* el mismo, más profundo, para el pie */
  --sobre:#FFFFFF;       /* el JS lo cambia a oscuro si el fondo es claro */
  --suave:rgba(255,255,255,.72);
  --tenue:rgba(255,255,255,.48);
  --vidrio:rgba(255,255,255,.16);
  --vidrio2:rgba(255,255,255,.1);
  --nav-bg:rgba(10,14,19,.34);
  --pt:rgba(255,255,255,.38);
  --acento:#FFD9A8;      /* lo que debe resaltar: ahorro, etiquetas de texto */
  --cta-bg:#FFFFFF; --cta-ink:#0E1116;
  --verde:#0B9A5E;
  --out:cubic-bezier(.22,1,.36,1);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tono-hondo);color:var(--sobre);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background-color 700ms ease-out}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.press{transition:transform 160ms var(--out)}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}

/* ---------- lienzo: el color de la foto baña toda la pantalla ---------- */
.hoja{min-height:100dvh;position:relative;
  background:linear-gradient(180deg,var(--tono) 0%,var(--tono) 38%,var(--tono-hondo) 100%);
  transition:background-image 700ms ease-out;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- foto ---------- */
.foto{position:relative;aspect-ratio:1;overflow:hidden;background:var(--tono)}
.foto .cinta{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.foto .cinta::-webkit-scrollbar{display:none}
.foto .toma{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);
  transition:opacity 520ms ease-out,transform 900ms var(--out)}
.foto img.ok{opacity:1;transform:none}
/* la foto se funde con el color en vez de cortarse en seco */
.fundido{position:absolute;left:0;right:0;bottom:-1px;height:28%;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--tono) 30%,transparent) 48%,color-mix(in srgb,var(--tono) 82%,transparent) 78%,var(--tono) 100%)}
@supports not (background:color-mix(in srgb,red,blue)){
  .fundido{background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0) 45%,var(--tono) 100%)}
}
.nav{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.nav button{width:38px;height:38px;border-radius:50%;background:var(--nav-bg);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center}
.nav svg{width:17px;height:17px;stroke:var(--sobre);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.puntos{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px;z-index:3}
.puntos i{width:5px;height:5px;border-radius:999px;background:var(--pt);box-shadow:0 1px 3px rgba(10,14,19,.18);transition:width 260ms var(--out),background 200ms ease-out}
.puntos i.on{width:17px;background:var(--sobre)}

/* ---------- etiquetas de relevancia: lo que pediste ---------- */
.etiquetas{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:14px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;z-index:3}
.et{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:800;letter-spacing:.01em;
  box-shadow:0 4px 14px rgba(10,14,19,.28)}
.et svg{width:13px;height:13px;fill:currentColor}
.et.oferta{background:#E0342B;color:#fff}
.et.ultima{background:#F5A524;color:#231400}
.et.envio{background:#0FA968;color:#fff}
.et.nuevo{background:var(--sobre);color:var(--tono-hondo)}

/* ---------- cuerpo ---------- */
.cuerpo{padding:0 22px;margin-top:-6px;position:relative;z-index:2}
.sobrenombre{font-size:15px;font-weight:600;color:var(--suave);margin-bottom:7px}
h1{font-size:34px;line-height:1.08;letter-spacing:-.035em;font-weight:800;margin:0}
.precio{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-top:15px}
.precio b{font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1}
.precio s{color:var(--tenue);font-size:17px}
.precio .baja{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
.ahorro{color:var(--acento);font-weight:700;font-size:14px;margin-top:7px}

/* datos duros, como el TOTAL TIME / YIELD de la referencia */
.datos{display:flex;gap:0;margin-top:22px}
.dato{flex:1;padding-right:16px}
.dato+.dato{padding-left:18px;border-left:1px solid var(--vidrio)}
.dato span{display:block;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
.dato b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:4px}

/* la tarjeta de venta cruzada, como READ THE STORY */
.cruzada{display:flex;align-items:center;gap:13px;width:100%;margin-top:22px;text-align:left;
  background:var(--vidrio);border-radius:17px;padding:12px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cruzada .mini{display:block;width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none;background:var(--vidrio2)}
.cruzada .mini img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 340ms ease-out}
.cruzada .mini img.ok{opacity:1}
.cruzada .tx{flex:1;min-width:0}
.cruzada span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acento)}
.cruzada b{display:block;font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cruzada .flecha{flex:none;opacity:.6}
.cruzada .flecha svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.acciones{display:flex;gap:9px;margin-top:11px}
.acciones button{flex:1;background:var(--vidrio);border-radius:15px;padding:13px 8px;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.acciones svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.dice{margin-top:22px;font-size:15.5px;line-height:1.55;color:var(--suave)}
.dice b{color:var(--sobre);font-weight:700}

.mas-de{margin-top:30px}
.mas-de h2{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin:0 0 13px}
.fila{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 4px}
.fila::-webkit-scrollbar{display:none}
.vecino{flex:none;width:132px;text-align:left}
.vecino .ph{display:block;aspect-ratio:1;border-radius:15px;overflow:hidden;background:var(--vidrio2);position:relative}
.vecino .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 340ms ease-out}
.vecino .ph img.ok{opacity:1}
.vecino .mini-et{position:absolute;top:7px;left:7px;border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:800}
.vecino .nm{font-size:12.5px;font-weight:600;margin-top:9px;line-height:1.32;color:var(--sobre);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.vecino .pp{color:var(--suave)}
.vecino .pp{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-top:3px}

/* barra fija */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:13px 18px calc(13px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--tono-hondo) 92%,transparent) 32%,var(--tono-hondo) 68%);
  max-width:560px;margin:0 auto}
@supports not (background:color-mix(in srgb,red,blue)){.barra{background:var(--tono-hondo)}}
.barra .pp{flex:none}
.barra .pp span{display:block;font-size:10.5px;font-weight:700;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
.barra .pp b{font-size:21px;font-weight:800;letter-spacing:-.03em}
.barra .cta{flex:1;background:var(--cta-bg);color:var(--cta-ink);border-radius:999px;padding:15px;font-weight:800;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(10,14,19,.14)}
.barra .cta svg{width:18px;height:18px;fill:currentColor;flex:none}

.cargando{min-height:100dvh;display:grid;place-items:center;color:var(--tenue);font-size:14px;padding:30px;text-align:center}
@media (min-width:640px){.hoja{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<canvas id="lienzo" width="40" height="40" style="display:none"></canvas>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var API=(window.OC_CONFIG&&window.OC_CONFIG.API_URL)||"";
var DIA=864e5,HOY=Date.now(),MOTO=35;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function mx(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-MX");}
function pelar(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function slug(s){return pelar(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* ============================================================
   COLOR DE LA FOTO
   Lee la imagen en un lienzo chico y saca el tono que manda.
   Si Drive no deja leerla, cae al color de la categoría.
   ============================================================ */
var LIENZO=document.getElementById("lienzo"),CTX=LIENZO.getContext("2d",{willReadFrequently:true});
var CACHE={},CORS_OK=null;
/* ============================================================
   COLOR POR CATEGORÍA — elegidos a mano, no calculados.
   [tono, saturación, luminosidad]. Todos oscuros para que el
   texto blanco siempre se lea, y separados entre sí para que
   al cambiar de categoría se note el cambio.
   Para mover uno, cambia su primer número (el tono):
   0 rojo · 20 terracota · 42 dorado · 95 olivo · 150 verde
   172 verde azulado · 205 azul acero · 222 azul noche
   268 índigo · 300 ciruela · 340 vino
   ============================================================ */
var PALETA={
  "accesorios de celular":   [42,58,31],   // dorado, el de tus capturas
  "audifonos":               [222,52,30],  // azul noche
  "smartwatch y relojes":    [268,42,31],  // índigo
  "bocinas y altavoces":     [340,50,32],  // vino
  "cuidado personal":        [172,44,28],  // verde azulado
  "herramientas":            [20,55,30],   // terracota
  "bolsos y accesorios":     [300,34,31],  // ciruela
  "mesas y sillas plegables":[150,38,27],  // verde bosque
  "tv y electronica":        [205,55,29],  // azul acero
  "hogar":                   [95,40,28],   // olivo
  "incubadoras":             [12,52,30],   // ladrillo
  "joyeria":                 [50,48,30]    // ámbar viejo
};
var SOBRANTES=[[258,40,31],[185,46,28],[330,42,31],[75,42,28],[230,48,30],[15,50,30]],asignados={},nSob=0;
function porCategoria(cat){
  var k=pelar(cat),c=PALETA[k];
  if(!c){                      // categoría que no está en la lista: toma una libre y se queda con ella
    if(!asignados[k])asignados[k]=SOBRANTES[(nSob++)%SOBRANTES.length];
    c=asignados[k];
  }
  return {h:c[0],s:c[1],l:c[2]};
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx1=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx1+mn)/2,d=mx1-mn;
  if(d){s=l>.5?d/(2-mx1-mn):d/(mx1+mn);
    h=mx1===r?((g-b)/d+(g<b?6:0)):mx1===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
  return {h:h,s:s*100,l:l*100};
}
function delaFoto(url){
  return new Promise(function(ok,mal){
    if(CACHE[url])return ok(CACHE[url]);
    var im=new Image();im.crossOrigin="anonymous";
    im.onload=function(){
      try{
        CTX.clearRect(0,0,40,40);CTX.drawImage(im,0,0,40,40);
        var d=CTX.getImageData(0,0,40,40).data;
        // se queda con los píxeles que de verdad tienen color, no con el fondo lavado
        var cubos={},mejor=null,tot=0;
        for(var i=0;i<d.length;i+=4){
          if(d[i+3]<200)continue;
          var c=rgb2hsl(d[i],d[i+1],d[i+2]);
          if(c.s<18||c.l<12||c.l>88)continue;      // gris, negro o blanco: no manda
          var k=Math.round(c.h/18)*18;
          if(!cubos[k])cubos[k]={n:0,h:0,s:0,l:0};
          var b=cubos[k];b.n++;b.h+=c.h;b.s+=c.s;b.l+=c.l;tot++;
        }
        Object.keys(cubos).forEach(function(k){var b=cubos[k];if(!mejor||b.n>mejor.n)mejor=b;});
        CORS_OK=true;
        var res;
        if(mejor&&tot>=40){
          res={via:"color",h:mejor.h/mejor.n,s:Math.min(72,Math.max(30,mejor.s/mejor.n)),l:32};
        }else{
          // Foto neutra (caja blanca, producto negro). No hay color que mandar,
          // pero sí temperatura: se mide cuánto tira a cálida o a fría y se
          // construye un tono propio. Así ninguna foto queda sin su color.
          var R2=0,G2=0,B2=0,n2=0;
          for(var j=0;j<d.length;j+=4){if(d[j+3]<200)continue;R2+=d[j];G2+=d[j+1];B2+=d[j+2];n2++;}
          if(!n2)return mal(new Error("foto vacía"));
          var c2=rgb2hsl(R2/n2,G2/n2,B2/n2);
          res={via:"tono",h:c2.h,s:Math.min(38,Math.max(16,c2.s*2.6+12)),l:30};
        }
        CACHE[url]=res;ok(res);
      }catch(e){CORS_OK=false;mal(e);}      // Drive bloqueó la lectura
    };
    im.onerror=function(){mal(new Error("no cargó"));};
    im.src=url;
  });
}
/* Brillo real percibido de un color HSL (0 negro … 1 blanco). */
function hsl2rgb(h,s,l){
  s/=100;l/=100;
  var k=function(n){return (n+h/30)%12;},a=s*Math.min(l,1-l);
  var f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));};
  return [f(0),f(8),f(4)];
}
function brillo(h,s,l){
  return hsl2rgb(h,s,l).map(function(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);})
    .reduce(function(a,v,i){return a+[0.2126,0.7152,0.0722][i]*v;},0);
}
/* Contraste entre dos brillos (1 = nada, 21 = máximo). 4.5 es el mínimo legible. */
function contraste(a,b){var x=Math.max(a,b),y=Math.min(a,b);return (x+0.05)/(y+0.05);}
var L_BLANCO=1, L_OSCURO=brillo(0,0,5.5);
/* Pinta el fondo Y decide el color del texto.
   No usa un umbral fijo: prueba blanco y oscuro y se queda con el que más
   contraste dé. Si el color cae en tierra de nadie —un gris medio donde
   ninguno alcanza el mínimo legible— aclara u oscurece el fondo hasta que sí. */
/* #RRGGBB -> tono de fondo. Respeta el color de la foto; solo lo mete en un
   rango donde sirva de fondo: ni negro puro ni blanco puro. */
function hexATono(hex){
  var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex||""));
  if(!m)return null;
  var c=rgb2hsl(parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16));
  return {h:c.h,s:Math.max(8,Math.min(70,c.s)),l:Math.max(18,Math.min(92,c.l))};
}
/* El color guardado de la foto manda; si ese producto no tiene, su categoría. */
function tonoDe(p){
  return hexATono(COLORES[p.descripcion])||porCategoria(p.categoria);
}
function pintarTono(c){
  var r=document.documentElement.style,h=c.h.toFixed(0),sa=c.s.toFixed(0);
  var L=c.l,b,cB,cO,i=0;
  for(;;){
    b=brillo(c.h,c.s,L);
    cB=contraste(b,L_BLANCO);cO=contraste(b,L_OSCURO);
    if(Math.max(cB,cO)>=4.5||i++>=40)break;
    L+=(b>0.19?2:-2);
    L=Math.max(8,Math.min(94,L));
  }
  c={h:c.h,s:c.s,l:L};
  var claro=cO>cB;
  var hondo=claro?Math.max(64,c.l-9):Math.max(11,c.l-17);
  r.setProperty("--tono","hsl("+h+" "+sa+"% "+c.l+"%)");
  r.setProperty("--tono-hondo","hsl("+h+" "+(claro?Math.max(10,c.s-8):Math.min(70,c.s+6)).toFixed(0)+"% "+hondo+"%)");
  if(claro){
    r.setProperty("--sobre","#0E1116");
    r.setProperty("--suave","rgba(14,17,22,.70)");
    r.setProperty("--tenue","rgba(14,17,22,.46)");
    r.setProperty("--vidrio","rgba(14,17,22,.07)");
    r.setProperty("--vidrio2","rgba(14,17,22,.05)");
    r.setProperty("--nav-bg","rgba(255,255,255,.8)");
    r.setProperty("--pt","rgba(14,17,22,.22)");
    r.setProperty("--acento","hsl("+h+" 72% 33%)");      // el mismo tono, saturado y oscuro
    r.setProperty("--cta-bg","#0B9A5E");                  // el verde de siempre
    r.setProperty("--cta-ink","#FFFFFF");
  }else{
    r.setProperty("--sobre","#FFFFFF");
    r.setProperty("--suave","rgba(255,255,255,.72)");
    r.setProperty("--tenue","rgba(255,255,255,.48)");
    r.setProperty("--vidrio","rgba(255,255,255,.16)");
    r.setProperty("--vidrio2","rgba(255,255,255,.1)");
    r.setProperty("--nav-bg","rgba(10,14,19,.34)");
    r.setProperty("--pt","rgba(255,255,255,.38)");
    r.setProperty("--acento","hsl("+h+" 88% 82%)");
    r.setProperty("--cta-bg","#FFFFFF");
    r.setProperty("--cta-ink","#0E1116");
  }
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute("content","hsl("+h+" "+sa+"% "+c.l+"%)");
}

/* ---------- datos ---------- */
var TODO=[],actual=null,COLORES={};
function pedir(a){return fetch(API+"?accion="+a,{redirect:"follow"}).then(function(r){return r.text();})
  .then(function(t){var j=JSON.parse(t);if(!j.ok)throw new Error(j.error||"error");return j.data;});}
(API?pedir("catalogoTienda").catch(function(){return pedir("catalogoPublico");}):Promise.reject(new Error("Falta config.js")))
 .then(function(d){
   if(!d||!d.length)throw new Error("El catálogo vino vacío");
   TODO=d.map(function(p){
     p.antes=Number(p.antes)||0;p.precio=Number(p.precio)||0;
     p.baja=p.antes>p.precio?Math.round((1-p.precio/p.antes)*100):0;
     p.nuevo=p.agregado&&(HOY-Number(p.agregado))<30*DIA;
     p.ultima=p.piezas===1||p.ultima===true;
     p.fotos=[p.imagen].concat(p.extras||[]).filter(Boolean);
     p.slug=slug(p.descripcion);
     return p;
   });
   arrancar();
   // Los colores de las fotos llegan aparte. Si tardan o fallan, la pantalla
   // ya se pintó con el color de la categoría y luego se actualiza sola.
   if(API)pedir("colores").then(function(m){
     COLORES=m||{};
     if(actual)pintarTono(tonoDe(actual));
   }).catch(function(){});
 })
 .catch(function(e){
   document.getElementById("app").innerHTML='<div class="cargando"><div><b style="display:block;font-size:17px;color:#fff;margin-bottom:6px">No cargó el catálogo</b>'+esc(e.message)+'</div></div>';
 });
function porSlug(s){for(var i=0;i<TODO.length;i++)if(TODO[i].slug===s)return TODO[i];return null;}

/* Historial: vive solo en este teléfono, no se manda a ningún lado. */
var LLAVE="kiosko:vistos";
function leerVistos(){try{return JSON.parse(localStorage.getItem(LLAVE)||"[]");}catch(e){return [];}}
function guardarVisto(sl){
  try{
    var v=leerVistos().filter(function(x){return x!==sl;});
    v.unshift(sl);localStorage.setItem(LLAVE,JSON.stringify(v.slice(0,12)));
  }catch(e){}
}
function vistosAntes(p){
  return leerVistos().filter(function(sl){return sl!==p.slug;})
    .map(porSlug).filter(Boolean).slice(0,10);
}
function arrancar(){
  var s=decodeURIComponent((location.hash||"").replace("#",""));
  var p=porSlug(s);
  if(!p){   // sin liga: abre el más interesante, para poder verlo de una vez
    p=TODO.filter(function(x){return x.baja&&x.fotos.length;})[0]||
      TODO.filter(function(x){return x.fotos.length>1;})[0]||TODO[0];
  }
  ver(p,true);
}
window.addEventListener("popstate",function(){
  var p=porSlug(decodeURIComponent((location.hash||"").replace("#","")));
  if(p&&p!==actual)ver(p,true);
});

/* ---------- etiquetas de relevancia ---------- */
var I_FUEGO='<svg viewBox="0 0 24 24"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.5.5-2.5S6 11 6 14a6 6 0 0 0 12 0c0-6-6-12-6-12z"/></svg>';
var I_RELOJ='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6V6h-2v7.4l5 3 1-1.7-4-2.1z"/></svg>';
var I_MOTO='<svg viewBox="0 0 24 24"><path d="M5 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm14 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM4 8h6l2 4h5l2 2h-3l-2-2H9L7 8H4z"/></svg>';
function etiquetas(p){
  var e=[];
  if(p.baja)e.push('<span class="et oferta">'+I_FUEGO+'Oferta −'+p.baja+'%</span>');
  if(p.ultima)e.push('<span class="et ultima">'+I_RELOJ+'Última pieza</span>');
  else if(p.nuevo)e.push('<span class="et nuevo">Recién llegado</span>');
  if(p.precio>=600)e.push('<span class="et envio">'+I_MOTO+'Envío gratis</span>');
  return e.length?'<div class="etiquetas">'+e.join("")+'</div>':"";
}
function vecinos(p){
  var m=TODO.filter(function(x){return x.slug!==p.slug&&x.categoria===p.categoria;});
  var cerca=m.filter(function(x){return Math.abs(x.precio-p.precio)<=Math.max(150,p.precio*.6);});
  var l=(cerca.length>=4?cerca:m).slice(0,10);
  if(l.length<4)l=l.concat(TODO.filter(function(x){return x.slug!==p.slug&&l.indexOf(x)<0&&x.baja;}).slice(0,6));
  if(l.length<4)l=l.concat(TODO.filter(function(x){return x.slug!==p.slug&&l.indexOf(x)<0;}).slice(0,6));
  var vis={},u=[];l.forEach(function(x){if(!vis[x.slug]){vis[x.slug]=1;u.push(x);}});
  return u.slice(0,10);
}
function wa(p){
  return "https://wa.me/"+(p.wa||"")+"?text="+encodeURIComponent("Hola, me interesa "+p.descripcion+" de "+mx(p.precio)+".\n"+location.origin+location.pathname+"#"+p.slug);
}
var SVG_WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1s-.7 1-.9 1.2c-.2.2-.3.2-.6.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5S9.4 7.4 9.2 7c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.6.9 3.5.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>';

function carrusel(titulo,l){
  return '<div class="mas-de"><h2>'+esc(titulo)+'</h2><div class="fila">'+l.map(function(x){
    var et=x.baja?'<span class="mini-et" style="background:#E0342B;color:#fff">−'+x.baja+'%</span>':
           x.ultima?'<span class="mini-et" style="background:#F5A524;color:#231400">Última</span>':"";
    return '<button class="vecino press" data-s="'+x.slug+'"><span class="ph">'+et+
      (x.imagen?'<img src="'+esc(x.imagen)+'" alt="" loading="lazy" onload="this.classList.add(\'ok\')" onerror="this.remove()">':"")+'</span>'+
      '<span class="nm">'+esc(x.descripcion)+'</span><span class="pp">'+mx(x.precio)+'</span></button>';}).join("")+'</div></div>';
}
function ver(p,sinHash){
  actual=p;
  var fotos=p.fotos.length?p.fotos:[""],vs=vecinos(p),sug=vs[0],antes=vistosAntes(p);
  guardarVisto(p.slug);
  // El color guardado de la foto manda; si no lo tiene, el de su categoría.
  pintarTono(tonoDe(p));

  document.getElementById("app").innerHTML=
  '<div class="hoja"><div class="foto">'+
    '<div class="nav"><button class="press" id="atras" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>'+
      '<button class="press" id="compartir" aria-label="Compartir"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M12 3v13M8 7l4-4 4 4"/></svg></button></div>'+
    etiquetas(p)+
    '<div class="cinta" id="cinta">'+fotos.map(function(u,i){
      return '<div class="toma">'+(u?'<img src="'+esc(u)+'" alt="'+esc(p.descripcion)+'" loading="'+(i?"lazy":"eager")+'" onload="this.classList.add(\'ok\')" onerror="this.remove()">':"")+'</div>';}).join("")+'</div>'+
    (fotos.length>1?'<div class="puntos" id="puntos">'+fotos.map(function(_,i){return '<i'+(i?"":' class="on"')+'></i>';}).join("")+'</div>':"")+
    '<div class="fundido"></div></div>'+

  '<div class="cuerpo">'+
    '<div class="sobrenombre">'+esc(p.categoria)+'</div>'+
    '<h1>'+esc(p.descripcion)+'</h1>'+
    '<div class="precio"><b>'+mx(p.precio)+'</b>'+(p.baja?'<s>'+mx(p.antes)+'</s><span class="baja">−'+p.baja+'%</span>':"")+'</div>'+
    (p.baja?'<div class="ahorro">Te ahorras '+mx(p.antes-p.precio)+'</div>':"")+

    '<div class="datos">'+
      '<div class="dato"><span>Entrega</span><b>Hoy mismo</b></div>'+
      '<div class="dato"><span>Existencia</span><b>'+(p.ultima?"1 pieza":(p.piezas||1)+" piezas")+'</b></div>'+
      '<div class="dato"><span>Pago</span><b>Al recibir</b></div>'+
    '</div>'+

    (sug?'<button class="cruzada press" data-s="'+sug.slug+'">'+
      '<span class="mini">'+(sug.imagen?'<img src="'+esc(sug.imagen)+'" alt="" onload="this.classList.add(\'ok\')" onerror="this.remove()">':"")+'</span>'+
      '<span class="tx"><span>Llévate los dos, un solo envío</span><b>'+esc(sug.descripcion)+'</b></span>'+
      '<span class="flecha"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></button>':"")+

    '<div class="acciones">'+
      '<button class="press" id="b-compartir"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M12 3v13M8 7l4-4 4 4"/></svg>Compartir</button>'+
      '<button class="press" id="b-dudas"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-3.5-.7L3 21l1.7-5a8.3 8.3 0 0 1-.7-3.5 8.4 8.4 0 0 1 8.5-9 8.4 8.4 0 0 1 8.5 8z"/></svg>Preguntar</button>'+
    '</div>'+

    '<p class="dice">'+esc(p.descripcion)+(p.ultima?' Queda <b>una sola pieza</b>.':(p.piezas>1?' Quedan <b>'+p.piezas+' piezas</b>.':""))+
      ' Te llega <b>hoy mismo</b> en Ocosingo y pagas cuando lo tengas en la mano.'+
      (p.precio>=600?' El envío va incluido.':' El motomandado cuesta lo mismo lleve una pieza o tres.')+'</p>'+

    (vs.length?carrusel("Más de "+p.categoria,vs):"")+
    (antes.length?carrusel("Lo que viste antes",antes):"")+
  '</div>'+

  '<div class="barra"><div class="pp"><span>Precio</span><b>'+mx(p.precio)+'</b></div>'+
    '<a class="cta press" href="'+esc(wa(p))+'" target="_blank" rel="noopener">'+SVG_WA+'Lo quiero</a></div></div>';

  window.scrollTo(0,0);
  document.title=p.descripcion+" · Kiosko";
  if(!sinHash)history.pushState({s:p.slug},"","#"+p.slug);
  else if(location.hash!=="#"+p.slug)history.replaceState({s:p.slug},"","#"+p.slug);

  var cinta=document.getElementById("cinta"),pts=document.getElementById("puntos");
  if(pts)cinta.addEventListener("scroll",function(){
    var i=Math.round(cinta.scrollLeft/cinta.clientWidth);
    Array.prototype.forEach.call(pts.children,function(d,j){d.classList.toggle("on",j===i);});
  },{passive:true});
  document.getElementById("atras").addEventListener("click",function(){history.back();});
  [document.getElementById("compartir"),document.getElementById("b-compartir")].forEach(function(b){
    if(b)b.addEventListener("click",function(){
      var u=location.origin+location.pathname+"#"+p.slug;
      if(navigator.share)navigator.share({title:p.descripcion,text:p.descripcion+" — "+mx(p.precio),url:u}).catch(function(){});
      else if(navigator.clipboard)navigator.clipboard.writeText(u);
    });
  });
  var bd=document.getElementById("b-dudas");
  if(bd)bd.addEventListener("click",function(){window.open(wa(p),"_blank");});
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-s]");if(!b)return;
  var p=porSlug(b.dataset.s);if(p)ver(p);
});
})();
</script>
</body>
</html>
