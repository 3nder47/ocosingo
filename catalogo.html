<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171226">
<title>Kiosko · lo que hay hoy</title>
<meta name="description" content="Audífonos, relojes, bocinas y más en Ocosingo. Envío a domicilio $10.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kiosko · lo que hay hoy">
<meta property="og:description" content="Audífonos, relojes, bocinas y más en Ocosingo. Envío a domicilio $10.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================================================================
   Kiosko · catálogo público
   Referencia: el puesto de mercado. Bandas de color saturado como el
   telar chiapaneco, precios en etiqueta de cartulina, tipografía de
   cartel pintado. La foto del producto manda; el color la enmarca.
   ================================================================ */
:root{
  --tinta:#171226;        /* índigo casi negro, base de todo */
  --papel:#FFFDF7;        /* blanco cálido de cartulina */
  --fucsia:#E8175D;
  --turquesa:#00B3A4;
  --sol:#FFC42E;
  --naranja:#FF6B35;
  --violeta:#7B3FF2;
  --verde:#1D9E75;
  --humo:#6F6880;
  --linea:#E6E0D6;
  --r:20px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--papel);color:var(--tinta);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--fucsia);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.display{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400;letter-spacing:-.02em;line-height:.92}

/* ---------- portada: bloque de color ---------- */
.top{background:var(--tinta);color:var(--papel);padding:26px 0 0;position:relative;overflow:hidden}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(90deg,var(--fucsia) 0 20%,var(--sol) 20% 40%,var(--turquesa) 40% 60%,var(--naranja) 60% 80%,var(--violeta) 80% 100%)}
.marca{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.marca h1{font-size:clamp(2.9rem,13vw,4.6rem);color:var(--papel)}
.marca h1 em{font-style:normal;color:var(--sol)}
.lema{font-size:1rem;font-weight:700;color:#C9C2DA;margin-top:10px;max-width:30ch;line-height:1.45}
.cinta{margin-top:20px;background:var(--sol);color:var(--tinta);overflow:hidden;white-space:nowrap;
  padding:9px 0;font-weight:800;font-size:0.875rem}
.cinta div{display:inline-block;animation:corre 26s linear infinite}
.cinta span{padding:0 26px}
@keyframes corre{to{transform:translateX(-50%)}}

/* ---------- buscador ---------- */
.busca{position:sticky;top:0;z-index:20;background:var(--papel);padding:14px 0 10px;box-shadow:0 10px 18px -14px rgba(23,18,38,.4)}
.campo{display:flex;align-items:center;gap:11px;background:#fff;border:2.5px solid var(--tinta);border-radius:999px;padding:13px 18px}
.campo svg{width:19px;height:19px;stroke:var(--tinta);fill:none;stroke-width:2.6;stroke-linecap:round;flex-shrink:0}
.campo input{flex:1;border:0;background:none;outline:0;font-size:1rem;font-weight:700;min-width:0;color:inherit}
.campo input::placeholder{color:var(--humo);font-weight:600}
.campo .x{width:26px;height:26px;border-radius:50%;background:var(--tinta);color:var(--papel);font-size:0.75rem;font-weight:800;flex-shrink:0;display:none}
.campo.lleno .x{display:block}

/* ---------- rótulos de sección ---------- */
.rotulo{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:30px 0 14px}
.rotulo h2{font-family:'Archivo Black',sans-serif;font-size:1.5rem;letter-spacing:-.02em}
.rotulo p{font-size:0.875rem;font-weight:700;color:var(--humo)}
.rotulo button{font-size:0.875rem;font-weight:800;color:var(--fucsia);border-bottom:2.5px solid var(--fucsia);padding-bottom:1px}

/* ---------- categorías ---------- */
.cuadros{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.cuadros{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.cuadros{grid-template-columns:repeat(4,1fr)}}
.cuadro{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;background:var(--c,var(--turquesa));
  text-align:left;display:block;transition:transform .16s var(--ease)}
.cuadro:active{transform:scale(.96)}
.cuadro img{position:absolute;right:-8%;bottom:2%;width:78%;height:68%;object-fit:contain;opacity:0;
  transition:opacity .4s;filter:drop-shadow(0 10px 18px rgba(23,18,38,.3))}
.cuadro img.ok{opacity:1}
.cuadro b{position:absolute;left:14px;top:13px;right:14px;font-family:'Archivo Black',sans-serif;font-size:1.0625rem;
  line-height:1.05;color:#fff;text-shadow:0 2px 10px rgba(23,18,38,.3)}
.cuadro i{position:absolute;left:14px;bottom:12px;font-style:normal;font-size:0.75rem;font-weight:800;
  background:rgba(23,18,38,.82);color:#fff;padding:5px 10px;border-radius:999px}

/* ---------- tarjeta de producto ---------- */
.rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.rejilla{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.rejilla{grid-template-columns:repeat(4,1fr)}}
.tira{display:flex;gap:14px;overflow-x:auto;padding:2px 18px 10px;margin:0 -18px;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tira::-webkit-scrollbar{display:none}
.tira .pieza{flex:0 0 164px;scroll-snap-align:start}
.pieza{position:relative;background:#fff;border:2.5px solid var(--tinta);border-radius:var(--r);overflow:hidden;
  text-align:left;display:flex;flex-direction:column;transition:transform .16s var(--ease)}
.pieza:active{transform:scale(.97)}
.foto{position:relative;aspect-ratio:1/1;background:var(--c,#EFECE4);display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.foto img.ok{opacity:1}
.sello{position:absolute;top:9px;left:-3px;font-size:0.6875rem;font-weight:800;letter-spacing:.02em;
  padding:5px 11px 5px 12px;background:var(--fucsia);color:#fff;border-radius:0 999px 999px 0;
  box-shadow:2px 2px 0 var(--tinta);z-index:2}
.sello.nuevo{background:var(--violeta)}
.fotos-n{position:absolute;right:8px;bottom:8px;font-size:0.6875rem;font-weight:800;background:rgba(23,18,38,.8);
  color:#fff;padding:4px 9px;border-radius:999px}
.datos{padding:11px 12px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.datos b{font-size:0.875rem;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.25em}
.precio{align-self:flex-start;margin-top:auto;font-family:'Archivo Black',sans-serif;font-size:1.1875rem;
  background:var(--sol);color:var(--tinta);padding:5px 11px;border-radius:7px;transform:rotate(-2deg);
  box-shadow:2px 2px 0 var(--tinta)}

/* ---------- vista de categoría ---------- */
.regreso{display:inline-flex;align-items:center;gap:8px;margin:16px 0 4px;padding:10px 18px 10px 13px;
  border-radius:999px;background:var(--tinta);color:var(--papel);font-size:0.875rem;font-weight:800}
.regreso svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.regreso:active{transform:scale(.96)}
.encabeza{margin:16px 0 18px;padding:20px 18px;border-radius:var(--r);background:var(--c,var(--turquesa));color:#fff}
.encabeza h2{font-family:'Archivo Black',sans-serif;font-size:2rem;line-height:1;letter-spacing:-.02em}
.encabeza p{font-size:0.9375rem;font-weight:700;margin-top:7px;opacity:.92}

/* ---------- ficha ---------- */
.telon{position:fixed;inset:0;background:rgba(23,18,38,.55);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:aparece .18s}
@keyframes aparece{from{opacity:0}}
.ficha{width:100%;max-width:560px;background:var(--papel);border-radius:26px 26px 0 0;max-height:94vh;overflow-y:auto;
  animation:sube .42s var(--ease)}
@keyframes sube{from{transform:translateY(100%)}}
.asa{width:40px;height:5px;border-radius:99px;background:rgba(23,18,38,.18);margin:10px auto 0}
.galeria{position:relative;background:var(--c,#EFECE4);margin-top:10px}
.pista{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pista::-webkit-scrollbar{display:none}
.pista img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start;display:block}
.puntos{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.puntos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);transition:all .2s}
.puntos i.on{background:#fff;width:20px;border-radius:4px}
.cuerpo{padding:20px 20px 24px}
.cat-chip{display:inline-block;font-size:0.75rem;font-weight:800;padding:5px 12px;border-radius:999px;
  background:var(--c,var(--turquesa));color:#fff}
.cuerpo h3{font-family:'Archivo Black',sans-serif;font-size:1.625rem;line-height:1.1;margin-top:12px;letter-spacing:-.02em}
.precio-gr{display:inline-block;margin-top:16px;font-family:'Archivo Black',sans-serif;font-size:2.5rem;
  background:var(--sol);color:var(--tinta);padding:9px 18px;border-radius:11px;transform:rotate(-1.6deg);
  box-shadow:4px 4px 0 var(--tinta)}
.envio{display:flex;gap:12px;margin-top:22px;padding:14px 16px;border:2.5px solid var(--tinta);border-radius:16px}
.envio svg{width:22px;height:22px;stroke:var(--tinta);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
.envio b{display:block;font-size:0.9375rem;font-weight:800}
.envio small{display:block;font-size:0.8125rem;font-weight:600;color:var(--humo);margin-top:3px;line-height:1.45}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:19px;
  border-radius:16px;background:var(--verde);color:#fff;font-size:1.0625rem;font-weight:800;
  box-shadow:4px 4px 0 var(--tinta);transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.wa:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tinta)}
.wa svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}
.cierra{width:100%;padding:16px;font-weight:800;color:var(--humo);font-size:0.9375rem}

/* ---------- estados ---------- */
.aviso{text-align:center;padding:70px 20px}
.aviso b{display:block;font-family:'Archivo Black',sans-serif;font-size:1.25rem;margin-bottom:8px}
.aviso p{font-size:0.9375rem;font-weight:600;color:var(--humo);line-height:1.5}
.hueco{border:2.5px solid var(--linea);border-radius:var(--r);aspect-ratio:.78;background:#fff}
.pie{margin-top:44px;padding:26px 18px 10px;border-top:2.5px solid var(--tinta);text-align:center}
.pie p{font-size:0.8125rem;font-weight:600;color:var(--humo);line-height:1.6}
.pie a{font-weight:800;color:var(--fucsia)}

/* una sola entrada orquestada al cargar; nada de animar cada tarjeta en cada scroll */
.entra>*{animation:asciende .5s var(--ease) both}
.entra>*:nth-child(1){animation-delay:.02s}.entra>*:nth-child(2){animation-delay:.06s}
.entra>*:nth-child(3){animation-delay:.1s}.entra>*:nth-child(4){animation-delay:.14s}
.entra>*:nth-child(5){animation-delay:.18s}.entra>*:nth-child(n+6){animation-delay:.22s}
@keyframes asciende{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="marca"><h1 class="display">Kios<em>ko</em></h1></div>
    <p class="lema">Lo que tenemos hoy en Ocosingo. Si te gusta algo, mándanos un mensaje y te lo llevamos.</p>
  </div>
  <div class="cinta"><div id="cinta"></div></div>
</header>

<div class="wrap">
  <div class="busca">
    <div class="campo" id="campo">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="¿Qué estás buscando?" autocomplete="off">
      <button class="x" id="qx" aria-label="Borrar búsqueda">&#10005;</button>
    </div>
  </div>
  <main id="vista"></main>
  <footer class="pie">
    <p>Los precios pueden cambiar. Lo que ves aquí es lo que hay.<br>
    ¿No encuentras lo que buscas? <a id="pie-wa" href="#">Pregúntanos por WhatsApp</a></p>
  </footer>
</div>

<div id="ficha"></div>

<script src="config.js"></script>
<script>
/* Catálogo público de Kiosko.
   Los datos vienen de catalogoPublico, la única acción del backend sin token:
   descripción, categoría, precio, fotos, si es la última pieza y a qué WhatsApp
   escribe el cliente. Nunca costos, ni cuántas piezas hay, ni de quién es. */
const API=(window.OC_CONFIG||{}).API_URL||'';
const WA='525614842235';
const CACHE='kiosko:catalogo';
const BASE=location.origin+location.pathname;
const NUEVO_DIAS=45;

/* Cada categoría tiene su color: el cliente aprende a reconocerlas por el tono. */
const COLOR={
  'Audífonos':'#E8175D','Smartwatch y relojes':'#7B3FF2','Bocinas y altavoces':'#FF6B35',
  'Mesas y sillas plegables':'#00B3A4','Cuidado personal':'#F0417C','Herramientas':'#2B7FFF',
  'Accesorios de celular':'#00A86B','Hogar':'#FF9B21','TV y electrónica':'#5B5BF0',
  'Incubadoras':'#C2410C','Regalos':'#D4157E','Joyería':'#B8860B','Bolsos y accesorios':'#8B5CF6'
};
const PALETA=['#E8175D','#7B3FF2','#FF6B35','#00B3A4','#2B7FFF','#F0417C','#00A86B','#FF9B21'];
function color(cat){
  if(COLOR[cat])return COLOR[cat];
  let h=0;for(const ch of String(cat||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return PALETA[h%PALETA.length];
}

let items=[],cat=null,abierta=null;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pesos=n=>Math.round(Number(n)||0).toLocaleString('es-MX');
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fotos=p=>[p.imagen].concat(p.extras||[]).filter(Boolean);
const wa=(n,t)=>'https://wa.me/'+(n||WA)+'?text='+encodeURIComponent(t);
const esNuevo=p=>p.agregado&&(Date.now()-p.agregado)<NUEVO_DIAS*864e5;

document.getElementById('pie-wa').href=wa(WA,'Hola, ¿tienen algo más disponible?');

const q=document.getElementById('q'),campo=document.getElementById('campo');
q.addEventListener('input',()=>{campo.classList.toggle('lleno',!!q.value);pinta();});
document.getElementById('qx').onclick=()=>{q.value='';campo.classList.remove('lleno');pinta();q.focus();};

/* La cinta amarilla dice lo práctico: envío, horario, cuántas cosas hay. */
function cinta(){
  const n=items.length;
  const frases=['Envío a domicilio $10 en el centro de Ocosingo','De lunes a viernes, 9:00 a 20:30',
    n?n+' productos disponibles ahora mismo':'Estamos surtiendo','Te lo llevamos el mismo día'];
  const linea=frases.map(f=>'<span>'+esc(f)+'</span>').join('');
  document.getElementById('cinta').innerHTML=linea+linea;
}

function tarjeta(p){
  const n=fotos(p).length;
  const sello=p.ultima?'<span class="sello">Última pieza</span>'
    :(esNuevo(p)?'<span class="sello nuevo">Nuevo</span>':'');
  return `<button class="pieza" data-s="${esc(slug(p.descripcion))}">
    <div class="foto" style="--c:${color(p.categoria)}22">${sello}
      ${n>1?'<span class="fotos-n">'+n+' fotos</span>':''}
      <img src="${esc(p.imagen)}" alt="${esc(p.descripcion)}" loading="lazy" decoding="async"
        onload="this.classList.add('ok')" onerror="this.closest('.pieza').remove()"></div>
    <div class="datos"><b>${esc(p.descripcion)}</b><span class="precio">$${pesos(p.precio)}</span></div>
  </button>`;
}

function pinta(){
  const vista=document.getElementById('vista');
  const t=norm(q.value.trim()),palabras=t?t.split(/\s+/):[];

  if(palabras.length){
    const l=items.filter(p=>{const x=norm(p.descripcion+' '+p.categoria);return palabras.every(w=>x.indexOf(w)>-1);});
    vista.innerHTML=l.length
      ?`<div class="rotulo"><h2 class="display">${l.length} resultado${l.length===1?'':'s'}</h2></div>
        <div class="rejilla entra">${l.map(tarjeta).join('')}</div>`
      :`<div class="aviso"><b>No encontramos eso</b><p>Prueba con otra palabra, o borra la búsqueda para ver todo lo que hay.</p></div>`;
    cablea();return;
  }

  if(cat){
    const l=items.filter(p=>p.categoria===cat),c=color(cat);
    vista.innerHTML=`<button class="regreso" id="regreso"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Todas las categorías</button>
      <div class="encabeza" style="--c:${c}"><h2>${esc(cat)}</h2><p>${l.length} producto${l.length===1?'':'s'} disponible${l.length===1?'':'s'}</p></div>
      <div class="rejilla entra">${l.map(tarjeta).join('')}</div>`;
    cablea();return;
  }

  const nuevos=items.filter(esNuevo).sort((a,b)=>b.agregado-a.agregado).slice(0,10);
  const ultimas=items.filter(p=>p.ultima).slice(0,10);
  const cuenta={},foto={};
  items.forEach(p=>{cuenta[p.categoria]=(cuenta[p.categoria]||0)+1;if(!foto[p.categoria])foto[p.categoria]=p.imagen;});
  const cats=Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a]);

  vista.innerHTML=
    (nuevos.length?`<div class="rotulo"><h2 class="display">Acaba de llegar</h2></div>
      <div class="tira entra">${nuevos.map(tarjeta).join('')}</div>`:'')+
    `<div class="rotulo"><h2 class="display">Busca por tipo</h2><p>${cats.length} categorías</p></div>
     <div class="cuadros entra">${cats.map(c=>`<button class="cuadro" data-cat="${esc(c)}" style="--c:${color(c)}">
        <b>${esc(c)}</b><i>${cuenta[c]}</i>
        <img src="${esc(foto[c])}" alt="" loading="lazy" onload="this.classList.add('ok')"></button>`).join('')}</div>`+
    (ultimas.length?`<div class="rotulo"><h2 class="display">Queda una sola</h2><p>Si te late, no lo dejes ir</p></div>
      <div class="tira entra">${ultimas.map(tarjeta).join('')}</div>`:'');
  cablea();
}

function cablea(){
  document.querySelectorAll('.pieza').forEach(b=>b.onclick=()=>abrir(b.dataset.s));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>irCat(b.dataset.cat));
  const r=document.getElementById('regreso');if(r)r.onclick=()=>irCat(null);
}
function irCat(c){
  cat=c;history.replaceState(null,'',c?'#'+slug(c):BASE);
  pinta();window.scrollTo({top:0,behavior:'smooth'});
}

function abrir(s){
  const p=items.filter(x=>slug(x.descripcion)===s)[0];if(!p)return;
  abierta=p;
  const fs=fotos(p),c=color(p.categoria);
  const texto='Hola, me interesa este producto:\n\n'+p.descripcion+'\n$'+pesos(p.precio)+'\n\n'+BASE+'#p='+slug(p.descripcion);
  const WASVG='<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2m0 18.02h-.01c-1.52 0-3.01-.41-4.3-1.18l-.31-.18-3.2.84.85-3.12-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.05.14-1.16-.06-.11-.22-.17-.47-.29"/></svg>';
  const CAMION='<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>';
  document.getElementById('ficha').innerHTML=
    `<div class="telon" id="telon"><div class="ficha">
      <div class="asa"></div>
      <div class="galeria" style="--c:${c}22">
        ${p.ultima?'<span class="sello">Última pieza</span>':''}
        <div class="pista" id="pista">${fs.map(u=>`<img src="${esc(u)}" alt="${esc(p.descripcion)}" loading="lazy">`).join('')}</div>
        ${fs.length>1?`<div class="puntos" id="puntos">${fs.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}
      </div>
      <div class="cuerpo">
        <span class="cat-chip" style="--c:${c}">${esc(p.categoria)}</span>
        <h3>${esc(p.descripcion)}</h3>
        <div class="precio-gr">$${pesos(p.precio)}</div>
        <div class="envio">${CAMION}<div><b>Te lo llevamos por $10</b>
          <small>Centro de Ocosingo, de lunes a viernes entre 9:00 y 20:30. Si vives más lejos, pregúntanos.</small></div></div>
        <a class="wa" target="_blank" rel="noopener" href="${esc(wa(p.wa,texto))}">${WASVG}Preguntar por este</a>
        <button class="cierra" onclick="cerrar()">Cerrar</button>
      </div>
    </div></div>`;
  document.body.style.overflow='hidden';
  history.replaceState(null,'','#p='+slug(p.descripcion));
  document.getElementById('telon').onclick=e=>{if(e.target.id==='telon')cerrar();};
  const g=document.getElementById('pista');
  if(g&&fs.length>1)g.onscroll=()=>{
    const i=Math.round(g.scrollLeft/g.clientWidth);
    document.querySelectorAll('#puntos i').forEach((d,k)=>d.classList.toggle('on',k===i));
  };
}
function cerrar(){
  abierta=null;document.getElementById('ficha').innerHTML='';document.body.style.overflow='';
  history.replaceState(null,'',cat?'#'+slug(cat):BASE);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&abierta)cerrar();});

function entrar(l){
  items=l;cinta();
  const h=decodeURIComponent(location.hash.replace('#',''));
  if(h.indexOf('p=')===0){pinta();abrir(h.slice(2));return;}
  if(h){const m=l.map(p=>p.categoria).filter(c=>slug(c)===h)[0];if(m)cat=m;}
  pinta();
}
function cargar(){
  document.getElementById('vista').innerHTML=
    '<div class="rotulo"><h2 class="display">Cargando</h2></div><div class="cuadros">'+
    Array.from({length:6},()=>'<div class="hueco"></div>').join('')+'</div>';
  cinta();
  let previo=null;
  try{const c=localStorage.getItem(CACHE);if(c)previo=JSON.parse(c);}catch(e){}
  if(previo&&previo.length)entrar(previo);
  if(!API){document.getElementById('vista').innerHTML='<div class="aviso"><b>Falta la configuración</b><p>Avísale a Alex.</p></div>';return;}
  fetch(API+'?accion=catalogoPublico',{redirect:'follow'})
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok||!Array.isArray(j.data))throw new Error(j.error||'respuesta inesperada');
      try{localStorage.setItem(CACHE,JSON.stringify(j.data));}catch(e){}
      if(abierta)items=j.data;else entrar(j.data);
    })
    .catch(()=>{
      if(previo&&previo.length)return;
      document.getElementById('vista').innerHTML='<div class="aviso"><b>No se pudo cargar</b>'+
        '<p>Revisa tu conexión, o <a href="'+wa(WA,'Hola, no me carga el catálogo')+'" style="color:var(--fucsia);font-weight:800">escríbenos</a> y te decimos qué hay.</p></div>';
    });
}
cargar();
</script>
</body>
</html>
