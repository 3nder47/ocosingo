<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B2A21">
<title>Kiosko · Catálogo</title>
<meta name="description" content="Audífonos, smartwatch, bocinas y más. Envío a domicilio $10 en el centro de Ocosingo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kiosko · Catálogo">
<meta property="og:description" content="Audífonos, smartwatch, bocinas y más. Envío a domicilio $10 en el centro de Ocosingo.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F4F5F3; --card:#FFFFFF; --card-2:#EDEFEB;
  --ink:#0C1410; --muted:#5F6B64; --line:rgba(12,20,16,.09);
  --verde:#0B2A21; --lima:#1D9E75; --lima-ink:#0B5741; --lima-soft:#DCF2E8;
  --mango:#F5A524; --crema:#FFF6E8;
  --sh:0 1px 2px rgba(12,20,16,.04),0 10px 30px -14px rgba(12,20,16,.18);
  --sh-alta:0 20px 50px -20px rgba(12,20,16,.35);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0A0D0B; --card:#151A17; --card-2:#1E2521;
    --ink:#F2F5F3; --muted:#95A29B; --line:rgba(255,255,255,.1);
    --verde:#071C16; --lima:#34C48F; --lima-ink:#A7EFD3; --lima-soft:rgba(52,196,143,.15);
    --crema:rgba(245,165,36,.12);
    --sh:0 1px 0 rgba(255,255,255,.03),0 12px 34px -16px rgba(0,0,0,.7);
    --sh-alta:0 22px 56px -22px rgba(0,0,0,.85);
  }
  .card,.tile,.sheet,.chip-envio,.buscar{border:1px solid var(--line)}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

/* ============ PORTADA: HERO ============ */
.hero{position:relative;background:var(--verde);color:#fff;padding:26px 0 120px;overflow:hidden;
  border-radius:0 0 34px 34px;margin-bottom:-96px}
.hero::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,158,117,.55),transparent 68%);top:-230px;right:-180px;pointer-events:none}
.hero::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,165,36,.22),transparent 70%);bottom:-190px;left:-150px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.marca{display:flex;align-items:center;gap:11px}
.marca .mk{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--verde);display:grid;place-items:center;
  font-weight:800;font-size:0.9375rem;letter-spacing:-.04em}
.marca b{font-size:1.0625rem;font-weight:800;letter-spacing:-.02em}
.titular{font-size:2.375rem;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-top:26px;max-width:9ch}
.titular em{font-style:normal;color:var(--lima);display:block}
@media (min-width:620px){.titular{font-size:3.5rem;max-width:14ch}}
.bajada{font-size:0.9375rem;font-weight:600;opacity:.72;margin-top:12px;max-width:30ch;line-height:1.5}
.chip-envio{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:10px 16px 10px 12px;border-radius:999px;
  background:rgba(255,255,255,.13);backdrop-filter:blur(8px);font-size:0.8125rem;font-weight:700}
.chip-envio svg{width:19px;height:19px;stroke:var(--lima);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip-envio span{opacity:.8;font-weight:600}

/* collage de fotos reales dentro del hero */
.collage{position:absolute;right:-26px;top:74px;width:250px;height:250px;pointer-events:none;display:none}
@media (min-width:620px){.collage{display:block;right:10px;top:56px;width:330px;height:330px}}
.collage i{position:absolute;width:132px;height:132px;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 26px 50px -18px rgba(0,0,0,.6);animation:flota 7s ease-in-out infinite}
.collage i img{width:100%;height:100%;object-fit:cover}
.collage i:nth-child(1){left:0;top:26px;transform:rotate(-9deg)}
.collage i:nth-child(2){right:6px;top:0;transform:rotate(7deg);animation-delay:-2.3s}
.collage i:nth-child(3){left:56px;bottom:0;transform:rotate(3deg);animation-delay:-4.6s}
@media (min-width:620px){.collage i{width:168px;height:168px;border-radius:26px}}
@keyframes flota{0%,100%{translate:0 0}50%{translate:0 -11px}}

/* ============ BUSCADOR FLOTANTE ============ */
.buscar{position:relative;z-index:5;display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:18px;padding:15px 18px;box-shadow:var(--sh-alta)}
.buscar svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
.buscar input{flex:1;border:0;background:none;outline:0;font-size:1rem;font-weight:600;min-width:0;color:inherit}
.buscar input::placeholder{color:var(--muted);font-weight:500}
.buscar .x{width:28px;height:28px;border-radius:50%;background:var(--card-2);color:var(--muted);font-weight:800;
  font-size:0.75rem;flex-shrink:0;display:none}
.buscar.lleno .x{display:block}

/* ============ SECCIONES ============ */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:34px 2px 14px}
.sec h2{font-size:1.5rem;font-weight:800;letter-spacing:-.035em}
.sec .n{font-size:0.8125rem;font-weight:700;color:var(--muted)}
.sec button{font-size:0.8125rem;font-weight:800;color:var(--lima);white-space:nowrap}

/* ============ CATEGORÍAS: mosaico grande ============ */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:1/1.12;background:var(--card-2);
  box-shadow:var(--sh);text-align:left;transition:transform .3s var(--ease),box-shadow .3s var(--ease);animation:sube .5s var(--ease) both}
.tile:first-child{grid-column:span 2;aspect-ratio:2.1/1}
@media (min-width:620px){.tile:first-child{grid-column:span 2;aspect-ratio:2.3/1.12}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .5s,transform .5s var(--ease);transform:scale(1.02)}
.tile img.ok{opacity:1}
.tile .velo{position:absolute;inset:0;background:linear-gradient(175deg,rgba(11,42,33,.08) 30%,rgba(11,42,33,.86) 100%)}
.tile .tx{position:absolute;left:15px;right:15px;bottom:14px;color:#fff}
.tile .tx b{display:block;font-size:1.0625rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.tile .tx small{display:block;font-size:0.75rem;font-weight:700;opacity:.82;margin-top:3px}
.tile:active{transform:scale(.975)}
@media (pointer:fine){.tile:hover{transform:translateY(-5px);box-shadow:var(--sh-alta)}.tile:hover img{transform:scale(1.08)}}

/* ============ FRANJA HORIZONTAL ============ */
.strip{display:flex;gap:14px;overflow-x:auto;padding:2px 18px 10px;margin:0 -18px;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
@media (pointer:fine){.strip{cursor:grab}}
.arrastrando{cursor:grabbing!important;user-select:none}
.arrastrando *{pointer-events:none}
.strip .card{flex:0 0 168px;scroll-snap-align:start}
@media (min-width:620px){.strip .card{flex:0 0 210px}}

/* ============ TARJETA DE PRODUCTO ============ */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--sh);text-align:left;
  display:flex;flex-direction:column;transition:transform .28s var(--ease),box-shadow .28s var(--ease);animation:sube .5s var(--ease) both}
@keyframes sube{from{opacity:0;transform:translateY(14px)}}
.card:active{transform:scale(.975)}
@media (pointer:fine){.card:hover{transform:translateY(-6px);box-shadow:var(--sh-alta)}.card:hover .ph img{transform:scale(1.07)}}
.ph{position:relative;aspect-ratio:1/1;background:var(--card-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .5s var(--ease)}
.ph img.ok{opacity:1}
.tag{position:absolute;top:11px;left:11px;font-size:0.6875rem;font-weight:800;padding:5px 11px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.06em;z-index:2}
.tag.ult{background:var(--mango);color:#231400}
.tag.new{background:var(--verde);color:#fff}
@media (prefers-color-scheme:dark){.tag.new{background:#fff;color:#0A0D0B}}
.mas{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px);color:#fff;font-size:0.6875rem;font-weight:800;display:grid;place-items:center;z-index:2}
.precio-pill{position:absolute;left:11px;bottom:11px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);color:var(--verde);font-size:1rem;font-weight:800;letter-spacing:-.03em;z-index:2;
  box-shadow:0 6px 18px -6px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){.precio-pill{background:rgba(10,13,11,.86);color:var(--lima)}}
.card .nom{padding:13px 14px 15px;font-size:0.875rem;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}

/* ============ VISTA DE CATEGORÍA ============ */
.top-cat{position:relative;border-radius:0 0 30px 30px;overflow:hidden;margin:0 -18px 6px;padding:22px 18px 26px;
  background:var(--verde);color:#fff}
.top-cat::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,158,117,.5),transparent 68%);top:-190px;right:-120px}
.top-cat .in{position:relative;z-index:1}
.volver{display:inline-flex;align-items:center;gap:8px;padding:9px 16px 9px 11px;border-radius:999px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);font-size:0.8125rem;font-weight:800}
.volver svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.top-cat h2{font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:16px}
.top-cat small{display:block;font-size:0.875rem;font-weight:600;opacity:.72;margin-top:6px}

/* ============ FICHA ============ */
.overlay{position:fixed;inset:0;background:rgba(6,14,10,.6);backdrop-filter:blur(6px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .22s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:580px;background:var(--bg);border-radius:30px 30px 0 0;
  max-height:96vh;overflow-y:auto;animation:sube-hoja .42s var(--ease);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@keyframes sube-hoja{from{transform:translateY(100%)}}
.cerrar-x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center}
.cerrar-x svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.gal{position:relative;border-radius:30px 30px 26px 26px;overflow:hidden;background:var(--card-2)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start}
.gal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.gal-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .25s;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gal-dots i.on{background:#fff;width:20px;border-radius:4px}
.gal .tag{top:14px;left:14px}
.det{padding:22px 20px 0}
.det .cat-nom{display:inline-block;font-size:0.6875rem;font-weight:800;color:var(--lima-ink);background:var(--lima-soft);
  padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.07em}
.det h3{font-size:1.625rem;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:12px}
.det .pr{font-size:2.75rem;font-weight:800;color:var(--lima);letter-spacing:-.05em;margin-top:10px;line-height:1}
.dato{display:flex;gap:12px;margin-top:20px;padding:15px 16px;border-radius:18px;background:var(--crema)}
.dato svg{width:21px;height:21px;stroke:var(--mango);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
.dato b{display:block;font-size:0.875rem;font-weight:800}
.dato small{display:block;font-size:0.8125rem;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.5}
.barra-wa{position:absolute;bottom:0;left:0;right:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 26%);pointer-events:none}
.wa{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;
  border-radius:20px;background:var(--lima);color:#fff;font-size:1.0625rem;font-weight:800;
  box-shadow:0 14px 34px -12px rgba(29,158,117,.75);transition:transform .16s var(--ease)}
.wa:active{transform:scale(.975)}
.wa svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}

/* ============ ESTADOS Y PIE ============ */
.msg{text-align:center;padding:70px 24px;color:var(--muted);font-size:0.9375rem;font-weight:600}
.msg b{display:block;color:var(--ink);font-size:1.25rem;margin-bottom:8px;letter-spacing:-.02em}
.sk{border-radius:24px;background:var(--card);aspect-ratio:1/1.3;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(100deg,transparent 22%,rgba(29,158,117,.12) 50%,transparent 78%);animation:brillo 1.5s ease-in-out infinite}
@keyframes brillo{to{transform:translateX(100%)}}
.pie{margin-top:46px;padding:30px 18px calc(34px + env(safe-area-inset-bottom));background:var(--verde);color:#fff;
  border-radius:34px 34px 0 0;text-align:center}
.pie b{display:block;font-size:1.125rem;font-weight:800;letter-spacing:-.025em}
.pie p{font-size:0.875rem;font-weight:600;opacity:.68;margin-top:8px;line-height:1.55;max-width:34ch;margin-inline:auto}
.pie a{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:14px 24px;border-radius:999px;
  background:var(--lima);color:#fff;font-size:0.9375rem;font-weight:800}
.pie a svg{width:19px;height:19px;fill:currentColor}
.pie .fino{display:block;margin-top:20px;font-size:0.75rem;opacity:.42;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="cabeza"></div>
<div class="wrap"><div id="vista"></div></div>

<div class="pie">
  <b>¿Buscas algo que no está aquí?</b>
  <p>Escríbenos y te decimos si lo conseguimos. Nos llega mercancía nueva cada semana.</p>
  <a id="pie-wa" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2m0 18.02h-.01c-1.52 0-3.01-.41-4.3-1.18l-.31-.18-3.2.84.85-3.12-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.05.14-1.16-.06-.11-.22-.17-.47-.29"/></svg>
    Escríbenos por WhatsApp
  </a>
  <span class="fino">Los precios pueden cambiar sin aviso. Disponibilidad sujeta a existencias.</span>
</div>

<div id="ficha"></div>

<script src="config.js"></script>
<script>
/* Catálogo público de Kiosko.
   Portada editorial: hero con collage de producto real, mosaico de categorías, franjas de
   Novedades y Últimas piezas. De ahí se entra a una categoría o a la ficha del producto.
   Los datos vienen de catalogoPublico, la única acción del backend sin token: descripción,
   categoría, precio, fotos, si es la última pieza y a qué WhatsApp escribe el cliente.
   Nunca costos, ni cuántas piezas quedan, ni de quién es la mercancía. */
const API=(window.OC_CONFIG||{}).API_URL||'';
const WA_GENERAL='525614842235';
const CACHE='kiosko:catalogo';
const URL_BASE=location.origin+location.pathname;
const DIAS_NUEVO=45;

var productos=[],cat=null,abierto=null;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pesos=n=>(Math.round(Number(n)||0)).toLocaleString('es-MX');
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fotos=p=>[p.imagen].concat(p.extras||[]).filter(Boolean);
const waLink=(num,txt)=>'https://wa.me/'+num+'?text='+encodeURIComponent(txt);
const esNuevo=p=>p.agregado&&(Date.now()-p.agregado)<DIAS_NUEVO*864e5;
const CAMION='<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>';
const WA_SVG='<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2m0 18.02h-.01c-1.52 0-3.01-.41-4.3-1.18l-.31-.18-3.2.84.85-3.12-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.05.14-1.16-.06-.11-.22-.17-.47-.29"/></svg>';

document.getElementById('pie-wa').href=waLink(WA_GENERAL,'Hola, ¿tienen algo más disponible?');

/* ---------- cabecera: hero en portada, banda verde en categoría ---------- */
function cabeza(){
  const el=document.getElementById('cabeza');
  if(cat){
    el.innerHTML='';
    return '<div class="top-cat"><div class="in">'+
      '<button class="volver" id="volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Todo el catálogo</button>'+
      '<h2>'+esc(cat)+'</h2><small id="sub-cat"></small></div></div>';
  }
  const tres=productos.slice(0,3);
  el.innerHTML='<div class="hero"><div class="wrap">'+
    '<div class="marca"><div class="mk">Ki</div><b>Kiosko</b></div>'+
    '<h1 class="titular">Lo bueno<em>está aquí</em></h1>'+
    '<p class="bajada">Audífonos, relojes, bocinas y más. Todo con entrega el mismo día en Ocosingo.</p>'+
    '<div class="chip-envio">'+CAMION+'Envío $10 <span>· centro de Ocosingo</span></div>'+
    (tres.length===3?'<div class="collage">'+tres.map(function(p){
      return '<i><img src="'+esc(p.imagen)+'" alt="" loading="lazy"></i>';}).join('')+'</div>':'')+
    '</div></div>';
  return '';
}

/* ---------- piezas ---------- */
function tarjeta(p,i){
  const n=fotos(p).length;
  const tag=p.ultima?'<span class="tag ult">Última</span>':(esNuevo(p)?'<span class="tag new">Nuevo</span>':'');
  return '<button class="card" data-s="'+esc(slug(p.descripcion))+'" style="animation-delay:'+(Math.min(i||0,9)*35)+'ms">'+
    '<div class="ph">'+tag+(n>1?'<span class="mas">'+n+'</span>':'')+
    '<span class="precio-pill">$'+pesos(p.precio)+'</span>'+
    '<img src="'+esc(p.imagen)+'" alt="'+esc(p.descripcion)+'" loading="lazy" decoding="async" '+
    'onload="this.classList.add(\'ok\')" onerror="this.closest(\'.card\').remove()"></div>'+
    '<div class="nom">'+esc(p.descripcion)+'</div></button>';
}
function franja(titulo,lista){
  if(!lista.length)return '';
  return '<div class="sec"><h2>'+esc(titulo)+'</h2><span class="n">'+lista.length+'</span></div>'+
    '<div class="strip">'+lista.map(tarjeta).join('')+'</div>';
}
function mosaico(){
  const c={},foto={};
  productos.forEach(function(p){c[p.categoria]=(c[p.categoria]||0)+1;if(!foto[p.categoria])foto[p.categoria]=p.imagen;});
  const cats=Object.keys(c).sort(function(a,b){return c[b]-c[a];});
  return '<div class="sec"><h2>Categorías</h2><span class="n">'+cats.length+'</span></div><div class="tiles">'+
    cats.map(function(x,i){
      return '<button class="tile" data-ver="'+esc(x)+'" style="animation-delay:'+(Math.min(i,9)*35)+'ms">'+
        '<img src="'+esc(foto[x])+'" alt="" loading="lazy" onload="this.classList.add(\'ok\')">'+
        '<div class="velo"></div><div class="tx"><b>'+esc(x)+'</b><small>'+c[x]+' producto'+(c[x]===1?'':'s')+'</small></div></button>';
    }).join('')+'</div>';
}

/* ---------- la vista que toca ---------- */
function pintar(){
  const el=document.getElementById('vista');
  const buscador='<div class="buscar" id="caja">'+
    '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
    '<input id="q" type="search" placeholder="Buscar producto" autocomplete="off" value="'+esc(window._q||'')+'">'+
    '<button class="x" id="q-x" aria-label="Borrar">&#10005;</button></div>';
  const enc=cabeza();
  const t=norm(window._q||''),palabras=t?t.trim().split(/\s+/).filter(Boolean):[];

  if(palabras.length){
    const l=productos.filter(function(p){
      const texto=norm(p.descripcion+' '+p.categoria);
      return palabras.every(function(w){return texto.indexOf(w)>-1;});
    });
    el.innerHTML=enc+buscador+(l.length
      ?'<div class="sec"><h2>Resultados</h2><span class="n">'+l.length+'</span></div><div class="grid">'+l.map(tarjeta).join('')+'</div>'
      :'<div class="msg"><b>Nada con ese nombre</b>Prueba con otra palabra o borra la búsqueda para ver todo.</div>');
    cablear();return;
  }
  if(cat){
    const l=productos.filter(function(p){return p.categoria===cat;});
    el.innerHTML=enc+buscador+'<div class="grid" style="margin-top:22px">'+l.map(tarjeta).join('')+'</div>';
    const s=document.getElementById('sub-cat');
    if(s)s.textContent=l.length+' producto'+(l.length===1?'':'s')+' disponible'+(l.length===1?'':'s');
    cablear();return;
  }
  const nuevos=productos.filter(esNuevo).sort(function(a,b){return b.agregado-a.agregado;}).slice(0,10);
  const ultimas=productos.filter(function(p){return p.ultima;}).slice(0,10);
  el.innerHTML=enc+buscador+franja('Recién llegado',nuevos)+mosaico()+franja('Últimas piezas',ultimas);
  cablear();
}

function cablear(){
  const q=document.getElementById('q'),caja=document.getElementById('caja');
  if(q){
    caja.classList.toggle('lleno',!!q.value);
    q.oninput=function(){
      window._q=q.value;
      const pos=q.selectionStart;
      pintar();
      const n=document.getElementById('q');
      if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
    };
    document.getElementById('q-x').onclick=function(){window._q='';pintar();const n=document.getElementById('q');if(n)n.focus();};
  }
  Array.prototype.forEach.call(document.querySelectorAll('.card'),function(b){b.onclick=function(){abrir(b.dataset.s);};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ver]'),function(b){b.onclick=function(){irCat(b.dataset.ver);};});
  const v=document.getElementById('volver');
  if(v)v.onclick=function(){irCat(null);};
  Array.prototype.forEach.call(document.querySelectorAll('.strip'),arrastrable);
}
function irCat(c){
  cat=c;window._q='';
  history.replaceState(null,'',c?'#'+slug(c):URL_BASE);
  pintar();window.scrollTo({top:0});
}

/* ---------- ficha ---------- */
function abrir(s){
  const p=productos.filter(function(x){return slug(x.descripcion)===s;})[0];
  if(!p)return;
  abierto=p;
  const fs=fotos(p);
  /* El mensaje lleva el link directo a este producto: al tocarlo se ve exactamente por cuál preguntan. */
  const texto='Hola, me interesa este producto:\n\n'+p.descripcion+'\n$'+pesos(p.precio)+'\n\n'+URL_BASE+'#p='+slug(p.descripcion);
  document.getElementById('ficha').innerHTML=
    '<div class="overlay" id="ov"><div class="sheet">'+
      '<button class="cerrar-x" onclick="cerrar()" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '<div class="gal">'+(p.ultima?'<span class="tag ult">Última pieza</span>':'')+
        '<div class="gal-track" id="gal">'+fs.map(function(u){return '<img src="'+esc(u)+'" alt="'+esc(p.descripcion)+'" loading="lazy">';}).join('')+'</div>'+
        (fs.length>1?'<div class="gal-dots" id="dots">'+fs.map(function(_,i){return '<i class="'+(i?'':'on')+'"></i>';}).join('')+'</div>':'')+
      '</div>'+
      '<div class="det">'+
        '<span class="cat-nom">'+esc(p.categoria)+'</span>'+
        '<h3>'+esc(p.descripcion)+'</h3>'+
        '<div class="pr">$'+pesos(p.precio)+'</div>'+
        '<div class="dato">'+CAMION+'<div><b>Envío a domicilio $10</b>'+
          '<small>Centro de Ocosingo · lunes a viernes de 9:00 a 20:30. Fuera del centro, pregúntanos.</small></div></div>'+
      '</div>'+
      '<div class="barra-wa"><a class="wa" target="_blank" rel="noopener" href="'+esc(waLink(p.wa||WA_GENERAL,texto))+'">'+
        WA_SVG+'Lo quiero</a></div>'+
    '</div></div>';
  document.body.style.overflow='hidden';
  history.replaceState(null,'','#p='+slug(p.descripcion));
  document.getElementById('ov').onclick=function(e){if(e.target.id==='ov')cerrar();};
  const g=document.getElementById('gal');
  if(g&&fs.length>1)g.onscroll=function(){
    const i=Math.round(g.scrollLeft/g.clientWidth);
    Array.prototype.forEach.call(document.querySelectorAll('#dots i'),function(d,k){d.classList.toggle('on',k===i);});
  };
}
function cerrar(){
  abierto=null;document.getElementById('ficha').innerHTML='';document.body.style.overflow='';
  history.replaceState(null,'',cat?'#'+slug(cat):URL_BASE);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&abierto)cerrar();});

/* Arrastrar franjas con mouse (con el dedo ya se deslizan) */
function arrastrable(el){
  if(el.dataset.drag)return;el.dataset.drag='1';
  var x0=0,sl0=0,act=false,mov=false;
  el.addEventListener('pointerdown',function(e){if(e.pointerType==='touch')return;act=true;mov=false;x0=e.clientX;sl0=el.scrollLeft;});
  el.addEventListener('pointermove',function(e){
    if(!act)return;var d=e.clientX-x0;
    if(!mov&&Math.abs(d)<4)return;
    mov=true;el.classList.add('arrastrando');e.preventDefault();el.scrollLeft=sl0-d;
  });
  var fin=function(){act=false;setTimeout(function(){el.classList.remove('arrastrando');},0);};
  el.addEventListener('pointerup',fin);el.addEventListener('pointerleave',fin);el.addEventListener('pointercancel',fin);
}

/* ---------- carga ---------- */
function entrar(l){
  productos=l;
  var h=decodeURIComponent(location.hash.replace('#',''));
  if(h.indexOf('p=')===0){pintar();abrir(h.slice(2));return;}
  if(h){
    var m=l.map(function(p){return p.categoria;}).filter(function(c){return slug(c)===h;})[0];
    if(m)cat=m;
  }
  pintar();
}
function cargar(){
  document.getElementById('vista').innerHTML='<div class="sec"><h2>Cargando…</h2></div><div class="grid">'+
    Array.apply(null,{length:6}).map(function(){return '<div class="sk"></div>';}).join('')+'</div>';
  var previo=null;
  try{var c=localStorage.getItem(CACHE);if(c)previo=JSON.parse(c);}catch(e){}
  if(previo&&previo.length)entrar(previo);
  if(!API){document.getElementById('vista').innerHTML='<div class="msg"><b>Falta configurar la dirección</b>Avísale a Alex.</div>';return;}
  fetch(API+'?accion=catalogoPublico',{redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.ok||!Array.isArray(j.data))throw new Error(j.error||'respuesta inesperada');
      try{localStorage.setItem(CACHE,JSON.stringify(j.data));}catch(e){}
      if(abierto)productos=j.data;else entrar(j.data);
    })
    .catch(function(){
      if(previo&&previo.length)return;
      document.getElementById('vista').innerHTML='<div class="msg"><b>No se pudo cargar el catálogo</b>'+
        'Revisa tu conexión o escríbenos por WhatsApp.</div>';
    });
}
cargar();
</script>
